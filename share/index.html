<style>

s", "u": "https://www.cnbc.com/2026/08/27/uae-spy-sheikh-trump-family-crypto-bank.html"}]}]}, {"cc": "JP", "name": "일본", "flag": "🇯🇵", "brief": "일본은행 부총재가 물가 움직임에 맞춘 금리 인상을 거듭 주장하며 9월 인상 가능성을 시장에 가격화시키고 있습니다. 엔화 약세와 중동 분쟁, AI 인프라 수요 등이 인플레 위험 요인으로 지목되면서 금통위의 매파적 기조가 강화될 것으로 예상됩니다. 한편 일본 금융감독당국은 AI 모델 고도화에 따른 금융시스템 위험에 대응하기 위해 은행들의 사이버보안 감시 범위를 간접 거래처까지 확대하도록 지시했습니다. 28년 만의 공동 엔화 개입 이후 일본 투자자들의 해외자산 투자 방향이 엇갈리고 있어 자본 유출입 변동성이 증가할 수 있습니다.", "date": "2026-08-28", "ind": [{"kind": "fx", "label": "JPY", "value": 159.327232, "chg": 0.2820887929265891, "note": null, "spark": [158.879052, 159.327232]}, {"kind": "index", "label": "닛케이225", "value": 66588.2109375, "chg": 0.8662270502552989, "note": null, "spark": [66016.359375, 66588.2109375]}, {"kind": "policy_rate", "label": "BOJ 정책금리", "value": 1.0, "chg": null, "note": "기준일 2026-07-31", "spark": null}], "arts": [{"cat": "경제", "src": "Kyodo News", "d": "2026-08-27", "t": "일본은행 부총재, 물가에 연동한 금리인상 촉구", "q": "일본은행 부총재가 물가 움직임에 맞춘 금리 인상을 주장했다. 이는 일본의 금리 인상 시점이 앞당겨질 가능성을 시사한다.", "ex": "일본은행 부총재가 물가 움직임에 맞춰 기준금리를 인상해야 한다고 촉구했다. 이는 일본이 물가 압력에 대응하면서 금리 조정 시기와 속도를 놓고 벌이는 중앙은행의 광범위한 논의를 반영한다.\n\n부총재의 발언은 적절한 정책 기조를 두고 일본은행 내 벌어지는 더 넓은 논쟁 속에서 나왔다. 일본은 수십 년간 디플레이션 압력에 직면해 있었으나, 최근 물가 상승은 주목할 만한 변화로서 정책 입안자들이 2008년 금융위기 이후 유지해온 초저금리 통화 정책을 재검토하도록 촉발했다.\n\n물가 움직임과 연동한 금리 인상 촉구는 일본은행이 데이터 기반 접근법을 채택할 수 있음을 시사한다. 이는 미리 정해진 일정이 아닌 실제 물가 지표에 따라 정책을 조정하는 방식으로, 경제 상황 변화에 유연하게 대응할 수 있게 한다.\n\n이 발언은 향후 금리 결정 시기에 대한 시장 기대에 영향을 미칠 가능성이 높으며, 물가 압력이 지속될 경우 추가 긴축이 뒤따를 수 있음을 시사할 수 있다. 투자자와 분석가들은 향후 물가 데이터와 일본은행 통신문을 주시하며 중앙은행의 정책 방향을 파악할 것이다.", "u": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE1XbTRnSXc3SHhZd2o5aFFuTjdZYi1QZzNabHhsYUFnVGdlUjE2a0FycHI1Q0JqdFhieExDcGdFZ2FpUGpXemtEMHJXWW9pRlJmUGdxV00wVFBTQQ?oc=5", "rl": [{"t": "BREAKING NEWS: BOJ deputy chief calls for rate hikes in line with price moves - Japan Wire by Kyodo ", "u": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE1XbTRnSXc3SHhZd2o5aFFuTjdZYi1QZzNabHhsYUFnVGdlUjE2a0FycHI1Q0JqdFhieExDcGdFZ2FpUGpXemtEMHJXWW9pRlJmUGdxV00wVFBTQQ?oc=5"}, {"t": "BOJ deputy Himino drives home inflation risks, stops short of hike hint", "u": "https://asia.nikkei.com/economy/bank-of-japan/boj-deputy-himino-drives-home-inflation-risks-stops-short-of-hike-hint"}]}, {"cat": "경제", "src": "Nikkei Asia", "d": "2026-08-28", "t": "BOJ 부총재, 인플레 위험 경고", "q": "중동 분쟁, AI 인프라 수요, 엔화 약세가 인플레 위험 요인으로 지목됐다. 9월 인상 가능성이 시장에서 가격화되고 있다.", "ex": "일본은행 히미노 부총재는 8월 27일 중동 분쟁, 인공지능 인프라 구축 자금 수요 증가, 엔화 약세 등 여러 요인이 인플레이션 위험을 초래할 수 있다고 경고했다. 사이타마현 기업 지도자들을 대상으로 한 발언에서 히미노는 인플레이션 우려를 강조했으나 임박한 기준금리 인상을 시사하지는 않았다.\n\n이 발언은 시장이 9월 기준금리 인상 가능성을 반영하기 시작한 가운데 나왔다. 엔화는 발언 이후 안정적으로 유지되었으나 채권 수익률은 투자자들이 일본은행의 인플레이션 입장과 정책 조정 시기를 평가하면서 등락을 보였다.\n\n지정학적 긴장, AI 관련 자본지출, 환율 하락 등 외부 인플레이션 압력에 대한 히미노의 초점은 일본은행이 국내 물가 압력이 현재 예상을 초과할 수 있다는 광범위한 우려를 반영한다. 부총재의 신중한 표현—기준금리 인상을 명시적으로 시사하지 않음—은 중앙은행이 행동을 취하기 전에 이러한 인플레이션 요인의 강도와 지속성을 여전히 평가 중임을 시사한다.", "u": "https://asia.nikkei.com/economy/bank-of-japan/boj-deputy-himino-drives-home-inflation-risks-stops-short-of-hike-hint", "rl": [{"t": "BOJ deputy Himino drives home inflation risks, stops short of hike hint", "u": "https://asia.nikkei.com/economy/bank-of-japan/boj-deputy-himino-drives-home-inflation-risks-stops-short-of-hike-hint"}, {"t": "BREAKING NEWS: BOJ deputy chief calls for rate hikes in line with price moves - Japan Wire by Kyodo ", "u": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE1XbTRnSXc3SHhZd2o5aFFuTjdZYi1QZzNabHhsYUFnVGdlUjE2a0FycHI1Q0JqdFhieExDcGdFZ2FpUGpXemtEMHJXWW9pRlJmUGdxV00wVFBTQQ?oc=5"}]}, {"cat": "경제", "src": "Nikkei Asia", "d": "2026-08-28", "t": "엔화 개입 후 해외자산 투자 의견 분분", "q": "일본과 미국이 28년 만에 공동 엔화 매입 개입을 단행했으나, 이후 일본 투자자들의 해외채권·주식 투자 방향이 엇갈리고 있다. 2주간의 매수세 이후 일부 투자자들이 외화자산 매도로 전환하는 모습을 보이고 있다.", "ex": "일본과 미국이 28년 만에 공동 엔화 매입 개입을 단행했으나, 이후 일본 투자자들의 해외채권·주식 투자 방향이 엇갈리고 있다. 2주간의 매수세 이후 일부 투자자들이 외화자산 매도로 전환하는 모습을 보이고 있다.", "u": "https://asia.nikkei.com/business/markets/currencies/yen-intervention-leaves-japanese-investors-divided-on
