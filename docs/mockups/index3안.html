  <style>
.gs-app {
  --navy: #0a1628;
  --navy2: #0d1f3c;
  --blue: #0066cc;
  --blue-box: rgba(0, 102, 204, 0.88);
  --green: #1a8f5a;
  --green-box: rgba(26, 143, 90, 0.92);
  --orange: #e85d04;
  --orange-box: rgba(232, 93, 4, 0.9);
  --ink: #ffffff;
  --muted: rgba(255,255,255,.72);
  --dim: rgba(255,255,255,.45);
  --line: rgba(255,255,255,.12);
  --card: #f5f7fa;
  --text: #1a1a2e;
  --text-muted: #5a6270;
  --header: 72px;
  --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--navy);
}
.gs-app * { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #0a1628; }
.gs-scroll {
  height: 100vh; overflow-y: auto; overflow-x: hidden;
  scroll-snap-type: y proximity;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.gs-fp {
  min-height: 100vh; scroll-snap-align: start; scroll-snap-stop: normal;
  position: relative;
  display: flex; flex-direction: column; overflow: hidden;
}
.gs-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500; height: var(--header);
  display: flex; flex-direction: column; align-items: stretch;
  transition: background .35s, box-shadow .35s;
}
.gs-header.solid { background: rgba(10,22,40,.96); box-shadow: 0 2px 20px rgba(0,0,0,.3); }
.gs-header-inner {
  width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px;
  height: var(--header); flex-shrink: 0;
  display: flex; align-items: center; gap: 20px;
}
.gs-logo {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex-shrink: 0;
}
.gs-logo-mark {
  width: 40px; height: 40px; background: #695647; border-radius: 4px;
  display: grid; place-items: center; padding: 5px; flex-shrink: 0;
}
.gs-logo-mark svg { width: 100%; height: 100%; display: block; }
.gs-logo-text { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.gs-logo-text em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 14px; display: block; }
.gs-nav {
  flex: 1; display: flex; justify-content: center; gap: 2px; overflow-x: auto; scrollbar-width: none;
}
.gs-nav::-webkit-scrollbar { display: none; }
.gs-nav-btn {
  border: 0; background: transparent; color: rgba(255,255,255,.75);
  font-size: 13px; font-weight: 500; padding: 10px 16px 14px; cursor: pointer;
  white-space: nowrap; transition: color .2s; font-family: var(--sans);
  border-radius: 12px; position: relative; isolation: isolate; user-select: none;
}
.gs-nav-btn::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
  border-radius: 0 0 12px 12px; background: #E5C04A;
  box-shadow: 0 0 12px rgba(229, 192, 74, .72); opacity: 0; transition: opacity .2s; z-index: -1;
}
.gs-nav-btn:hover, .gs-nav-btn.active { color: #fff; font-weight: 700; }
.gs-nav-btn:hover::after, .gs-nav-btn.active::after { opacity: 1; }
.gs-util { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.gs-util-link {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--ink);
  text-decoration: none; opacity: .85;
}
.gs-main-menu-btn {
  display: none; align-items: center; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.3); background: transparent; color: var(--ink);
  padding: 5px 10px; font-size: 11px; font-weight: 700; letter-spacing: -.02em;
  cursor: pointer; border-radius: 4px; white-space: nowrap; font-family: var(--sans);
  transition: border-color .2s, background .2s;
}
.gs-main-menu-btn:hover { border-color: #E5C04A; background: rgba(229, 192, 74, .12); }
html.gs-light .gs-main-menu-btn {
  border-color: rgba(26,26,46,.28);
}
html.gs-light .gs-main-menu-btn:hover {
  border-color: #E5C04A; background: rgba(229, 192, 74, .14);
}
.gs-lang { display: flex; gap: 4px; flex-shrink: 0; }
.gs-lang button {
  border: 1px solid rgba(255,255,255,.3); background: transparent; color: var(--ink);
  min-width: 36px; height: 32px; padding: 0 8px; font-size: 18px; line-height: 1;
  cursor: pointer; border-radius: 4px; display: grid; place-items: center;
}
.gs-lang button.on { background: var(--blue); border-color: var(--blue); }
.gs-theme-switch { flex-shrink: 0; }
.gs-theme-switch {
  width: 40px; height: 22px; border-radius: 11px; border: 1px solid #dcdfe6;
  background: #f2f2f2; padding: 0; cursor: pointer; position: relative; flex-shrink: 0;
  transition: background .35s cubic-bezier(.4,0,.2,1), border-color .35s cubic-bezier(.4,0,.2,1);
}
.gs-theme-switch.dark {
  background: #141414; border-color: #4c4d4f;
}
.gs-theme-switch__knob {
  position: absolute; top: 1px; left: 1px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12);
  display: grid; place-items: center;
  transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.gs-theme-switch.dark .gs-theme-switch__knob { transform: translateX(18px); }
.gs-theme-icon {
  width: 12px; height: 12px; position: absolute; color: #606266;
  transition: opacity .28s ease, transform .35s cubic-bezier(.4,0,.2,1);
}
.gs-theme-switch.dark .gs-theme-icon { color: #cfd3dc; }
.gs-theme-icon--sun { opacity: 1; transform: rotate(0deg) scale(1); }
.gs-theme-icon--moon { opacity: 0; transform: rotate(-25deg) scale(.75); }
.gs-theme-switch.dark .gs-theme-icon--sun { opacity: 0; transform: rotate(25deg) scale(.75); }
.gs-theme-switch.dark .gs-theme-icon--moon { opacity: 1; transform: rotate(0deg) scale(1); }
::view-transition-old(root),
::view-transition-new(root) {
  animation: none;
  mix-blend-mode: normal;
}
html[data-theme-transition="to-light"]::view-transition-new(root) { z-index: 2147483646; }
html[data-theme-transition="to-light"]::view-transition-old(root) { z-index: 1; }
html[data-theme-transition="to-dark"]::view-transition-old(root) { z-index: 2147483646; }
html[data-theme-transition="to-dark"]::view-transition-new(root) { z-index: 1; }

.gs-menu-btn {
  width: 36px; height: 36px; border: 0; background: transparent; cursor: pointer;
  display: none; flex-direction: column; justify-content: center; gap: 5px; padding: 6px; flex-shrink: 0;
}
.gs-menu-btn span { display: block; height: 2px; background: #fff; border-radius: 1px; transition: transform .25s, opacity .25s; }
.gs-header.nav-open .gs-menu-btn span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.gs-header.nav-open .gs-menu-btn span:nth-child(2) { opacity: 0; }
.gs-header.nav-open .gs-menu-btn span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  background: rgba(10,22,40,.98); border-bottom: 1px solid var(--line);

function getClockPopover() {

  if (pop) return pop
  const zone = document.querySelector('.gs-pulse-zone')

  pop = document.createElement('div')
  pop.id = 'clockPulsePopover'
  pop.className = 'gs-clk-popover'
  pop.hidden = true
  pop.innerHTML = '<span class="gs-clk-popover-label"></span><div class="gs-clk-popover-row"></div>'
  zone.appendChild(pop)
  pop.addEventListener('click', (e) => {
    e.stopPropagation()
    const btn = e.target.closest('.gs-clk-popover-opt')
    if (!btn || !clockPopoverCountry) return
    savePulse(clockPopoverCountry, btn.dataset.level)
    closeAllClockPickers()
    updateClockUI()
  })
  return pop
}

function positionClockPopover(clk) {
  const pop = getClockPopover(), zone = document.querySelector('.gs-pulse-zone')
  if (!pop || !zone || !clk) return
  pop.hidden = false
  const zoneRect = zone.getBoundingClientRect()
  const clkRect = clk.getBoundingClientRect()
  const popW = pop.offsetWidth, popH = pop.offsetHeight
  let left = clkRect.left - zoneRect.left + (clkRect.width / 2) - (popW / 2)
  let top = clkRect.top - zoneRect.top - popH - 10
  if (top < 4) top = clkRect.bottom - zoneRect.top + 10
  if (left < 4) left = 4
  if (left + popW > zone.clientWidth - 4) left = Math.max(4, zone.clientWidth - popW - 4)
  pop.style.left = left + 'px'
  pop.style.top = top + 'px'
}

function openClockPopover(clk, countryId) {
  const pop = getClockPopover(), t = TX[LANG]
  const c = CLOCK_COUNTRIES.find(x => x.id === countryId)
  if (!pop || !c) return
  clockPopoverCountry = countryId
  pop.querySelector('.gs-clk-popover-label').textContent = `${c.flag} ${mt(c.city)} · ${t.pulsePickHint}`
  pop.querySelector('.gs-clk-popover-row').innerHTML = PULSE_LEVELS.map(l =>
    `<button type="button" class="gs-clk-popover-opt" data-level="${l.id}">
      <span class="gs-clk-popover-emoji">${l.emoji}</span>
      <span class="gs-clk-popover-name">${LANG === 'ko' ? l.ko : l.en}</span>

function getScrollEl() { return document.getElementById('gsScroll') }

function scrollToSection(id, tabIndex) {
  activeSection = id
  if (tabIndex != null) activeTabIndex = tabIndex
  else {
    const idx = TX[LANG].tabIds.indexOf(id)
    activeTabIndex = idx >= 0 ? idx : 0
  }
  navOpen.value = false
  renderNav(); renderDots()
  const el = document.getElementById('section-' + id)
  const sc = getScrollEl()
  if (!el || !sc) return
  var top = el.offsetTop
  if (sc.scrollTo) sc.scrollTo({ top: top, behavior: motionOff.value ? 'auto' : 'smooth' })
  else sc.scrollTop = top
}

function updateActiveSectionFromScroll() {
  const sc = getScrollEl()
  if (!sc) return
  const mid = sc.scrollTop + sc.clientHeight * 0.46
  let bestId = SECTION_IDS[0], bestDist = Infinity
  SECTION_IDS.forEach(function (id) {
    const el = document.getElementById('section-' + id)
    if (!el) return
    const dist = Math.abs(el.offsetTop - mid)
    if (dist < bestDist) { bestDist = dist; bestId = id }
  })
  if (bestId === activeSection) return
  activeSection = bestId
  const idx = TX[LANG].tabIds.indexOf(activeSection)
  activeTabIndex = idx >= 0 ? idx : 0
  renderNav(); renderDots()
  headerSolid.value = activeSection !== 'hero'
}

function setupScrollSpy() {
  if (spyIO && spyIO.disconnect) spyIO.disconnect()
  spyIO = null
  const sc = getScrollEl(); if (!sc) return
  if (sc.dataset.spyBound) {
    updateActiveSectionFromScroll()
    return
  }
  sc.dataset.spyBound = '1'
  sc.addEventListener('scroll', function () {
    if (spyScrollRaf) return
    spyScrollRaf = requestAnimationFrame(function () {
      spyScrollRaf = null
      updateActiveSectionFromScroll()
    })
  }, { passive: true })
  updateActiveSectionFromScroll()
}

function bindBizCarousel() {
  const grid = document.getElementById('bizGrid')
  const prev = document.getElementById('bizPrev')
  const next = document.getElementById('bizNext')
  if (!grid || !prev || !next) return
  const t = TX[LANG]
  prev.setAttribute('aria-label', t.bizPrev)
  next.setAttribute('aria-label', t.bizNext)
  if (!grid.dataset.carouselBound) {
    grid.dataset.carouselBound = '1'
    const scrollStep = () => {
      const card = grid.querySelector('.gs-biz-card')
      return card ? card.offsetWidth : grid.clientWidth * 0.78
    }
    prev.addEventListener('click', () => grid.scrollBy({ left: -scrollStep(), behavior: 'smooth' }))
    next.addEventListener('click', () => grid.scrollBy({ left: scrollStep(), behavior: 'smooth' }))
    grid.addEventListener('scroll', updateBizCarouselArrows, { passive: true })
    window.addEventListener('resize', updateBizCarouselArrows)
  }
  updateBizCarouselArrows()
}

function syncMapLayout() {
  const base = document.getElementById('mapBase')
  const img = base?.querySelector('.gs-map-photo')
  const wrap = document.getElementById('mapDots')
  if (!base || !img || !wrap) return
  const padX = Math.min(8, (24 / Math.max(img.offsetWidth, 1)) * 100)
  const padY = Math.min(8, (24 / Math.max(img.offsetHeight, 1)) * 100)
  wrap.querySelectorAll('.gs-map-hit').forEach(btn => {
    const dot = MAP_DOTS.find(d => d.id === btn.dataset.mapId)
    if (!dot) return
    btn.style.left = Math.max(padX, Math.min(100 - padX, dot.x)) + '%'
    btn.style.top = Math.max(padY, Math.min(100 - padY, dot.y)) + '%'
  })
  if (mapMagActiveId) {
    const dot = MAP_DOTS.find(d => d.id === mapMagActiveId)
    if (dot) setMapMagnifier(dot)
  }
}

function bindMapLayoutSync() {
  const base = document.getElementById('mapBase')
  if (!base || base.dataset.layoutBound) return
  base.dataset.layoutBound = '1'
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => syncMapLayout())
    ro.observe(base)
  }
  window.addEventListener('resize', syncMapLayout)
  const img = base.querySelector('.gs-map-photo')
  if (img && !img.complete) img.addEventListener('load', syncMapLayout, { once: true })
  syncMapLayout()
}

  }

function bindMapInteractions() {
  const stage = document.querySelector('.gs-map-stage')
  const wrap = document.getElementById('mapDots')
  if (!stage || stage.dataset.mapBound) return
  stage.dataset.mapBound = '1'
  stage.addEventListener('mouseleave', hideMapMagnifier)
  stage.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || !mapMagActiveId) return
    if (e.target.closest('.gs-map-mag-visit')) return
    hideMapMagnifier()
  })
  if (wrap) {
    wrap.addEventListener('pointerover', (e) => {
      const hit = e.target.closest('.gs-map-hit')
      if (!hit) return
      const dot = MAP_DOTS.find(d => d.id === hit.dataset.mapId)
      if (dot) activateMapDot(dot, hit)

function mediaWrapDist(i, offset, total) {
  let d = i - offset
  while (d > total / 2) d -= total
  while (d <= -total / 2) d += total
  return d
}

function mediaNormIndex(offset, total) {
  return ((Math.round(offset) % total) + total) % total
}

function snapToMediaIndex(idx) {
  const total = TX[LANG].mediaCards.length
  const cur = Math.round(mediaCarouselOffset)
  const curMod = mediaNormIndex(cur, total)
  let diff = idx - curMod
  if (diff > total / 2) diff -= total
  if (diff < -total / 2) diff += total
  snapMediaCarouselTo(cur + diff, true)
}

function updateMediaCarousel(wheeling) {
  const t = TX[LANG], cards = document.querySelectorAll('.gs-media-card')
  const total = t.mediaCards.length
  if (!cards.length) return
  const track = document.getElementById('mediaCoverflowTrack')
  const stage = document.querySelector('.gs-media-carousel-stage')
  if (track) track.classList.toggle('is-wheeling', !!wheeling)
  const stageW = stage?.clientWidth || 960
  const cardW = cards[0]?.offsetWidth || 280
  const cardHalf = cardW / 2
  const visibleHalf = (MEDIA_VISIBLE_COUNT - 1) / 2
  const angleDeg = Math.min(28, Math.max(18, 360 / Math.max(total, 4)))
  const angleRad = angleDeg * (Math.PI / 180)
  const outerTheta = visibleHalf * angleRad
  const outerSin = Math.sin(outerTheta)
  const outerFront = (Math.cos(outerTheta) + 1) / 2
  const outerScale = 0.44 + 0.56 * outerFront
  const edgePad = 2
  const maxTx = stageW / 2 - cardHalf * outerScale * 0.22 - edgePad
  const radius = Math.max(175, maxTx / Math.max(0.46, outerSin))
  cards.forEach((card, i) => {
    const d = mediaWrapDist(i, mediaCarouselOffset, total)
    const theta = d * angleRad
    const cosT = Math.cos(theta)
    const sinT = Math.sin(theta)
    const tx = sinT * radius
    const tz = (cosT - 1) * radius
    const ry = -d * angleDeg
    const front = (cosT + 1) / 2
    const scale = 0.44 + 0.56 * front
    const absD = Math.abs(d)
    const nearSideExtreme = Math.abs(sinT) > 0.9 && absD > visibleHalf + 0.35 && absD < total * 0.47
    const onFrontArc = absD <= visibleHalf + 0.08
    const onBackCenter = cosT < -0.58
    const onWrapReturn = absD >= total * 0.34 && cosT < -0.15 && Math.abs(sinT) < 0.72
    let show = !nearSideExtreme && (onFrontArc || onBackCenter || onWrapReturn)
    card.style.transform = `translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg) scale(${scale})`
    card.style.zIndex = String(Math.round(200 + tz))
    if (!show) {
      card.style.opacity = '0'
      card.style.pointerEvents = 'none'
      card.classList.remove('is-active', 'is-side', 'is-back')
      return
    }
    const sideFade = 1 - Math.max(0, absD - 0.4) * 0.1
    if (onBackCenter || (onWrapReturn && !onFrontArc)) {
      card.style.opacity = String(Math.max(0.16, 0.14 + front * 0.38))
      card.style.pointerEvents = 'auto'
      card.classList.add('is-back')
      card.classList.remove('is-side')
    } else {
      card.style.opacity = String(Math.max(0.46, (0.42 + 0.58 * Math.min(1, front * 1.08)) * sideFade))
      card.style.pointerEvents = 'auto'
      card.classList.remove('is-back')
      card.classList.toggle('is-side', absD >= 0.45)
    }
    card.classList.toggle('is-active', absD < 0.45 && front > 0.72)
  })
  mediaCarouselIndex = mediaNormIndex(mediaCarouselOffset, total)
  const counter = document.getElementById('mediaCounter')
  if (counter) counter.textContent = `${mediaCarouselIndex + 1} / ${total}`
  const prev = document.getElementById('mediaPrev')
  const next = document.getElementById('mediaNext')
  if (prev) prev.disabled = false
  if (next) next.disabled = false
}

function mediaEaseInOutCubic(p) {
  return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2
}

function snapMediaCarouselTo(target, fast, arrow, wheel) {
  if (!wheel) mediaWheelDriving = false
  if (mediaSnapAnim) { cancelAnimationFrame(mediaSnapAnim); mediaSnapAnim = null }
  mediaCarouselTarget = target
  const start = mediaCarouselOffset
  const startTime = performance.now()
  const wheelDist = Math.abs(target - start)
  const duration = wheel
    ? Math.max(50, Math.min(MEDIA_SNAP_STEP_MS * wheelDist, MEDIA_SNAP_STEP_MS * 4))
    : (arrow ? MEDIA_SNAP_STEP_MS : (fast ? MEDIA_SNAP_CLICK_MS : MEDIA_SNAP_MS))
  const track = document.getElementById('mediaCoverflowTrack')
  if (track) { track.classList.remove('is-wheeling'); track.classList.add('is-snapping') }
  function frame(now) {
    const p = Math.min(1, (now - startTime) / duration)
    const ease = mediaEaseInOutCubic(p)
    mediaCarouselOffset = start + (target - start) * ease
    updateMediaCarousel(false)
    if (p < 1) mediaSnapAnim = requestAnimationFrame(frame)
    else {
      mediaCarouselOffset = target
      mediaCarouselTarget = target
      mediaCarouselIndex = mediaNormIndex(target, TX[LANG].mediaCards.length)
      mediaSnapAnim = null
      if (track) track.classList.remove('is-snapping')
      updateMediaCarousel(false)
    }
  }
  mediaSnapAnim = requestAnimationFrame(frame)
}

function snapMediaCarousel() {
  snapMediaCarouselTo(Math.round(mediaCarouselTarget))
}

function moveMediaCarousel(dir) {
  if (mediaWheelIdleTimer) { clearTimeout(mediaWheelIdleTimer); mediaWheelIdleTimer = null }
  mediaWheelDriving = false
  snapMediaCarouselTo(Math.round(mediaCarouselOffset) + dir, false, true)
}

function startMediaWheelLoop() {
  const track = document.getElementById('mediaCoverflowTrack')
  if (track) { track.classList.remove('is-wheeling'); track.classList.add('is-snapping') }
  mediaWheelLastFrame = performance.now()
  function frame(now) {
    const dt = Math.min(48, now - mediaWheelLastFrame)
    mediaWheelLastFrame = now
    const diff = mediaCarouselTarget - mediaCarouselOffset
    if (Math.abs(diff) <= 0.001) {
      mediaCarouselOffset = mediaCarouselTarget
      updateMediaCarousel(false)
      if (!mediaWheelDriving) {
        mediaSnapAnim = null
        if (track) track.classList.remove('is-snapping')
        return
      }
    } else {
      const step = Math.sign(diff) * Math.min(Math.abs(diff), dt / MEDIA_SNAP_STEP_MS)
      mediaCarouselOffset += step
      updateMediaCarousel(false)
    }
    mediaSnapAnim = requestAnimationFrame(frame)
  }
  if (mediaSnapAnim) cancelAnimationFrame(mediaSnapAnim)
  mediaSnapAnim = requestAnimationFrame(frame)
}

function onMediaStageWheel(e) {
  if (activeSection !== 'media') return
  e.preventDefault()
  let delta = e.deltaY
  if (e.deltaMode === 1) delta *= MEDIA_WHEEL_CARD_PX
  else if (e.deltaMode === 2) delta *= MEDIA_WHEEL_CARD_PX * 3
  const deltaCards = delta / MEDIA_WHEEL_CARD_PX
  if (!mediaWheelDriving) {
    if (mediaSnapAnim) { cancelAnimationFrame(mediaSnapAnim); mediaSnapAnim = null }
    mediaWheelDriving = true
    mediaCarouselTarget = mediaCarouselOffset + deltaCards
    startMediaWheelLoop()
  } else {
    mediaCarouselTarget += deltaCards
  }
  if (mediaWheelIdleTimer) clearTimeout(mediaWheelIdleTimer)
  mediaWheelIdleTimer = setTimeout(() => {
    mediaWheelIdleTimer = null
    mediaWheelDriving = false
    mediaCarouselTarget = Math.round(mediaCarouselTarget)
    if (!mediaSnapAnim) startMediaWheelLoop()
  }, MEDIA_WHEEL_IDLE_MS)
}

function getMediaCardAtPoint(clientX, clientY) {
  const cards = [...document.querySelectorAll('.gs-media-card')].filter(c => {
    if (c.style.opacity === '0') return false
    const r = c.getBoundingClientRect()
    return r.width > 0 && r.height > 0
      && clientX >= r.left && clientX <= r.right
      && clientY >= r.top && clientY <= r.bottom
  })
  if (!cards.length) return null
  let best = null, bestDist = Infinity
  cards.forEach(card => {
    const r = card.getBoundingClientRect()
    const cx = r.left + r.width / 2
    const distX = Math.abs(clientX - cx)
    if (distX < bestDist) { best = card; bestDist = distX }
  })
  return best
}

function handleMediaCardPick(clientX, clientY) {
  const card = getMediaCardAtPoint(clientX, clientY)
  if (!card) return
  const idx = +card.dataset.index
  if (idx === mediaCarouselIndex) { showDrawer('media', idx); return }
  snapToMediaIndex(idx)
}

function bindMediaCarousel() {
  const section = document.getElementById('section-media')
  const track = document.getElementById('mediaCoverflowTrack')
  const stage = section?.querySelector('.gs-media-carousel-stage')
  if (!section || !track || !stage || section.dataset.bound) return
  section.dataset.bound = '1'
  let mediaResizeTimer = null
  window.addEventListener('resize', () => {
    clearTimeout(mediaResizeTimer)
    mediaResizeTimer = setTimeout(() => updateMediaCarousel(false), 120)
  }, { passive: true })
  stage.addEventListener('wheel', onMediaStageWheel, { passive: false })
  stage.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return
    const card = getMediaCardAtPoint(e.clientX, e.clientY)
    if (!card) return
    e.preventDefault()
    handleMediaCardPick(e.clientX, e.clientY)
  })
  document.getElementById('mediaPrev')?.addEventListener('click', () => moveMediaCarousel(-1))
  document.getElementById('mediaNext')?.addEventListener('click', () => moveMediaCarousel(1))
}

function applyColorMode() {
  document.documentElement.classList.toggle('gs-light', colorMode.value === 'light')
  try { localStorage.setItem('gs-color-mode', colorMode.value) } catch (_) {}
}

function toggleColorMode(event) {
  const next = colorMode.value === 'light' ? 'dark' : 'light'
  const goingDark = next === 'dark'
  const apply = () => {
    colorMode.value = next
    applyColorMode()
  }
  if (!document.startViewTransition || !event) {
    apply()
    return
  }
  const root = document.documentElement
  const x = event.clientX
  const y = event.clientY
  const endRadius = Math.hypot(
    Math.max(x, window.innerWidth - x),
    Math.max(y, window.innerHeight - y)
  )
  root.dataset.themeTransition = goingDark ? 'to-dark' : 'to-light'
  const animBase = { duration: 450, fill: 'forwards' }
  const expand = [
    `circle(0px at ${x}px ${y}px)`,
    `circle(${endRadius}px at ${x}px ${y}px)`
  ]
  const shrink = [
    `circle(${endRadius}px at ${x}px ${y}px)`,
    `circle(0px at ${x}px ${y}px)`
  ]
  const fullyOpenClip = [
    `circle(${endRadius}px at ${x}px ${y}px)`,
    `circle(${endRadius}px at ${x}px ${y}px)`
  ]
  const transition = document.startViewTransition(apply)
  transition.ready.then(() => {
    if (goingDark) {
      root.animate(
        { clipPath: shrink },
        { ...animBase, easing: 'ease-out', pseudoElement: '::view-transition-old(root)' }
      )
      root.animate(
        { clipPath: fullyOpenClip },
        { ...animBase, easing: 'linear', pseudoElement: '::view-transition-new(root)' }
      )
    } else {
      root.animate(
        { clipPath: expand },
        { ...animBase, easing: 'ease-in', pseudoElement: '::view-transition-new(root)' }
      )
      root.animate(
        { clipPath: fullyOpenClip },
        { ...animBase, easing: 'linear', pseudoElement: '::view-transition-old(root)' }
      )
    }
  }).catch(() => {})
  transition.finished.finally(() => {
    delete root.dataset.themeTransition
  })
}
