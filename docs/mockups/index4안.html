.gs-app {
  --navy: #0a1628;
  --navy2: #0d1f3c;
  --blue: #0066cc;

  --orange: #e85d04;
  --orange-box: rgba(232, 93, 4, 0.9);
  --ink: #ffffff;
  --muted: rgba(255,255,255,.72);
  --dim: rgba(255,255,255,.45);
  --line: rgba(255,255,255,.12);
  --card: #f5f7fa;
  --text: #1a1a2e;
  --text-muted: #5a6270;
  --header: 72px;
  --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--navy);
}
.gs-app * { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #0a1628; }
.gs-scroll {
  height: 100vh; overflow-y: auto; overflow-x: hidden;
  scroll-snap-type: y proximity;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.gs-fp {
  min-height: 100vh; scroll-snap-align: start; scroll-snap-stop: normal;
  position: relative;
  display: flex; flex-direction: column; overflow: hidden;
}
.gs-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500; height: var(--header);
  display: flex; flex-direction: column; align-items: stretch;
  transition: background .35s, box-shadow .35s;
  pointer-events: none;
}
.gs-header-inner,
.gs-nav-panel { pointer-events: auto; }
.gs-header.solid { background: rgba(10,22,40,.96); box-shadow: 0 2px 20px rgba(0,0,0,.3); }
.gs-header-inner {
  width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px;
  height: var(--header); flex-shrink: 0;
  display: flex; align-items: center; gap: 20px;
}
.gs-logo {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex-shrink: 0;
}
.gs-logo-mark {
  width: 40px; height: 40px; background: #695647; border-radius: 4px;
  display: grid; place-items: center; padding: 5px; flex-shrink: 0;
}
.gs-logo-mark svg { width: 100%; height: 100%; display: block; }
.gs-logo-text { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.gs-logo-text em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 14px; display: block; }
.gs-nav {
  flex: 1; display: flex; justify-content: center; gap: 2px; overflow-x: auto; scrollbar-width: none;
}
.gs-nav::-webkit-scrollbar { display: none; }
.gs-nav-btn {
  border: 0; background: transparent; color: rgba(255,255,255,.75);
  font-size: 13px; font-weight: 500; padding: 10px 16px 14px; cursor: pointer;
  white-space: nowrap; transition: color .2s; font-family: var(--sans);

}
.gs-nav-btn:hover, .gs-nav-btn.active { color: #fff; font-weight: 700; }
.gs-nav-btn:hover::after, .gs-nav-btn.active::after { opacity: 1; }
.gs-util { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.gs-util-link {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--ink);
  text-decoration: none; opacity: .85;
}
.gs-main-menu-btn {
  display: none; align-items: center; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.3); background: transparent; color: var(--ink);
  padding: 5px 10px; font-size: 11px; font-weight: 700; letter-spacing: -.02em;
  cursor: pointer; border-radius: 4px; white-space: nowrap; font-family: var(--sans);
  transition: border-color .2s, background .2s;
}
.gs-main-menu-btn:hover { border-color: #E5C04A; background: rgba(229, 192, 74, .12); }
html.gs-light .gs-main-menu-btn {
  border-color: rgba(26,26,46,.28);
}
html.gs-light .gs-main-menu-btn:hover {
  border-color: #E5C04A; background: rgba(229, 192, 74, .14);
}
.gs-lang { display: flex; gap: 4px; flex-shrink: 0; }
.gs-lang button {
  border: 1px solid rgba(255,255,255,.3); background: transparent; color: var(--ink);
  min-width: 36px; height: 32px; padding: 0 8px; font-size: 18px; line-height: 1;
  cursor: pointer; border-radius: 4px; display: grid; place-items: center;
}
.gs-lang button.on { background: var(--blue); border-color: var(--blue); }
.gs-theme-switch { flex-shrink: 0; }
.gs-theme-switch {
  width: 40px; height: 22px; border-radius: 11px; border: 1px solid #dcdfe6;
  background: #f2f2f2; padding: 0; cursor: pointer; position: relative; flex-shrink: 0;
  transition: background .35s cubic-bezier(.4,0,.2,1), border-color .35s cubic-bezier(.4,0,.2,1);
}
.gs-theme-switch.dark {
  background: #141414; border-color: #4c4d4f;
}
.gs-theme-switch__knob {
  position: absolute; top: 1px; left: 1px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12);
  display: grid; place-items: center;
  transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.gs-theme-switch.dark .gs-theme-switch__knob { transform: translateX(18px); }
.gs-theme-icon {
  width: 12px; height: 12px; position: absolute; color: #606266;
  transition: opacity .28s ease, transform .35s cubic-bezier(.4,0,.2,1);
}
.gs-theme-switch.dark .gs-theme-icon { color: #cfd3dc; }
.gs-theme-icon--sun { opacity: 1; transform: rotate(0deg) scale(1); }
.gs-theme-icon--moon { opacity: 0; transform: rotate(-25deg) scale(.75); }
.gs-theme-switch.dark .gs-theme-icon--sun { opacity: 0; transform: rotate(25deg) scale(.75); }
.gs-theme-switch.dark .gs-theme-icon--moon { opacity: 1; transform: rotate(0deg) scale(1); }
::view-transition-old(root),
::view-transition-new(root) {
  animation: none;
  mix-blend-mode: normal;
}
html[data-theme-transition="to-light"]::view-transition-new(root) { z-index: 2147483646; }
html[data-theme-transition="to-light"]::view-transition-old(root) { z-index: 1; }
html[data-theme-transition="to-dark"]::view-transition-old(root) { z-index: 2147483646; }
html[data-theme-transition="to-dark"]::view-transition-new(root) { z-index: 1; }

const MAP_DOTS = MAP_DOT_DEFS.map(d => {
  const { x, y } = mapPctFromRef(d.px, d.py)
  return { ...d, oneword: { ...d.oneword }, x, y }
})

const MAP_ONEWORD_STORE_KEY = 'gs-map-onewords'
let mapOnewordOverrides = {}

function loadMapOnewordOverrides() {
  try {
    const raw = localStorage.getItem(MAP_ONEWORD_STORE_KEY)
    mapOnewordOverrides = raw ? JSON.parse(raw) : {}
  } catch (_) { mapOnewordOverrides = {} }
}

function applyMapOnewordOverrides() {
  MAP_DOTS.forEach(d => {
    const o = mapOnewordOverrides[d.id]
    if (!o) return
    if (o.ko != null) d.oneword.ko = o.ko
    if (o.en != null) d.oneword.en = o.en
  })
}

function saveMapOneword(id, text) {
  if (!mapOnewordOverrides[id]) mapOnewordOverrides[id] = {}
  mapOnewordOverrides[id][LANG] = text
  try { localStorage.setItem(MAP_ONEWORD_STORE_KEY, JSON.stringify(mapOnewordOverrides)) } catch (_) {}
}

loadMapOnewordOverrides()
applyMapOnewordOverrides()

let clockPopoverCountry = null

function getClockPopover() {
  let pop = document.getElementById('clockPulsePopover')
  if (pop) return pop
  const zone = document.querySelector('.gs-pulse-zone')
  if (!zone) return null
  pop = document.createElement('div')
  pop.id = 'clockPulsePopover'
  pop.className = 'gs-clk-popover'
  pop.hidden = true
  pop.innerHTML = '<span class="gs-clk-popover-label"></span><div class="gs-clk-popover-row"></div>'
  zone.appendChild(pop)
  pop.addEventListener('click', (e) => {
    e.stopPropagation()
    const btn = e.target.closest('.gs-clk-popover-opt')
    if (!btn || !clockPopoverCountry) return
    savePulse(clockPopoverCountry, btn.dataset.level)
    closeAllClockPickers()
    updateClockUI()
  })
  return pop
}

function positionClockPopover(clk) {
  const pop = getClockPopover(), zone = document.querySelector('.gs-pulse-zone')
  if (!pop || !zone || !clk) return
  pop.hidden = false
  const zoneRect = zone.getBoundingClientRect()
  const clkRect = clk.getBoundingClientRect()
  const popW = pop.offsetWidth, popH = pop.offsetHeight
  let left = clkRect.left - zoneRect.left + (clkRect.width / 2) - (popW / 2)
  let top = clkRect.top - zoneRect.top - popH - 10
  if (top < 4) top = clkRect.bottom - zoneRect.top + 10
  if (left < 4) left = 4
  if (left + popW > zone.clientWidth - 4) left = Math.max(4, zone.clientWidth - popW - 4)
  pop.style.left = left + 'px'
  pop.style.top = top + 'px'
}

function openClockPopover(clk, countryId) {
  const pop = getClockPopover(), t = TX[LANG]
  const c = CLOCK_COUNTRIES.find(x => x.id === countryId)
  if (!pop || !c) return

function getScrollEl() { return document.getElementById('gsScroll') }

function syncSectionBodyClass() {
  document.body.classList.toggle('gs-section-business-active', activeSection === 'business')
}

function scrollToSection(id, tabIndex) {
  activeSection = id
  if (tabIndex != null) activeTabIndex = tabIndex
  else {
    const idx = TX[LANG].tabIds.indexOf(id)
    activeTabIndex = idx >= 0 ? idx : 0
  }
  navOpen.value = false
  heroHeader.value = id === 'hero'
  headerSolid.value = id !== 'hero'
  syncSectionBodyClass()
  renderNav(); renderDots()
  const el = document.getElementById('section-' + id)
  const sc = getScrollEl()
  if (!el || !sc) return
  var top = el.offsetTop
  if (sc.scrollTo) sc.scrollTo({ top: top, behavior: motionOff.value ? 'auto' : 'smooth' })
  else sc.scrollTop = top
}

function updateActiveSectionFromScroll() {
  const sc = getScrollEl()
  if (!sc) return
  const mid = sc.scrollTop + sc.clientHeight * 0.46
  let bestId = SECTION_IDS[0], bestDist = Infinity
  SECTION_IDS.forEach(function (id) {
    const el = document.getElementById('section-' + id)
    if (!el) return
    const dist = Math.abs(el.offsetTop - mid)
    if (dist < bestDist) { bestDist = dist; bestId = id }
  })
  if (bestId === activeSection) return
  activeSection = bestId
  const idx = TX[LANG].tabIds.indexOf(activeSection)
  activeTabIndex = idx >= 0 ? idx : 0
  syncSectionBodyClass()
  renderNav(); renderDots()
  heroHeader.value = activeSection === 'hero'
  headerSolid.value = activeSection !== 'hero'
}

function setupScrollSpy() {
  if (spyIO && spyIO.disconnect) spyIO.disconnect()
  spyIO = null
  const sc = getScrollEl(); if (!sc) return
  if (sc.dataset.spyBound) {
    updateActiveSectionFromScroll()
    return
  }
  sc.dataset.spyBound = '1'
  sc.addEventListener('scroll', function () {
    if (spyScrollRaf) return
    spyScrollRaf = requestAnimationFrame(function () {
      spyScrollRaf = null
      updateActiveSectionFromScroll()
    })
  }, { passive: true })
  updateActiveSectionFromScroll()
  syncSectionBodyClass()
}

      card.classList.add('is-touch-hover')
    })

function getMapBaseMetrics() {
  const base = document.getElementById('mapBase')
  if (!base) return null
  return { base, w: base.clientWidth, h: base.clientHeight }
}

function clampMapPan(px, py, zoom, w, h) {
  if (zoom <= 1) return { x: 0, y: 0 }
  const maxX = (w * (zoom - 1)) / 2
  const maxY = (h * (zoom - 1)) / 2
  return {
    x: Math.max(-maxX, Math.min(maxX, px)),
    y: Math.max(-maxY, Math.min(maxY, py))
  }
}

function mapPointToScreen(dotX, dotY, zoom, panX, panY, w, h) {
  const cx = w / 2
  const cy = h / 2
  const px = (dotX / 100) * w
  const py = (dotY / 100) * h
  return {
    x: cx + (px - cx) * zoom + panX,
    y: cy + (py - cy) * zoom + panY
  }
}

function setMapZoom(nextZoom, anchorX, anchorY) {
  const m = getMapBaseMetrics()
  if (!m) return
  const { w, h } = m
  const cx = w / 2
  const cy = h / 2
  const prev = mapZoomLevel
  const zoom = Math.max(MAP_ZOOM_MIN, Math.min(MAP_ZOOM_MAX, +nextZoom.toFixed(2)))
  if (anchorX != null && anchorY != null && prev !== zoom) {
    const mapX = cx + (anchorX - cx - mapPanX) / prev
    const mapY = cy + (anchorY - cy - mapPanY) / prev
    mapZoomLevel = zoom
    if (zoom <= 1) {
      mapPanX = 0
      mapPanY = 0
    } else {
      mapPanX = anchorX - cx - (mapX - cx) * zoom
      mapPanY = anchorY - cy - (mapY - cy) * zoom
      const clamped = clampMapPan(mapPanX, mapPanY, zoom, w, h)
      mapPanX = clamped.x
      mapPanY = clamped.y
    }
  } else {
    mapZoomLevel = zoom
    if (zoom <= 1) {
      mapPanX = 0
      mapPanY = 0
    } else {
      const clamped = clampMapPan(mapPanX, mapPanY, zoom, w, h)
      mapPanX = clamped.x
      mapPanY = clamped.y
    }
  }
  applyMapZoom()
}

function applyMapZoom(skipTransition) {
  const layer = document.getElementById('mapZoomLayer')
  const base = document.getElementById('mapBase')
  const levelEl = document.getElementById('mapZoomLevel')
  const outBtn = document.getElementById('mapZoomOut')
  const inBtn = document.getElementById('mapZoomIn')
  if (layer) {
    if (skipTransition) layer.style.transition = 'none'
    layer.style.transform = `translate(${mapPanX}px, ${mapPanY}px) scale(${mapZoomLevel})`
    if (skipTransition) {
      void layer.offsetHeight
      layer.style.transition = ''
    }
  }
  if (base) base.classList.toggle('is-pannable', mapZoomLevel > 1.001)
  if (levelEl) levelEl.textContent = Math.round(mapZoomLevel * 100) + '%'
  if (outBtn) outBtn.disabled = mapZoomLevel <= MAP_ZOOM_MIN + 0.001
  if (inBtn) inBtn.disabled = mapZoomLevel >= MAP_ZOOM_MAX - 0.001
  syncMapLayout()
}

function bindMapPanZoom() {
  const base = document.getElementById('mapBase')
  if (!base || base.dataset.panZoomBound) return
  base.dataset.panZoomBound = '1'
  const t = TX[LANG]
  base.setAttribute('aria-label', t.mapDragAria)

  base.addEventListener('wheel', (e) => {
    if (e.target.closest('.gs-map-zoom-ctrl')) return
    e.preventDefault()
    const rect = base.getBoundingClientRect()
    const mx = e.clientX - rect.left
    const my = e.clientY - rect.top
    const delta = e.deltaY > 0 ? -MAP_WHEEL_ZOOM_STEP : MAP_WHEEL_ZOOM_STEP
    setMapZoom(mapZoomLevel + delta, mx, my)
  }, { passive: false })

  base.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return
    if (e.target.closest('.gs-map-zoom-ctrl, .gs-map-hit, .gs-map-mag-visit')) return
    if (mapZoomLevel <= 1.001) return
    e.preventDefault()
    hideMapMagnifier()
    mapMagPinned = false
    mapDrag = { startX: e.clientX, startY: e.clientY, panX: mapPanX, panY: mapPanY }
    base.classList.add('is-panning')
    const onMove = (ev) => {
      if (!mapDrag) return
      const m = getMapBaseMetrics()
      if (!m) return
      const dx = ev.clientX - mapDrag.startX
      const dy = ev.clientY - mapDrag.startY
      const clamped = clampMapPan(mapDrag.panX + dx, mapDrag.panY + dy, mapZoomLevel, m.w, m.h)
      mapPanX = clamped.x
      mapPanY = clamped.y
      applyMapZoom(true)
    }
    const onUp = () => {
      mapDrag = null
      base.classList.remove('is-panning')
      window.removeEventListener('mousemove', onMove)
      window.removeEventListener('mouseup', onUp)
    }
    window.addEventListener('mousemove', onMove)
    window.addEventListener('mouseup', onUp)
  })
}

function bindMapZoom() {
  const ctrl = document.getElementById('mapZoomCtrl')
  if (!ctrl) return
  const t = TX[LANG]
  ctrl.setAttribute('aria-label', t.mapZoomAria)
  const base = document.getElementById('mapBase')
  if (base) base.setAttribute('aria-label', t.mapDragAria)
  const outBtn = document.getElementById('mapZoomOut')
  const inBtn = document.getElementById('mapZoomIn')
  if (outBtn) outBtn.setAttribute('aria-label', t.mapZoomOut)
  if (inBtn) inBtn.setAttribute('aria-label', t.mapZoomIn)
  if (ctrl.dataset.bound) {
    applyMapZoom()
    return
  }
  ctrl.dataset.bound = '1'
  if (outBtn) {
    outBtn.onclick = () => {
      const m = getMapBaseMetrics()
      if (!m) return
      setMapZoom(mapZoomLevel - MAP_ZOOM_STEP, m.w / 2, m.h / 2)
    }
  }
  if (inBtn) {
    inBtn.onclick = () => {
      const m = getMapBaseMetrics()
      if (!m) return
      setMapZoom(mapZoomLevel + MAP_ZOOM_STEP, m.w / 2, m.h / 2)
    }
  }
  bindMapPanZoom()
  applyMapZoom()
}

function syncMapLayout() {
  const base = document.getElementById('mapBase')
  const img = base?.querySelector('.gs-map-photo')
  const wrap = document.getElementById('mapDots')
  const m = getMapBaseMetrics()
  if (!base || !img || !wrap || !m) return
  const { w, h } = m
  const padX = Math.min(8, (24 / Math.max(img.offsetWidth, 1)) * 100)
  const padY = Math.min(8, (24 / Math.max(img.offsetHeight, 1)) * 100)
  wrap.querySelectorAll('.gs-map-hit').forEach(btn => {
    const dot = MAP_DOTS.find(d => d.id === btn.dataset.mapId)
    if (!dot) return
    const dotX = Math.max(padX, Math.min(100 - padX, dot.x))
    const dotY = Math.max(padY, Math.min(100 - padY, dot.y))
    const pos = mapPointToScreen(dotX, dotY, mapZoomLevel, mapPanX, mapPanY, w, h)
    btn.style.left = (pos.x / w * 100) + '%'
    btn.style.top = (pos.y / h * 100) + '%'
  })
  if (mapMagActiveId) {
    const dot = MAP_DOTS.find(d => d.id === mapMagActiveId)
    const btn = document.querySelector(`.gs-map-hit[data-map-id="${mapMagActiveId}"]`)
    if (dot) positionMapBubble(dot, btn)
  }
}

function positionMapBubble(dot, btn) {
  const bubble = document.getElementById('mapMagnifier')
  const titleEl = document.getElementById('mapMagLabel')
  const countryEl = document.getElementById('mapMagCountry')
  const textEl = document.getElementById('mapMagText')
  const base = document.getElementById('mapBase')
  if (!bubble || !dot || !base) return
  const t = TX[LANG]
  const leftPct = btn ? parseFloat(btn.style.left) : dot.x
  const topPct = btn ? parseFloat(btn.style.top) : dot.y
  if (titleEl) titleEl.textContent = t.mapCountryWordTitle
  if (countryEl) countryEl.textContent = mt(dot.label)
  if (textEl) textEl.textContent = dot.oneword[LANG] || mt(dot.oneword) || ''
  bubble.style.left = leftPct + '%'
  bubble.style.top = topPct + '%'
  const flipBelow = topPct < 16
  bubble.style.transform = flipBelow
    ? 'translate(-50%, 14px)'
    : 'translate(-50%, calc(-100% - 16px))'
  const tail = bubble.querySelector('.gs-map-bubble-tail')
  if (tail) {
    tail.style.top = flipBelow ? '-6px' : ''
    tail.style.bottom = flipBelow ? '' : '-6px'
    tail.style.transform = flipBelow
      ? 'translateX(-50%) rotate(225deg)'
      : 'translateX(-50%) rotate(45deg)'
  }
  bubble.classList.add('is-on')
  bubble.setAttribute('aria-hidden', 'false')
  mapMagActiveId = dot.id
}

function hideMapMagnifier(clearPin) {
  const mag = document.getElementById('mapMagnifier')
  if (mag) { mag.classList.remove('is-on'); mag.setAttribute('aria-hidden', 'true') }
  document.querySelectorAll('.gs-map-hit.is-active').forEach(el => el.classList.remove('is-active'))
  mapMagActiveId = null
  if (clearPin !== false) mapMagPinned = false
}

function activateMapDot(dot, btn, pin) {
  const wrap = document.getElementById('mapDots')
  if (!wrap || !dot) return
  if (pin && btn && btn.parentElement === wrap) wrap.appendChild(btn)
  wrap.querySelectorAll('.gs-map-hit.is-active').forEach(el => el.classList.remove('is-active'))
  if (btn) btn.classList.add('is-active')
  mapMagPinned = !!pin
  positionMapBubble(dot, btn)
}

function bindMapInteractions() {
  const stage = document.querySelector('.gs-map-stage')
  const wrap = document.getElementById('mapDots')
  if (!stage || stage.dataset.mapBound) return
  stage.dataset.mapBound = '1'
  stage.addEventListener('mouseleave', () => hideMapMagnifier(true))
  stage.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return
    if (e.target.closest('.gs-map-hit, .gs-map-bubble')) return
    hideMapMagnifier(true)
  })
  if (wrap) {
    wrap.addEventListener('click', (e) => {
      const hit = e.target.closest('.gs-map-hit')
      if (!hit) return
      e.stopPropagation()
      const dot = MAP_DOTS.find(d => d.id === hit.dataset.mapId)
      if (!dot) return
      activateMapDot(dot, hit, false)
    })
  }
}

function mediaWrapDist(i, offset, total) {
  let d = i - offset
  while (d > total / 2) d -= total
  while (d <= -total / 2) d += total
  return d
}

function mediaNormIndex(offset, total) {
  return ((Math.round(offset) % total) + total) % total
}

function mediaFilterCountryName(c) {
  return TX[LANG].mediaCountryNames?.[c.seed] || c.country
}

function getCardsForCategory(f) {
  const cards = TX[LANG].mediaCards
  if (f === 'presence') return cards.filter(c => c.group === 'hub' || c.group === 'branch')
  if (f === 'hub') return cards.filter(c => c.group === 'hub')
  if (f === 'branch') return cards.filter(c => c.group === 'branch')
  if (f === 'other') return cards.filter(c => c.group === 'other')
  return cards
}

function ensureMediaCheckedSeeds(key) {
  const st = mediaPages[key]
  if (!st.checkedSeeds) {
    st.checkedSeeds = new Set(getCardsForCategory(st.filter).map(c => c.seed))
  }
}

function getFilteredMediaCards(key) {
  ensureMediaCheckedSeeds(key)
  const st = mediaPages[key]
  return getCardsForCategory(st.filter).filter(c => st.checkedSeeds.has(c.seed))
}

function closeMediaFilterDropdown(key) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  if (!cfg?.drawer || !st.filterExpanded) return
  st.filterExpanded = false
  renderMediaFilterSub(key)
}

function syncMediaFilterDropdownUI(key) {
  const cfg = MEDIA_PAGES[key]
  if (!cfg?.drawer) return
  const st = mediaPages[key]
  const wrap = document.getElementById(cfg.filterWrapId)
  if (wrap) wrap.classList.toggle('is-filter-open', !!st.filterExpanded)
  const filters = document.getElementById(cfg.filtersId)
  if (!filters) return
  filters.querySelectorAll('button[data-f]').forEach(btn => {
    btn.setAttribute('aria-expanded', String(st.filter === btn.dataset.f && st.filterExpanded))
  })
}

function selectMediaFilter(key, f) {
  const st = mediaPages[key]
  const cfg = MEDIA_PAGES[key]
  if (cfg.drawer && st.filter === f && st.filterExpanded) {
    closeMediaFilterDropdown(key)
    return
  }
  st.filter = f
  st.filterExpanded = true
  st.checkedSeeds = new Set(getCardsForCategory(f).map(c => c.seed))
  st.carouselIndex = 0
  st.carouselOffset = 0
  st.carouselTarget = 0
  if (cfg.drawer) st.drawerFocused = false
  renderMediaFilters(key)
  renderMediaFilterSub(key)
  if (cfg.gridOnly) renderGirReportGrid(key)
  else renderMediaCardsTrack(key)
}

function renderMediaFilterSub(key) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  const sub = document.getElementById(cfg.filterSubId)
  if (!sub) return
  const t = TX[LANG]
  if (!st.filterExpanded) {
    sub.hidden = true
    sub.innerHTML = ''
    syncMediaFilterDropdownUI(key)
    return
  }
  const cards = getCardsForCategory(st.filter)
  ensureMediaCheckedSeeds(key)
  const allChecked = cards.length > 0 && cards.every(c => st.checkedSeeds.has(c.seed))
  sub.hidden = false
  sub.innerHTML = `<div class="gs-media-filter-sub-inner">
    <label class="gs-media-filter-check gs-media-filter-check--all">
      <input type="checkbox" id="${cfg.checkAllId}"${allChecked ? ' checked' : ''}>
      <span>${t.mediaFilterCheckAll}</span>
    </label>
    <div class="gs-media-filter-countries">
      ${cards.map(c => {
        const nm = mediaFilterCountryName(c)
        return `<label class="gs-media-filter-check gs-media-filter-check--chip">
        <input type="checkbox" data-seed="${c.seed}"${st.checkedSeeds.has(c.seed) ? ' checked' : ''}>
        <span class="gs-media-filter-check-flag">${mediaFlagTag(c.seed, nm)}</span>
        <span>${nm}</span>
      </label>`
      }).join('')}
    </div>
  </div>`
  syncMediaFilterDropdownUI(key)
}

function drawerAccent(i) {
  return DRAWER_ACCENTS[i % DRAWER_ACCENTS.length]
}

function drawerRelFloat(i, offset, total) {
  let rel = i - offset
  while (rel < -total / 2) rel += total
  while (rel > total / 2) rel -= total
  return rel
}

function drawerEaseInOutQuart(p) {
  return p < 0.5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2
}

function updateDrawerCoverflow(wheeling, key) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  const drawer = document.getElementById(cfg.drawerWrapId)
  if (!drawer) return
  const cards = drawer.querySelectorAll('.gs-drawer-card')
  const total = mediaCardTotal(key)
  if (!cards.length) return
  const track = document.getElementById(cfg.trackId)
  if (track) track.classList.toggle('is-wheeling', !!wheeling)
  const dm = getDrawerMetrics()
  cards.forEach((card, i) => {
    card.classList.remove('selected', 'is-stacked', 'is-stacked-behind', 'is-foreground-below', 'is-tab-only', 'is-tab-minimal', 'is-stack-peek', 'is-stack-d1', 'is-stack-d2', 'is-stack-d3', 'is-stack-d4', 'is-stack-d5', 'is-stack-d6', 'is-stack-d7')
    const rel = drawerRelFloat(i, st.carouselOffset, total)
    const hideBack = DRAWER_STACK_VISIBLE + 0.65
    if (rel < 0 || rel > hideBack) {
      card.style.opacity = '0'
      card.style.pointerEvents = 'none'
      card.style.filter = ''
      card.style.height = ''
      card.style.marginTop = ''
      card.style.transform = 'translateY(120px) translateZ(-300px) rotateX(10deg) scale(0.65)'
      card.style.zIndex = '1'
      card.classList.remove('is-active', 'is-side', 'is-back', 'is-front')
      return
    }
    let ty, tz, scale, rx, opacity, zIndex
    const isFront = rel < 0.52
    if (isFront) {
      ty = dm.frontY
      tz = DRAWER_FRONT_Z
      scale = dm.frontScale
      rx = 0
      opacity = 1
      zIndex = 640
      card.style.height = dm.cardH + 'px'
      card.style.marginTop = -dm.cardHalf + 'px'
      card.style.filter = 'none'
      card.classList.add('is-front', 'is-active')
      card.classList.remove('is-side', 'is-back', 'is-stacked-behind', 'is-tab-minimal', 'is-stack-peek', 'is-stack-d1', 'is-stack-d2', 'is-stack-d3', 'is-stack-d4', 'is-stack-d5', 'is-stack-d6', 'is-stack-d7')
    } else {
      const depth = rel
      const depthIdx = Math.min(DRAWER_STACK_VISIBLE, Math.max(1, Math.round(depth)))
      ty = dm.tabBase - depth * dm.tabStep
      tz = -depth * DRAWER_Z_BACK
      scale = Math.max(0.66, 1 - depth * DRAWER_SCALE_BACK)
      rx = Math.min(7, depth * 2)
      opacity = Math.max(0.9, 1 - depth * 0.012)
      zIndex = 520 - Math.round(depth * 12)
      const peekH = dm.peek[depthIdx] || dm.peek[dm.peek.length - 1]
      card.style.height = peekH + 'px'
      card.style.marginTop = -(peekH / 2) + 'px'
      card.style.filter = depth > 1.2 ? `brightness(${Math.max(0.9, 1 - depth * 0.02)})` : 'none'
      card.classList.add('is-back', 'is-stacked-behind', 'is-stack-peek', `is-stack-d${depthIdx}`)
      card.classList.toggle('is-tab-minimal', depth > 1.2)
      card.classList.remove('is-front', 'is-active', 'is-side')
    }
    card.style.top = dm.top
    card.style.bottom = 'auto'
    card.style.opacity = String(opacity)
    card.style.pointerEvents = 'auto'
    card.style.transform = `translateY(${ty}px) translateZ(${tz}px) rotateX(${rx}deg) scale(${scale})`
    card.style.zIndex = String(zIndex)
  })
  st.carouselIndex = mediaNormIndex(st.carouselOffset, total)
  const counter = document.getElementById(cfg.counterId)
  if (counter) counter.textContent = `${st.carouselIndex + 1} / ${total}`
  updateDrawerVscroll(key)
}

function snapDrawerCarouselTo(key, target, fast, arrow, wheel) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  if (!wheel) st.wheelDriving = false
  if (st.snapAnim) { cancelAnimationFrame(st.snapAnim); st.snapAnim = null }
  st.carouselTarget = target
  const start = st.carouselOffset
  const wheelDist = Math.abs(target - start)
  if (wheelDist < 0.015) {
    st.carouselOffset = target
    st.carouselIndex = mediaNormIndex(target, mediaCardTotal(key))
    const track = document.getElementById(cfg.trackId)
    if (track) track.classList.remove('is-snapping', 'is-wheeling')
    updateDrawerCoverflow(false, key)
    return
  }
  const startTime = performance.now()
  const duration = wheel
    ? Math.max(1, Math.min(DRAWER_SNAP_STEP_MS * wheelDist, DRAWER_SNAP_STEP_MS * 2))
    : (arrow ? DRAWER_SNAP_CLICK_MS : (fast ? DRAWER_SNAP_CLICK_MS : DRAWER_SNAP_MS))
  const track = document.getElementById(cfg.trackId)
  if (track) { track.classList.remove('is-wheeling'); track.classList.add('is-snapping') }
  function frame(now) {
    const p = Math.min(1, (now - startTime) / duration)
    const ease = p
    st.carouselOffset = start + (target - start) * ease
    updateDrawerCoverflow(false, key)
    if (p < 1) st.snapAnim = requestAnimationFrame(frame)
    else {
      st.carouselOffset = target
      st.carouselTarget = target
      st.carouselIndex = mediaNormIndex(target, mediaCardTotal(key))
      st.snapAnim = null
      if (track) track.classList.remove('is-snapping')
      updateDrawerCoverflow(false, key)
    }
  }
  st.snapAnim = requestAnimationFrame(frame)
}

function startDrawerWheelLoop(key) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  const track = document.getElementById(cfg.trackId)
  if (track) {
    track.classList.toggle('is-wheeling', !!st.wheelDriving)
    track.classList.toggle('is-snapping', !st.wheelDriving)
  }
  st.wheelLastFrame = performance.now()
  function frame(now) {
    const dt = Math.min(48, now - st.wheelLastFrame)
    st.wheelLastFrame = now
    const diff = st.carouselTarget - st.carouselOffset
    if (Math.abs(diff) <= 0.0008) {
      st.carouselOffset = st.carouselTarget
      updateDrawerCoverflow(false, key)
      if (!st.wheelDriving) {
        st.snapAnim = null
        if (track) { track.classList.remove('is-snapping', 'is-wheeling') }
        return
      }
    } else {
      const smoothMs = st.wheelDriving ? DRAWER_WHEEL_SMOOTH_MS : DRAWER_SNAP_STEP_MS * 0.85
      const alpha = 1 - Math.exp(-dt / smoothMs)
      st.carouselOffset += diff * alpha
      updateDrawerCoverflow(!!st.wheelDriving, key)
    }
    st.snapAnim = requestAnimationFrame(frame)
  }
  if (st.snapAnim) cancelAnimationFrame(st.snapAnim)
  st.snapAnim = requestAnimationFrame(frame)
}

function snapToDrawerIndex(key, idx) {
  const st = mediaPages[key]
  const total = mediaCardTotal(key)
  const cur = Math.round(st.carouselOffset)
  const curMod = mediaNormIndex(cur, total)
  let diff = idx - curMod
  if (diff > total / 2) diff -= total
  if (diff < -total / 2) diff += total
  snapDrawerCarouselTo(key, cur + diff, true)
}

function layoutDrawerActive(cards, selectedIdx) {
  const dm = getDrawerMetrics()
  const stackStep = 30
  let si = 0
  cards.forEach((card, i) => {
    card.classList.remove('is-front')
    if (i === selectedIdx) {
      card.classList.add('selected')
      card.classList.remove('is-stacked')
      card.style.height = dm.cardH + 'px'
      card.style.marginTop = -dm.cardHalf + 'px'
      card.style.top = '18px'
      card.style.bottom = 'auto'
      card.style.transform = `translateZ(130px) rotateX(0deg) scale(${(dm.frontScale * 1.04).toFixed(3)})`
      card.style.zIndex = '420'
      card.style.opacity = '1'
      card.style.filter = 'none'
      card.style.pointerEvents = 'auto'
    } else {
      card.classList.remove('selected')
      card.classList.add('is-stacked')
      card.style.height = dm.stackTab + 'px'
      card.style.marginTop = -(dm.stackTab / 2) + 'px'
      card.style.top = 'auto'
      card.style.bottom = `${si * stackStep + 10}px`
      card.style.transform = `translateZ(${si * 8}px) rotateX(14deg) scale(${1 - si * 0.016})`
      card.style.zIndex = String(220 + si)
      card.style.opacity = '1'
      card.style.filter = 'none'
      card.style.pointerEvents = 'auto'
      si++
    }
  })
}

function updateMediaDrawer(key) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  const drawer = document.getElementById(cfg.drawerWrapId)
  const track = document.getElementById(cfg.trackId)
  if (!track) return
  const cards = track.querySelectorAll('.gs-drawer-card')
  const total = cards.length
  if (!total) return
  if (st.carouselIndex >= total) st.carouselIndex = 0
  if (drawer) {
    drawer.classList.toggle('active', !!st.drawerFocused)
  }
  const closeBtn = document.getElementById(cfg.drawerCloseId)
  if (closeBtn) {
    closeBtn.hidden = !st.drawerFocused
    closeBtn.setAttribute('aria-label', TX[LANG].mediaDrawerClose)
  }
  if (!st.drawerFocused) updateDrawerCoverflow(false, key)
  else layoutDrawerActive(cards, st.carouselIndex)
  const counter = document.getElementById(cfg.counterId)
  if (counter) counter.textContent = `${st.carouselIndex + 1} / ${total}`
  const hintEl = document.getElementById(cfg.hintId)
  if (hintEl) hintEl.textContent = getMediaDrawerHint(key, st)
  updateDrawerVscroll(key)
}

function updateDrawerVscroll(key) {
  if (key !== 'business') return
  const st = mediaPages[key]
  const total = mediaCardTotal(key)
  const thumb = document.getElementById('bizMediaDrawerThumb')
  const track = thumb?.parentElement
  const up = document.getElementById('bizMediaDrawerUp')
  const down = document.getElementById('bizMediaDrawerDown')
  if (!thumb || !track) return
  if (total <= 1) {
    thumb.style.height = '100%'
    thumb.style.transform = 'translateY(0)'
    if (up) up.disabled = true
    if (down) down.disabled = true
    return
  }
  if (up) up.disabled = false
  if (down) down.disabled = false
  const trackH = track.clientHeight || 1
  const thumbH = Math.max(24, trackH / Math.max(total, 4))
  const pct = st.carouselIndex / (total - 1)
  thumb.style.height = thumbH + 'px'
  thumb.style.transform = `translateY(${(trackH - thumbH) * pct}px)`
}

function bindDrawerVscroll(key) {
  if (key !== 'business' || document.body.dataset.bizDrawerVscrollBound) return
  document.body.dataset.bizDrawerVscrollBound = '1'
  const up = document.getElementById('bizMediaDrawerUp')
  const down = document.getElementById('bizMediaDrawerDown')
  const track = document.getElementById('bizMediaDrawerVscrollTrack')
  const thumb = document.getElementById('bizMediaDrawerThumb')
  up?.addEventListener('click', () => moveMediaCarousel(key, -1))
  down?.addEventListener('click', () => moveMediaCarousel(key, 1))
  if (!track || !thumb) return

  let dragging = false
  let dragPointerId = null
  let dragOffsetY = 0
  let lastIdx = -1

  function vscrollMetrics() {
    const total = mediaCardTotal(key)
    const trackH = track.clientHeight || 1
    const thumbH = Math.max(24, trackH / Math.max(total, 4))
    return { total, trackH, thumbH }
  }

  function idxFromPointerY(clientY, centerThumb) {
    const { total, trackH, thumbH } = vscrollMetrics()
    if (total <= 1) return 0
    const rect = track.getBoundingClientRect()
    let thumbTop = clientY - rect.top
    thumbTop -= centerThumb ? thumbH / 2 : dragOffsetY
    thumbTop = Math.max(0, Math.min(trackH - thumbH, thumbTop))
    const pct = thumbTop / Math.max(1, trackH - thumbH)
    return Math.round(pct * (total - 1))
  }

  function setDragging(on) {
    dragging = on
    thumb.classList.toggle('is-dragging', on)
    track.classList.toggle('is-dragging', on)
  }

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return
    const { total } = vscrollMetrics()
    if (total <= 1) return
    dragPointerId = e.pointerId
    track.setPointerCapture(e.pointerId)
    setDragging(true)
    const onThumb = e.target.closest('.gs-media-drawer-vscroll-thumb')
    if (onThumb) {
      dragOffsetY = e.clientY - thumb.getBoundingClientRect().top
    } else {
      dragOffsetY = vscrollMetrics().thumbH / 2
      const idx = idxFromPointerY(e.clientY, true)
      lastIdx = idx
      snapToDrawerIndex(key, idx)
    }
    e.preventDefault()
  }

  function onPointerMove(e) {
    if (!dragging || e.pointerId !== dragPointerId) return
    const idx = idxFromPointerY(e.clientY, false)
    if (idx !== lastIdx) {
      lastIdx = idx
      snapToDrawerIndex(key, idx)
    }
  }

  function onPointerUp(e) {
    if (!dragging || e.pointerId !== dragPointerId) return
    setDragging(false)
    dragPointerId = null
    lastIdx = -1
    track.releasePointerCapture(e.pointerId)
    updateDrawerVscroll(key)
  }

  track.addEventListener('pointerdown', onPointerDown)
  track.addEventListener('pointermove', onPointerMove)
  track.addEventListener('pointerup', onPointerUp)
  track.addEventListener('pointercancel', onPointerUp)
}

function getMediaDrawerHint(key, st) {
  const t = TX[LANG]
  if (key === 'business' && t.mediaHintDrawerTouch) {
    const touch = window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 1024
    if (touch) return t.mediaHintDrawerTouch
  }
  return t.mediaHintDrawer
}

function snapDrawerIndex(key, idx) {
  snapToDrawerIndex(key, idx)
}

function setDrawerFocus(key, focused) {
  const st = mediaPages[key]
  st.drawerFocused = !!focused
  updateMediaDrawer(key)
}

function handleDrawerCardClick(key, idx) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  if (idx !== st.carouselIndex) snapToDrawerIndex(key, idx)
  showDrawer(cfg.drawerType, idx)
}

function finishDrawerWheelIdle(key) {
  const st = mediaPages[key]
  if (st.wheelIdleTimer) { clearTimeout(st.wheelIdleTimer); st.wheelIdleTimer = null }
  st.wheelDriving = false
  const target = Math.round(st.carouselTarget)
  if (st.snapAnim) { cancelAnimationFrame(st.snapAnim); st.snapAnim = null }
  snapDrawerCarouselTo(key, target, false, false, true)
}

function scheduleDrawerWheelIdle(key) {
  const st = mediaPages[key]
  if (st.wheelIdleTimer) clearTimeout(st.wheelIdleTimer)
  st.wheelIdleTimer = setTimeout(() => {
    st.wheelIdleTimer = null
    finishDrawerWheelIdle(key)
  }, DRAWER_WHEEL_IDLE_MS)
}

function applyDrawerWheelDelta(key, deltaCards) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  if (activeSection !== cfg.activeSection) return false
  if (st.drawerFocused) return false
  if (!deltaCards) return false
  if (!st.wheelDriving) {
    if (st.snapAnim) { cancelAnimationFrame(st.snapAnim); st.snapAnim = null }
    st.wheelDriving = true
    st.carouselTarget = st.carouselOffset + deltaCards
    startDrawerWheelLoop(key)
  } else {
    st.carouselTarget += deltaCards
  }
  scheduleDrawerWheelIdle(key)
  return true
}

function onDrawerWheel(e, key) {
  e.preventDefault()
  let delta = e.deltaY
  if (e.deltaMode === 1) delta *= MEDIA_WHEEL_CARD_PX
  else if (e.deltaMode === 2) delta *= MEDIA_WHEEL_CARD_PX * 3
  applyDrawerWheelDelta(key, delta / MEDIA_WHEEL_CARD_PX)
}

function bindDrawerTouch(drawer, key) {
  if (key !== 'business') return
  let tracking = false
  let lastY = 0
  const snapOnRelease = () => {
    tracking = false
    const st = mediaPages[key]
    if (!st.wheelDriving && !st.wheelIdleTimer) return
    finishDrawerWheelIdle(key)
  }
  drawer.addEventListener('touchstart', (e) => {
    const cfg = MEDIA_PAGES[key]
    const st = mediaPages[key]
    if (activeSection !== cfg.activeSection || st.drawerFocused) return
    if (!e.touches.length) return
    tracking = true
    lastY = e.touches[0].clientY
  }, { passive: true })
  drawer.addEventListener('touchmove', (e) => {
    if (!tracking || !e.touches.length) return
    const y = e.touches[0].clientY
    const deltaY = lastY - y
    lastY = y
    if (Math.abs(deltaY) < 0.5) return
    if (applyDrawerWheelDelta(key, deltaY / MEDIA_WHEEL_CARD_PX)) e.preventDefault()
  }, { passive: false })
  drawer.addEventListener('touchend', snapOnRelease, { passive: true })
  drawer.addEventListener('touchcancel', snapOnRelease, { passive: true })
}

function bindMediaDrawer(key) {
  const cfg = MEDIA_PAGES[key]
  const section = document.getElementById(cfg.sectionId)
  const drawer = document.getElementById(cfg.drawerWrapId)
  const track = document.getElementById(cfg.trackId)
  if (!section || !drawer || !track || section.dataset.drawerBound) return
  section.dataset.drawerBound = '1'
  drawer.addEventListener('wheel', (e) => onDrawerWheel(e, key), { passive: false })
  bindDrawerTouch(drawer, key)
  bindDrawerVscroll(key)
  track.addEventListener('click', (e) => {
    const card = e.target.closest('.gs-drawer-card')
    if (!card) return
    handleDrawerCardClick(key, +card.dataset.index)
  })
  document.getElementById(cfg.drawerCloseId)?.addEventListener('click', () => setDrawerFocus(key, false))
}

function renderMediaDrawerTrack(key) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  const t = TX[LANG]
  const track = document.getElementById(cfg.trackId)
  if (!track) return
  st.displayedCards = getFilteredMediaCards(key)
  st.drawerFocused = false
  st.wheelDriving = false
  if (st.wheelIdleTimer) { clearTimeout(st.wheelIdleTimer); st.wheelIdleTimer = null }
  if (st.carouselIndex >= st.displayedCards.length) st.carouselIndex = 0
  st.carouselOffset = st.carouselIndex
  st.carouselTarget = st.carouselIndex
  if (!st.displayedCards.length) {
    track.innerHTML = `<p class="gs-media-empty">${t.mediaFilterEmpty}</p>`
    const counter = document.getElementById(cfg.counterId)
    if (counter) counter.textContent = `0 / 0`
    updateDrawerVscroll(key)
    return
  }
  track.innerHTML = st.displayedCards.map((c, i) => `<article class="gs-drawer-card" data-index="${i}">
    <div class="gs-media-card-inner">
      <span class="gs-media-card-loc" aria-label="${c.country.replace(/"/g, '&quot;')}">
        <span class="gs-media-card-loc-name">${c.country}</span>
        <span class="gs-media-card-flag" role="img" aria-hidden="true">${mediaFlagTag(c.seed, c.country)}</span>
      </span>
      <div class="gs-media-card-cover">${imgTag(c.img, c.seed, c.title)}</div>
      <div class="gs-media-card-cap">
        <span class="gs-media-card-tag">${c.tag}</span>
        <p class="gs-media-card-country">${c.country}</p>
        <h4 class="gs-media-card-title">${c.title}</h4>
        <p class="gs-media-card-summary">${c.summary}</p>
        <p class="gs-media-card-source">${c.source}</p>
      </div>
    </div>
  </article>`).join('')
  updateMediaDrawer(key)
}

function renderMediaCardsTrack(key) {
  const cfg = MEDIA_PAGES[key]
  if (cfg.drawer) return renderMediaDrawerTrack(key)
  const st = mediaPages[key]
  const t = TX[LANG]

function snapToMediaIndex(key, idx) {
  const st = mediaPages[key]
  const total = mediaCardTotal(key)
  const cur = Math.round(st.carouselOffset)
  const curMod = mediaNormIndex(cur, total)
  let diff = idx - curMod
  if (diff > total / 2) diff -= total
  if (diff < -total / 2) diff += total
  snapMediaCarouselTo(key, cur + diff, true)
}

function updateMediaCarousel(wheeling, key) {
  const cfg = MEDIA_PAGES[key]
  if (cfg.drawer) return updateMediaDrawer(key)
  if (cfg.vertical) return updateMediaCarouselVertical(wheeling, key)
  const st = mediaPages[key]
  const section = document.getElementById(cfg.sectionId)
  if (!section) return
  const cards = section.querySelectorAll('.gs-media-card')
  const total = mediaCardTotal(key)
  if (!cards.length) return
  const track = document.getElementById(cfg.trackId)
  const stage = section.querySelector('.gs-media-carousel-stage')
  if (track) track.classList.toggle('is-wheeling', !!wheeling)
  const stageW = stage?.clientWidth || 960
  const cardW = cards[0]?.offsetWidth || 280
  const cardHalf = cardW / 2
  const visibleHalf = (MEDIA_VISIBLE_COUNT - 1) / 2
  const angleDeg = Math.min(28, Math.max(18, 360 / Math.max(total, 4)))
  const angleRad = angleDeg * (Math.PI / 180)
  const outerTheta = visibleHalf * angleRad
  const outerSin = Math.sin(outerTheta)
  const outerFront = (Math.cos(outerTheta) + 1) / 2
  const outerScale = 0.44 + 0.56 * outerFront
  const edgePad = 2
  const maxTx = stageW / 2 - cardHalf * outerScale * 0.22 - edgePad
  const radius = Math.max(175, maxTx / Math.max(0.46, outerSin))
  cards.forEach((card, i) => {
    const d = mediaWrapDist(i, st.carouselOffset, total)
    const theta = d * angleRad
    const cosT = Math.cos(theta)
    const sinT = Math.sin(theta)
    const tx = sinT * radius
    const tz = (cosT - 1) * radius
    const ry = -d * angleDeg
    const front = (cosT + 1) / 2
    const scale = 0.44 + 0.56 * front
    const absD = Math.abs(d)
    const nearSideExtreme = Math.abs(sinT) > 0.9 && absD > visibleHalf + 0.35 && absD < total * 0.47
    const onFrontArc = absD <= visibleHalf + 0.08
    const onBackCenter = cosT < -0.58
    const onWrapReturn = absD >= total * 0.34 && cosT < -0.15 && Math.abs(sinT) < 0.72
    let show = !nearSideExtreme && (onFrontArc || onBackCenter || onWrapReturn)
    card.style.transform = `translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg) scale(${scale})`
    card.style.zIndex = String(Math.round(200 + tz))
    if (!show) {
      card.style.opacity = '0'
      card.style.pointerEvents = 'none'
      card.classList.remove('is-active', 'is-side', 'is-back')
      return
    }
    const sideFade = 1 - Math.max(0, absD - 0.4) * 0.1
    if (onBackCenter || (onWrapReturn && !onFrontArc)) {
      card.style.opacity = String(Math.max(0.16, 0.14 + front * 0.38))
      card.style.pointerEvents = 'auto'
      card.classList.add('is-back')
      card.classList.remove('is-side')
    } else {
      card.style.opacity = String(Math.max(0.46, (0.42 + 0.58 * Math.min(1, front * 1.08)) * sideFade))
      card.style.pointerEvents = 'auto'
      card.classList.remove('is-back')
      card.classList.toggle('is-side', absD >= 0.45)
    }
    card.classList.toggle('is-active', absD < 0.45 && front > 0.72)
  })
  st.carouselIndex = mediaNormIndex(st.carouselOffset, total)
  const counter = document.getElementById(cfg.counterId)
  if (counter) counter.textContent = `${st.carouselIndex + 1} / ${total}`
  const prev = document.getElementById(cfg.prevId)
  const next = document.getElementById(cfg.nextId)
  if (prev) prev.disabled = false
  if (next) next.disabled = false
}

function mediaEaseInOutCubic(p) {
  return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2
}

function snapMediaCarouselTo(key, target, fast, arrow, wheel) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  if (!wheel) st.wheelDriving = false
  if (st.snapAnim) { cancelAnimationFrame(st.snapAnim); st.snapAnim = null }
  st.carouselTarget = target
  const start = st.carouselOffset
  const startTime = performance.now()
  const wheelDist = Math.abs(target - start)
  const duration = wheel
    ? Math.max(50, Math.min(MEDIA_SNAP_STEP_MS * wheelDist, MEDIA_SNAP_STEP_MS * 4))
    : (arrow ? MEDIA_SNAP_STEP_MS : (fast ? MEDIA_SNAP_CLICK_MS : MEDIA_SNAP_MS))
  const track = document.getElementById(cfg.trackId)
  if (track) { track.classList.remove('is-wheeling'); track.classList.add('is-snapping') }
  function frame(now) {
    const p = Math.min(1, (now - startTime) / duration)
    const ease = mediaEaseInOutCubic(p)
    st.carouselOffset = start + (target - start) * ease
    updateMediaCarousel(false, key)
    if (p < 1) st.snapAnim = requestAnimationFrame(frame)
    else {
      st.carouselOffset = target
      st.carouselTarget = target
      st.carouselIndex = mediaNormIndex(target, mediaCardTotal(key))
      st.snapAnim = null
      if (track) track.classList.remove('is-snapping')
      updateMediaCarousel(false, key)
    }
  }
  st.snapAnim = requestAnimationFrame(frame)
}

function snapMediaCarousel(key) {
  snapMediaCarouselTo(key, Math.round(mediaPages[key].carouselTarget))
}

function moveMediaCarousel(key, dir) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  if (st.wheelIdleTimer) { clearTimeout(st.wheelIdleTimer); st.wheelIdleTimer = null }
  st.wheelDriving = false
  const target = Math.round(st.carouselOffset) + dir
  if (cfg.drawer) snapDrawerCarouselTo(key, target, false, true)
  else snapMediaCarouselTo(key, target, false, true)
}

function startMediaWheelLoop(key) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  const track = document.getElementById(cfg.trackId)
  if (track) { track.classList.remove('is-wheeling'); track.classList.add('is-snapping') }
  st.wheelLastFrame = performance.now()
  function frame(now) {
    const dt = Math.min(48, now - st.wheelLastFrame)
    st.wheelLastFrame = now
    const diff = st.carouselTarget - st.carouselOffset
    if (Math.abs(diff) <= 0.001) {
      st.carouselOffset = st.carouselTarget
      updateMediaCarousel(false, key)
      if (!st.wheelDriving) {
        st.snapAnim = null
        if (track) track.classList.remove('is-snapping')
        return
      }
    } else {
      const step = Math.sign(diff) * Math.min(Math.abs(diff), dt / MEDIA_SNAP_STEP_MS)
      st.carouselOffset += step
      updateMediaCarousel(false, key)
    }
    st.snapAnim = requestAnimationFrame(frame)
  }
  if (st.snapAnim) cancelAnimationFrame(st.snapAnim)
  st.snapAnim = requestAnimationFrame(frame)
}

function onMediaStageWheel(e, key) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  if (activeSection !== cfg.activeSection) return
  e.preventDefault()
  let delta = e.deltaY
  if (e.deltaMode === 1) delta *= MEDIA_WHEEL_CARD_PX
  else if (e.deltaMode === 2) delta *= MEDIA_WHEEL_CARD_PX * 3
  const deltaCards = delta / MEDIA_WHEEL_CARD_PX
  if (!st.wheelDriving) {
    if (st.snapAnim) { cancelAnimationFrame(st.snapAnim); st.snapAnim = null }
    st.wheelDriving = true
    st.carouselTarget = st.carouselOffset + deltaCards
    startMediaWheelLoop(key)
  } else {
    st.carouselTarget += deltaCards
  }
  if (st.wheelIdleTimer) clearTimeout(st.wheelIdleTimer)
  st.wheelIdleTimer = setTimeout(() => {
    st.wheelIdleTimer = null
    st.wheelDriving = false
    st.carouselTarget = Math.round(st.carouselTarget)
    if (!st.snapAnim) startMediaWheelLoop(key)
  }, MEDIA_WHEEL_IDLE_MS)
}

function getMediaCardAtPoint(clientX, clientY, sectionEl, vertical) {
  const cards = [...sectionEl.querySelectorAll('.gs-media-card')].filter(c => {
    if (c.style.opacity === '0') return false
    const r = c.getBoundingClientRect()
    return r.width > 0 && r.height > 0
      && clientX >= r.left && clientX <= r.right
      && clientY >= r.top && clientY <= r.bottom
  })
  if (!cards.length) return null
  let best = null, bestDist = Infinity
  cards.forEach(card => {
    const r = card.getBoundingClientRect()
    const dist = vertical
      ? Math.abs(clientY - (r.top + r.height / 2))
      : Math.abs(clientX - (r.left + r.width / 2))
    if (dist < bestDist) { best = card; bestDist = dist }
  })
  return best
}

function handleMediaCardPick(clientX, clientY, key) {
  const cfg = MEDIA_PAGES[key]
  const st = mediaPages[key]
  const section = document.getElementById(cfg.sectionId)
  const card = getMediaCardAtPoint(clientX, clientY, section, cfg.vertical)
  if (!card) return
  const idx = +card.dataset.index
  if (idx === st.carouselIndex) { showDrawer(cfg.drawerType, idx); return }
  snapToMediaIndex(key, idx)
}

function bindMediaCarousel() {
  if (!window.__gsMediaCarouselResizeBound) {
    window.__gsMediaCarouselResizeBound = true
    window.addEventListener('resize', () => {
      clearTimeout(mediaResizeTimer)
      mediaResizeTimer = setTimeout(() => {
        Object.keys(MEDIA_PAGES).forEach(k => {
          if (MEDIA_PAGES[k].drawer) updateMediaDrawer(k)
          else updateMediaCarousel(false, k)
        })
      }, 120)
    }, { passive: true })
  }
  Object.keys(MEDIA_PAGES).forEach(key => {
    const cfg = MEDIA_PAGES[key]
    if (cfg.drawer) {
      bindMediaDrawer(key)
      return
    }
    const section = document.getElementById(cfg.sectionId)
    const track = document.getElementById(cfg.trackId)
    const stage = section?.querySelector('.gs-media-carousel-stage')
    if (!section || !track || !stage || section.dataset.bound) return
    section.dataset.bound = '1'
    stage.addEventListener('wheel', (e) => onMediaStageWheel(e, key), { passive: false })
    stage.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return
      const card = getMediaCardAtPoint(e.clientX, e.clientY, section, cfg.vertical)
      if (!card) return
      e.preventDefault()
      handleMediaCardPick(e.clientX, e.clientY, key)
    })
    document.getElementById(cfg.prevId)?.addEventListener('click', () => moveMediaCarousel(key, -1))
    document.getElementById(cfg.nextId)?.addEventListener('click', () => moveMediaCarousel(key, 1))
  })
}

function applyColorMode() {
  document.documentElement.classList.toggle('gs-light', colorMode.value === 'light')
  try { localStorage.setItem('gs-color-mode', colorMode.value) } catch (_) {}
}

function toggleColorMode(event) {
  const next = colorMode.value === 'light' ? 'dark' : 'light'
  const goingDark = next === 'dark'
  const apply = () => {
    colorMode.value = next
    applyColorMode()
  }
  if (!document.startViewTransition || !event) {
    apply()
    return
  }
  const root = document.documentElement
  const x = event.clientX
  const y = event.clientY
  const endRadius = Math.hypot(
    Math.max(x, window.innerWidth - x),
    Math.max(y, window.innerHeight - y)
  )
  root.dataset.themeTransition = goingDark ? 'to-dark' : 'to-light'
  const animBase = { duration: 450, fill: 'forwards' }
  const expand = [
    `circle(0px at ${x}px ${y}px)`,
    `circle(${endRadius}px at ${x}px ${y}px)`
  ]
  const shrink = [
    `circle(${endRadius}px at ${x}px ${y}px)`,
    `circle(0px at ${x}px ${y}px)`
  ]
  const fullyOpenClip = [
    `circle(${endRadius}px at ${x}px ${y}px)`,
    `circle(${endRadius}px at ${x}px ${y}px)`
  ]
