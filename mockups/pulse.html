<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>KB Global One Team — Global Pulse</title>
<meta name="description" content="KB 글로벌 원팀 뉴스 — 오늘 글로벌 금융시장의 주요 변화를 한눈에"/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap"/>
<style>
/* ══════════════════════════════════════════════════════════════════════
   KB GLOBAL ONE TEAM — Global Pulse
   · 시안(KakaoTalk_20260901_083938788_01.png) 재현
   · 사진/국기 등 모든 에셋은 인라인 SVG로 대체 (외부 이미지 0개)
   · 지도 거점은 하단 GLOBAL_PULSE.points 배열로 전량 제어
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* 브랜드 */
  --navy:#15294D; --navy-2:#1E3565; --navy-deep:#091B3C;
  --gold:#F1A33A; --gold-2:#FFB300; --gold-soft:#FEEAB8;

  /* 시그널 */
  --risk:#E20817;    --risk-bg:#FDECEE;
  --watch:#F4A418;   --watch-bg:#FEF3E0;
  --positive:#209D47;--positive-bg:#E7F6EC;

  /* 중립 */
  --ink:#152048; --ink-2:#33415C; --muted:#7A8699; --faint:#A8B2C1;
  --line:#EEF1F6; --line-2:#E3E8F0;
  --bg:#FBFCFE; --card:#FFFFFF; --map-dot:#D7DBE4;

  --r-lg:22px; --r-md:16px; --r-sm:12px; --r-xs:9px;
  --shadow:0 2px 16px rgba(20,32,72,.055), 0 1px 3px rgba(20,32,72,.04);
  --shadow-pop:0 6px 22px rgba(20,32,72,.13), 0 1px 4px rgba(20,32,72,.07);

  --pad:clamp(10px, 2.4cqi, 15px);
  --shell:864px;

  --f-ko:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
         'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-en:'Poppins','Pretendard Variable',Pretendard,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-ko); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
.en{font-family:var(--f-en);letter-spacing:.005em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 셸 ─────────────────────────────────────────────── */
.shell{max-width:var(--shell);margin:0 auto;padding:0 var(--pad) 20px;
       container-type:inline-size;container-name:shell}
.col{container-type:inline-size;min-width:0}

/* ── 상태바(프레젠테이션용) ─────────────────────────── */

/* ── 헤더 ───────────────────────────────────────────── */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 0 16px}
.hd-brand{min-width:0}
.brandline{display:flex;align-items:center;gap:8px}
.brandline .kbmark{flex:none}
.brandline span{
  font-family:var(--f-en);font-weight:600;font-size:clamp(12px,2.2cqi,19px);
  color:var(--navy);letter-spacing:.01em;white-space:nowrap;
}
.hd h1{
  font-family:var(--f-en);font-weight:700;color:var(--navy);
  font-size:clamp(22px,4.4cqi,38px);line-height:1.1;letter-spacing:-.012em;margin-top:5px;
}
.hd-sub{display:flex;align-items:center;gap:7px;margin-top:4px}
.hd-sub b{font-weight:600;font-size:clamp(13px,2.32cqi,20px);color:var(--navy-2)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--gold-2);flex:none}

.hd-tools{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.langtoggle{
  display:flex;background:#fff;border:1px solid var(--line-2);border-radius:999px;
  padding:3px;box-shadow:var(--shadow);
}
.langtoggle button{
  font-family:var(--f-en);font-weight:600;font-size:clamp(11.5px,1.74cqi,15px);letter-spacing:.03em;
  color:var(--faint);padding:clamp(5px,.8cqi,8px) clamp(12px,2cqi,17px);border-radius:999px;transition:.18s;
}
.langtoggle button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ── 공통 카드 ──────────────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);margin-bottom:10px;
}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-t{font-family:var(--f-en);font-weight:600;font-size:clamp(17px,2.9cqi,25px);color:var(--navy);letter-spacing:-.005em}
.sec-more{
  display:inline-flex;align-items:center;gap:3px;font-size:clamp(12.5px,1.74cqi,15px);color:var(--muted);font-weight:500;
}
.count-pill{
  display:inline-grid;place-items:center;padding:0 clamp(6px,1cqi,9px);border-radius:999px;
  min-width:clamp(24px,3.4cqi,30px);height:clamp(24px,3.4cqi,30px);
  background:var(--gold-soft);color:#B67611;
  font-family:var(--f-en);font-weight:600;font-size:clamp(12px,1.74cqi,15px);
}

/* ── GLOBAL PULSE ───────────────────────────────────── */
.pulse{padding:12px var(--pad) 10px}
.pulse-sub{font-size:clamp(11px,1.6cqi,13.5px);color:var(--muted);margin-top:3px}
.pulse .sec-t{font-size:clamp(14.5px,2.3cqi,19px)}

.map-wrap{
  position:relative;width:100%;aspect-ratio:78/46;margin:clamp(6px,1.2cqi,10px) 0 5px;
  container-type:inline-size;
}
.map-dots{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-dots circle{fill:var(--map-dot)}

.mk{position:absolute;transform:translate(-50%,-50%);z-index:2}
.mk-dot{
  position:relative;display:block;border-radius:50%;
  width:clamp(11px,2.4cqw,20px);height:clamp(11px,2.4cqw,20px);
  border:2px solid #fff;box-shadow:0 1px 4px rgba(20,32,72,.25);
}
.mk-dot::before,.mk-dot::after{
  content:"";position:absolute;inset:-2px;border-radius:50%;
  background:currentColor;opacity:.45;animation:ripple 2.8s cubic-bezier(.2,.6,.3,1) infinite;
}
.mk-dot::after{animation-delay:1.4s}
@keyframes ripple{0%{transform:scale(1);opacity:.42}70%{opacity:0}100%{transform:scale(3.6);opacity:0}}
.mk[data-level="risk"] .mk-dot{background:var(--risk);color:var(--risk)}
.mk[data-level="watch"] .mk-dot{background:var(--watch);color:var(--watch)}
.mk[data-level="positive"] .mk-dot{background:var(--positive);color:var(--positive)}

.mk-hq{
  display:grid;place-items:center;width:clamp(28px,5.7cqw,46px);height:clamp(28px,5.7cqw,46px);
  border-radius:50%;background:linear-gradient(150deg,#FFB74D,#F08C1E);
  color:#fff;border:2.5px solid #fff;position:relative;
  box-shadow:0 3px 12px rgba(240,140,30,.5);
}
.mk-hq::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;background:var(--gold);
  opacity:.3;animation:ripple 3.2s cubic-bezier(.2,.6,.3,1) infinite;z-index:-1;
}
.mk-hq svg{width:58%;height:58%}

/* 거점 말풍선 */
.pop{
  position:absolute;z-index:3;background:#fff;border-radius:var(--r-md);
  border:1px solid var(--line-2);box-shadow:var(--shadow-pop);
  padding:clamp(8px,1.5cqw,13px) clamp(10px,1.9cqw,17px);
  min-width:max-content;pointer-events:none;
  opacity:0;transition:opacity .22s ease;
}
.pop.on{opacity:1}
.pop-h{display:flex;align-items:center;gap:7px;white-space:nowrap}
.pop-code{font-family:var(--f-en);font-weight:600;font-size:clamp(13px,2.58cqw,20px);color:var(--navy);letter-spacing:-.01em}
.pop-topic{font-size:clamp(11.5px,2.19cqw,17px);font-weight:600;color:var(--ink-2);margin-top:6px;white-space:nowrap}
.pop-n{font-size:clamp(10.5px,1.94cqw,15px);color:var(--muted);margin-top:3px}
.pop[data-level="risk"]{border-color:#FAD4D8}
.pop[data-level="watch"]{border-color:#FAE3BE}
.pop[data-level="positive"],.pop[data-level="hq"]{border-color:var(--line-2)}

.badge{
  display:inline-flex;align-items:center;border-radius:7px;
  font-family:var(--f-en);font-weight:600;letter-spacing:.03em;
  font-size:clamp(9.5px,1.5cqi,13px);padding:clamp(3px,.55cqi,5px) clamp(6px,1cqi,9px);line-height:1;
}
.badge[data-level="risk"]{background:var(--risk-bg);color:var(--risk)}
.badge[data-level="watch"]{background:var(--watch-bg);color:#D98B0C}
.badge[data-level="positive"]{background:var(--positive-bg);color:var(--positive)}

/* 범례 */
.legend{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;margin-top:6px;
}
.legend-l{display:flex;align-items:center;gap:clamp(8px,2.8vw,16px)}
.lg{display:flex;align-items:center;gap:5px;font-family:var(--f-en);font-size:clamp(11px,1.85cqi,16px);font-weight:500;color:var(--ink-2);white-space:nowrap}
.lg i{width:clamp(8px,1.2cqi,11px);height:clamp(8px,1.2cqi,11px);border-radius:50%;flex:none}
.lg b{font-weight:600;color:var(--navy);margin-left:2px}
.legend-r{font-family:var(--f-en);font-size:clamp(10.5px,1.74cqi,15px);color:var(--muted);font-weight:500;white-space:nowrap}


/* ── TODAY'S GLOBAL BRIEF ───────────────────────────── */
.brief{background:linear-gradient(170deg,#FFFDF8 0%,#FFFCF5 100%);border-color:#F6EDDD;padding:14px var(--pad)}
.brief-h{display:flex;align-items:center;gap:9px}
.brief-h .ico{
  display:grid;place-items:center;width:clamp(24px,3.2cqi,30px);height:clamp(24px,3.2cqi,30px);border-radius:50%;
  background:#FEF2DC;color:var(--gold-2);flex:none;
}
.brief-h .ico svg{width:15px;height:15px}
.brief-txt{margin-top:9px;font-size:clamp(13px,2.03cqi,17.5px);line-height:1.66;color:var(--ink-2);word-break:keep-all}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:clamp(5px,1.3cqi,11px);
       border-radius:var(--r-md);border:1px solid;padding:clamp(4px,.6cqi,6px) clamp(8px,1.5cqi,13px);
       flex:none;width:clamp(140px,42vw,172px)}
.chip .tx{min-width:0}
.chip .row{display:flex;align-items:center;gap:4px}
.chip .nm{font-size:clamp(11.5px,1.97cqi,17px);font-weight:600;color:var(--ink);white-space:nowrap;line-height:1.1}
.chip .dsc{font-size:clamp(10px,1.62cqi,13.5px);color:var(--muted);margin-top:0;line-height:1.2;white-space:nowrap}
.chip .ic{width:clamp(22px,4.4cqi,38px);height:clamp(22px,4.4cqi,38px);flex:none}
.chip .ar{width:clamp(9px,1.35cqi,12px);height:clamp(10px,1.5cqi,14px);flex:none}
.chip[data-k="rate"]  {background:#FEF4F4;border-color:#FBE3E5}
.chip[data-k="fx"]    {background:#F7FAFE;border-color:#E2ECFA}
.chip[data-k="energy"]{background:#FEF8F0;border-color:#FAE8D2}
.chip[data-k="reg"]   {background:#F9F6FD;border-color:#EBE3F8}

/* ── TOP ISSUES ─────────────────────────────────────── */
.issues{padding:14px var(--pad) 6px}
.hero{
  border:1px solid var(--line);border-radius:var(--r-md);padding:clamp(11px,1.7cqi,15px);margin-top:11px;
}
.hero-rank{
  display:grid;place-items:center;flex:none;
  width:clamp(24px,3.4cqi,30px);height:clamp(24px,3.4cqi,30px);border-radius:8px;background:var(--navy);
  color:#fff;font-family:var(--f-en);font-weight:600;font-size:clamp(12px,1.7cqi,15px);
}
.hero-body{display:flex;flex-direction:column;min-width:0;padding:4px 4px 2px 0}
.hero-top{display:flex;align-items:center;gap:8px}
.hero-cc{font-family:var(--f-en);font-size:clamp(12px,1.8cqi,15.5px);font-weight:500;color:var(--ink-2);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-top .badge{margin-left:auto;flex:none}
.hero-t{font-size:clamp(16px,2.6cqi,23px);font-weight:700;line-height:1.34;color:var(--navy);margin-top:8px;letter-spacing:-.015em;word-break:keep-all}
.hero-d{font-size:clamp(13px,1.9cqi,16.5px);line-height:1.62;color:var(--muted);margin-top:7px;word-break:keep-all}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tag{background:#EEF3FC;color:#3D5A94;border-radius:8px;padding:clamp(4px,.7cqi,7px) clamp(8px,1.3cqi,12px);
     font-size:clamp(11px,1.62cqi,14px);font-weight:500}

.rows{margin-top:10px}
.row{
  display:flex;align-items:center;gap:clamp(6px,1.2cqi,10px);
  padding:clamp(10px,1.5cqi,13px) 2px clamp(10px,1.5cqi,13px) 0;
  border-top:1px solid var(--line);border-left:4px solid var(--line2);border-radius:0 8px 8px 0;
}
.rows .row:first-child{border-top:0}
.row-top{border-left-color:var(--gold);background:#FFFCF5}
.row-rank{
  display:grid;place-items:center;flex:none;border-radius:50%;
  width:clamp(28px,4cqi,36px);height:clamp(28px,4cqi,36px);
  background:var(--navy);color:#fff;font-family:var(--f-en);font-weight:600;font-size:clamp(12px,1.74cqi,15px);
}
.row-flag{width:clamp(24px,3.5cqi,32px);height:clamp(24px,3.5cqi,32px);flex:none}
.row-cc{
  font-family:var(--f-en);font-size:clamp(11px,1.62cqi,14px);font-weight:500;color:var(--ink-2);
  letter-spacing:.03em;width:clamp(66px,10.5cqi,96px);flex:none;
}
.row .badge{flex:none;width:clamp(58px,9.2cqi,84px);justify-content:center}
.row-t{font-size:clamp(12.5px,1.85cqi,15.5px);font-weight:600;color:var(--navy);min-width:0;flex:1;
       overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4}
.row-ar{color:var(--faint);flex:none}
.more-btn{display:grid;place-items:center;width:100%;padding:8px 0 12px;color:var(--faint)}
.rflag{flex:none;display:block;border-radius:0 6px 6px 0}
.fbar{display:inline-flex;align-items:center;line-height:0;border-left:4px solid}
.cat{font-family:var(--f-en);font-weight:600;letter-spacing:.02em;flex:none;white-space:nowrap;
     font-size:clamp(10px,1.5cqi,12.5px);padding:clamp(2px,.4cqi,3px) clamp(6px,1cqi,9px);border-radius:6px}
.cat.mono{color:var(--muted);background:#EEF1F6}

/* ── COUNTRIES ──────────────────────────────────────── */
.countries{padding:14px var(--pad)}
.cty-scroll{
  display:flex;gap:clamp(10px,3vw,16px);margin-top:14px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  padding-bottom:2px;
}
.cty-scroll::-webkit-scrollbar{display:none}
.cty{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;width:clamp(56px,8.6cqi,80px);cursor:pointer}
.cty svg{width:clamp(40px,6.1cqi,54px);height:clamp(40px,6.1cqi,54px);filter:drop-shadow(0 2px 5px rgba(20,32,72,.14))}
.cty span{font-size:clamp(11px,1.62cqi,14px);color:var(--ink-2);text-align:center;line-height:1.25;white-space:nowrap}
.cty-more .box{
  display:grid;place-items:center;border-radius:14px;
  width:clamp(40px,6.1cqi,54px);height:clamp(40px,6.1cqi,54px);
  background:#fff;border:1px solid var(--line-2);color:var(--navy-2);
}


/* ── 반응형: 넓은 화면에서 2단 ──────────────────────── */
@media (min-width:1280px){
  :root{--shell:1240px}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
  .grid2>.col{min-width:0}
  .hero{grid-template-columns:minmax(0,.5fr) minmax(0,1fr)}
}
/* 좁은 화면: 지도 말풍선을 컴팩트 모드로 (겹침 방지) */
@media (max-width:600px){
  .pop{padding:6px 8px;border-radius:11px}
  .pop-code{font-size:12px}
  .pop-topic{font-size:10.5px;margin-top:3px}
  .pop-n{display:none}
  .badge{font-size:9px;padding:2px 5px;border-radius:5px}
  .mk-dot{width:11px;height:11px;border-width:1.5px}
}
@media (max-width:520px){
  .row-cc{width:64px;font-size:11px}
  .row .badge{width:58px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ── GLOBAL MARKETS 티커 ── */
.mkt-marquee{overflow:hidden;margin-top:11px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.mkt-track{display:flex;gap:9px;width:max-content;animation:mkt-scroll 48s linear infinite}
.mkt-marquee:hover .mkt-track{animation-play-state:paused}
@keyframes mkt-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mkt{flex:none;width:clamp(162px,43cqi,190px);min-height:82px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mkt-h{display:flex;align-items:center;gap:6px}
.mkt-fl{flex:none;filter:drop-shadow(0 1px 2px rgba(20,32,72,.15))}
.mkt-h .nm{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mkt-h .cc{font-family:var(--f-en);font-size:10px;font-weight:600;color:var(--faint);flex:none}
.mkt-r{display:flex;align-items:baseline;gap:6px;margin-top:6px;font-size:11.5px;min-width:0}
.mkt-r .l{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt-r .rgt{margin-left:auto;display:flex;align-items:baseline;gap:5px;font-family:var(--f-en);white-space:nowrap;flex:none}
.mkt-r .v{color:var(--ink-2);font-weight:600}
.mkt-r .v.pol{color:var(--muted)}
.mkt-r .c{font-weight:700}
.mkt-r .c.up{color:#E0303F}.mkt-r .c.down{color:#2563EB}.mkt-r .c.flat{color:var(--faint)}
@media (prefers-reduced-motion:reduce){.mkt-marquee{overflow-x:auto}.mkt-track{animation:none}}
/* ── 하단 브랜드 배너(GLOBAL NETWORK) ─────────────────
   시안 5안(KB Cream)을 사이트 토큰으로 재배색:
   --gold-soft(#FEEAB8) 를 중심으로 brief 카드의 크림(#FFFDF8)에서 시작해
   살짝 짙은 골드로 끝난다. 글자·CTA 는 --navy, 골드 텍스트는 이 사이트가
   이미 쓰는 #B67611(count-pill·dstatus.on·tw-pres.in 과 동일 쌍). */
.gbn{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;align-items:center;min-height:clamp(76px,11.2cqi,102px);
  margin:10px 0 2px;padding:clamp(12px,1.9cqi,17px) var(--pad);
  border:1px solid #F2E3C6;border-radius:var(--r-lg);box-shadow:var(--shadow);

/* CTA: 크림 배경에 네이비 솔리드는 너무 무겁다는 피드백(2026-09-04) →
   흰 버튼 + 네이비 글자. 대비 14.5:1 로 접근성도 가장 좋다.
   (골드 솔리드안은 흰 글자 대비가 3:1 미만이라 채택하지 않음) */
.gbn-cta{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;

  font-size:clamp(11.5px,1.7cqi,14.5px);font-weight:700;transition:background .18s,border-color .18s}
.gbn-cta:hover{background:#FFFDF8;border-color:#E0C893}
@media (max-width:420px){
  .gbn-in{gap:10px}
  .gbn-l p{font-size:11px}
}

<script>
/* ══════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const nl2br = (s) => esc(s).replace(/\n/g, "<br/>");
const svg = (id, w, h, cls) =>
  `<svg ${cls ? `class="${cls}" ` : ""}width="${w}" height="${h}" aria-hidden="true"><use href="#${id}"/></svg>`;
const CAT_COLORS = { "FX":"#2563EB", "금리":"#E0303F", "규제":"#7C4DEC", "지정학":"#4B6478", "시장":"#209D47", "디지털":"#6A3FB5", "인사":"#8A6A2F" };
const tintCat = (c) => { const h = CAT_COLORS[c] || "#7A8699";
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return `rgba(${r},${g},${b},.12)`; };

/* 위경도 → 지도 % 좌표 */
function project(lat, lon){
  const cols = LAND[0].length, rows = LAND.length;
  const col = (lon - PROJ.lon0) / (PROJ.lon1 - PROJ.lon0) * cols;
  const row = (PROJ.lat0 - lat) / (PROJ.lat0 - PROJ.lat1) * rows;
  return {
    x: (col - CROP.c0) / (CROP.c1 - CROP.c0) * 100,
    y: (row - CROP.r0) / (CROP.r1 - CROP.r0) * 100
  };
}
function posOf(p){
  if (typeof p.x === "number" && typeof p.y === "number") return { x:p.x, y:p.y };
  return project(p.lat, p.lon);
}

/* 말풍선 자동 배치기
   data 의 anchor 는 "선호 방향", nudge 는 "미세 보정"으로만 쓰인다.
   후보 위치(8방향 × 간격 × 좌우 오프셋)를 점수화해
     · 다른 말풍선과 겹치지 않고
     · 다른 거점 마커를 덮지 않으며
     · 지도 밖으로 나가지 않는
   위치 중 선호 방향에 가장 가까운 곳을 고른다.
   → 거점을 추가·이동·삭제해도 배치가 깨지지 않는다. */
const DIR = { n:[0,-1], ne:[.72,-.72], e:[1,0], se:[.72,.72],
              s:[0,1],  sw:[-.72,.72], w:[-1,0], nw:[-.72,-.72] };
const DIR_ORDER = ["n","ne","e","se","s","sw","w","nw"];

function layoutCards(wrap){
  const box = wrap.getBoundingClientRect();
  const W = box.width, H = box.height;
  if (!W || !H) return;
  // 브라우저 zoom 등으로 rect(시각 px)와 CSS px 배율이 다를 수 있어 보정
  const k2css = wrap.clientWidth ? wrap.clientWidth / W : 1;

  const marks = [...wrap.querySelectorAll(".mk")].map((k) => {
    const r = k.getBoundingClientRect();
    return { id:k.dataset.id,
             x:r.left - box.left + r.width / 2,
             y:r.top  - box.top  + r.height / 2,
             r:Math.max(r.width, r.height) / 2 + 4 };
  });

  const cards = [...wrap.querySelectorAll(".pop")].map((el) => {
    const r = el.getBoundingClientRect();
    return { el, id:el.dataset.id, w:r.width, h:r.height,
             mx:parseFloat(el.dataset.mx) / 100 * W,
             my:parseFloat(el.dataset.my) / 100 * H,
             pref:el.dataset.anchor || "n",
             bias:[(+el.dataset.nx || 0) / (k2css || 1), (+el.dataset.ny || 0) / (k2css || 1)] };
  });   // POINTS 순서대로 배치 → 앞쪽 거점이 선호 방향을 먼저 차지

  const placed = [];
  for (const c of cards){
    const dirs = [c.pref, ...DIR_ORDER.filter((d) => d !== c.pref)];
    let best = null;

    dirs.forEach((dn, di) => {
      const d = DIR[dn];
      for (const gap of [16, 26, 40, 58, 80, 108, 140]){
        for (const lat of [0, -28, 28, -56, 56, -88, 88]){
          let cx = c.mx + d[0] * (gap + c.w / 2) + c.bias[0];
          let cy = c.my + d[1] * (gap + c.h / 2) + c.bias[1];
          if (Math.abs(d[1]) >= Math.abs(d[0])) cx += lat; else cy += lat;
          const x = cx - c.w / 2, y = cy - c.h / 2;

          let s = di * 16 + gap * .32 + Math.abs(lat) * .2;
          s += (Math.max(0, -x) + Math.max(0, -y) +
                Math.max(0, x + c.w - W) + Math.max(0, y + c.h - H)) * 45;
          for (const q of placed){
            const ox = Math.min(x + c.w, q.x + q.w) - Math.max(x, q.x) + 9;
            const oy = Math.min(y + c.h, q.y + q.h) - Math.max(y, q.y) + 9;
            if (ox > 0 && oy > 0) s += ox * oy * .35;
          }
          for (const k of marks){
            if (k.id === c.id) continue;
            if (k.x > x - k.r && k.x < x + c.w + k.r &&
                k.y > y - k.r && k.y < y + c.h + k.r) s += 300;
          }
          if (!best || s < best.s) best = { s, x, y, cx, cy };
        }
      }
    });

    placed.push({ x:best.x, y:best.y, w:c.w, h:c.h });
    c.el.classList.add("on");
    c.el.style.transform =
      `translate(-50%, -50%) translate(${((best.cx - c.mx) * k2css).toFixed(1)}px, ` +
      `${((best.cy - c.my) * k2css).toFixed(1)}px)`;
  }
}

/* ── 1. 도트 월드맵 ── */
function renderLand(){
  const rows = LAND.length, cols = LAND[0].length;
  const el = $("#map-dots");
  el.setAttribute("viewBox", `${CROP.c0} ${CROP.r0} ${CROP.c1 - CROP.c0} ${CROP.r1 - CROP.r0}`);
  $("#map-wrap").style.aspectRatio = `${CROP.c1 - CROP.c0} / ${CROP.r1 - CROP.r0}`;
  let out = "";
  for (let r = 0; r < LAND.length; r++){
    const row = LAND[r];
    for (let c = 0; c < row.length; c++){
      if (row[c] === "1") out += `<circle cx="${c + .5}" cy="${r + .5}" r=".33"/>`;
    }
  }
  el.innerHTML = out;
}

/* ── 2. 거점 마커 + 말풍선 + 범례 ── */
function renderPulse(){
  const wrap = $("#map-wrap");
  wrap.querySelectorAll(".mk, .pop").forEach((n) => n.remove());

  POINTS.forEach((p) => {
    const { x, y } = posOf(p);

    const mk = document.createElement("div");
    mk.className = "mk";
    mk.dataset.level = p.level;
    mk.dataset.id = p.id;
    mk.style.left = x + "%";
    mk.style.top  = y + "%";
    mk.title = p.name || p.code;
    mk.innerHTML = p.hq
      ? `<span class="mk-hq">${svg("kb-mark", "60%", "60%")}</span>`
      : `<span class="mk-dot"></span>`;
    wrap.appendChild(mk);

    if (!p.card) return;
    const nd = p.card.nudge || [0, 0];
    const badgeLv = p.badgeLv || (p.level === "hq" ? "positive" : p.level);

    const pop = document.createElement("div");
    pop.className = "pop";
    pop.dataset.level  = p.level;
    pop.dataset.id     = p.id;
    pop.dataset.mx     = x;
    pop.dataset.my     = y;
    pop.dataset.anchor = p.card.anchor || "n";
    pop.dataset.nx     = nd[0];
    pop.dataset.ny     = nd[1];
    pop.style.left = x + "%";
    pop.style.top  = y + "%";
    pop.style.transform = "translate(-50%, -50%)";
    pop.innerHTML =
      `<div class="pop-h"><span class="pop-code en">${esc(p.code)}</span>` +
      (p.badge ? `<span class="badge" data-level="${badgeLv}">${esc(p.badge)}</span>` : "") +
      `</div>` +
      (p.topic ? `<div class="pop-topic">${esc(p.topic)}</div>` : "");
    wrap.appendChild(pop);
  });

  let tally = ISSUE_TALLY;
  if (!tally){
    tally = { risk:0, watch:0, positive:0 };
    ISSUES.forEach((i) => { if (tally[i.level] !== undefined) tally[i.level]++; });
  }
  const LG = [
    { k:"risk",     label:"RISK",     color:"var(--risk)" },
    { k:"watch",    label:"WATCH",    color:"var(--watch)" },
    { k:"positive", label:"POSITIVE", color:"var(--positive)" }
  ];
  $("#legend-l").innerHTML = LG.map((g) =>
    `<span class="lg"><i style="background:${g.color}"></i>${g.label}<b>${tally[g.k]}</b></span>`
  ).join("");

  requestAnimationFrame(() => layoutCards(wrap));
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => layoutCards(wrap));
  }

}

function fmtMkt(v){ return Math.abs(v)>=1000 ? Math.round(v).toLocaleString() : (Math.round(v*100)/100).toString(); }
function mktRow(m){
  if(m.isPol) return `<div class="mkt-r"><span class="l">${esc(m.label)}</span><span class="rgt"><span class="v pol">${fmtMkt(m.value)}%</span></span></div>`;
  const p=m.pct, cls=Math.abs(p)<0.005?"flat":(p>0?"up":"down"), ar=p>0?"▲":(p<0?"▼":"·"), sg=p>0?"+":"";
  const val=m.value?`<span class="v">${fmtMkt(m.value)}</span>`:"";
  return `<div class="mkt-r"><span class="l">${esc(m.label)}</span><span class="rgt">${val}<span class="c ${cls}">${ar}${sg}${p}%</span></span></div>`;
}
function mktCard(c){
  const ms=[]; if(c.fx)ms.push(c.fx); if(c.idx)ms.push(c.idx);
  if(ms.length<2 && c.pol) ms.push(Object.assign({isPol:true}, c.pol));
  return `<div class="mkt">
    <div class="mkt-h">${svg("fl-"+c.cc.toLowerCase(),20,20,"mkt-fl")}<span class="nm">${esc(c.name)}</span><span class="cc en">${esc(c.cc)}</span></div>
    ${ms.slice(0,2).map(mktRow).join("")}
  </div>`;
}
function renderBrief(){
  const cards = MARKETS.map(mktCard).join("");
  $("#mkt-track").innerHTML = cards + cards;
}

/* ── 하단 브랜드 배너 아트: 점 세계지도 + 서울 기점 연결호 ──
   홈 상단 지도는 CROP 을 적용한 확대본이라, 여기서는 같은 LAND 를
   크롭 없이 전세계로 그린다(배너 오른쪽 절반에 배치). */
function renderBanner(){
  const el = document.querySelector(".gbn-art");
  if (!el) return;
  const X0 = 150, X1 = 398, Y0 = 22, Y1 = 88;   // 세로 중앙 밴드(가로로 긴 배너에서 잘림 방지)
  const ARC_TOP = 20;                          // 연결호 정점 상한
  const sx = (X1 - X0) / LAND[0].length, sy = (Y1 - Y0) / LAND.length;
  let dots = "";
  for (let r = 0; r < LAND.length; r++){
    for (let c = 0; c < LAND[r].length; c++){
      if (LAND[r][c] === "1" && (r + c) % 2 === 0)
        dots += `<circle cx="${(X0 + c*sx).toFixed(1)}" cy="${(Y0 + r*sy).toFixed(1)}" r=".9"/>`;
    }
  }
  const P = (lat, lon) => {
    const col = (lon - PROJ.lon0) / (PROJ.lon1 - PROJ.lon0) * LAND[0].length;
    const row = (PROJ.lat0 - lat) / (PROJ.lat0 - PROJ.lat1) * LAND.length;
    return [X0 + col * sx, Y0 + row * sy];
  };
  const HUBS = [[37.5,127],[1.35,103.8],[-6.2,106.8],[22.3,114.2],[51.5,-0.1],[40.7,-74],[19.1,72.9]];
  const a = P(37.5, 127);
  const arcs = HUBS.slice(1).map((h) => {
    const b = P(h[0], h[1]);
    const mx = (a[0] + b[0]) / 2;
    const my = Math.max(ARC_TOP, (a[1] + b[1]) / 2 - Math.abs(a[0] - b[0]) * .30 - 4);
    return `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}"/>`;
  }).join("");
  const nodes = HUBS.map((h) => {
    const q = P(h[0], h[1]);
    return `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4.6" fill="#B67611" opacity=".16"/>`
         + `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2" fill="#B67611"/>`;
  }).join("");
  el.innerHTML =
    `<g fill="#C99F4E" opacity=".42">${dots}</g>`
    + `<g fill="none" stroke="#B67611" stroke-width="1" opacity=".55" stroke-linecap="round">${arcs}</g>`
    + nodes;
}
