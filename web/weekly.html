<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>KB Global One Team — 주간 리포트</title>
<meta name="description" content="KB 글로벌 원팀 뉴스 — 국가별 주간 브리핑"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap"/>
<link rel="stylesheet" href="shared-tokens.css"/>
<!-- 데이터: export_json 이 아래 스크립트에 주입(오프라인). 없으면 weekly.json fetch. -->
<script id="weekly-data" type="application/json">null</script>
<style>
.pagettl{font-size:clamp(12.5px,1.9cqi,15px);color:var(--muted);margin:2px 2px 10px}
.wk-range{font-size:clamp(10.5px,1.6cqi,12.5px);color:var(--faint);font-family:var(--f-en);margin-left:auto}
.wk-stat{display:inline-block;font-family:var(--f-en);font-weight:700;font-size:clamp(11px,1.7cqi,13px);
         color:#B67611;background:var(--gold-soft);border-radius:8px;padding:5px 11px;margin-top:10px}
.wk-sum{font-size:clamp(12.5px,2cqi,15px);line-height:1.7;color:var(--ink-2);word-break:keep-all}
.wk-iss{margin:0;padding-left:18px}
.wk-iss li{font-size:clamp(12px,1.9cqi,14px);line-height:1.62;color:var(--ink-2);margin-bottom:6px;word-break:keep-all}
.wk-out{font-size:clamp(12px,1.9cqi,14px);line-height:1.65;color:var(--ink-2);background:#FFFCF5;
        border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:9px 12px;word-break:keep-all}
.wk-kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.wk-kw span{font-size:clamp(10.5px,1.6cqi,12.5px);color:var(--muted);background:#EEF1F6;border-radius:999px;padding:3px 11px}
</style>
</head>
<body>
<script src="shared-sprite.js"></script>
<div class="shell">
  <header class="hd">
    <div class="hd-brand">
      <div class="brandline">
        <svg class="kbmark" width="30" height="22" style="color:var(--gold-2)" aria-hidden="true"><use href="#kb-mark"/></svg>
        <span>KB FINANCIAL GROUP</span>
      </div>
      <h1 class="en">GLOBAL ONE TEAM</h1>
      <div class="hd-sub"><b data-en="Weekly Report">주간 리포트</b><i class="dot-live"></i></div>
    </div>
    <div class="hd-tools">
      <div class="langtoggle" role="group" aria-label="언어 선택">
        <button type="button" data-lang="ko" aria-pressed="true">KR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <p class="pagettl" data-en="Pick a flag to see that country's weekly briefing">국기를 선택해 국가별 주간 브리핑을 확인하세요</p>
  <div class="picker" id="picker"></div>
  <section class="card" id="detail" style="padding:14px 13px"></section>

  <nav class="botnav" id="botnav">
    <a href="brief.html" data-en="Home"><svg><use href="#ico-spark"/></svg><span data-en="Home">홈</span></a>
    <a href="countries.html" data-en="Presence"><svg><use href="#ico-grid"/></svg><span data-en="Presence">진출국</span></a>
    <a href="weekly.html" class="on" data-en="Weekly"><svg><use href="#ico-up"/></svg><span data-en="Weekly">주간 브리핑</span></a>
    <a href="topics.html" data-en="Monitoring"><svg><use href="#ico-chev-d"/></svg><span data-en="Monitoring">모니터링</span></a>
  </nav>
</div>

<script>
(async function(){
  const P = new URLSearchParams(location.search), QD = P.get('date'), EN = P.get('lang') === 'en';
  let D = null;
  if (QD) { try { D = await (await fetch('archive/' + QD + '/weekly.json')).json(); } catch(e){} }
  try { if (!D) D = JSON.parse(document.getElementById('weekly-data').textContent); } catch(e){}
  if (!D) { try { D = await (await fetch('weekly.json')).json(); } catch(e){} }

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const svg = (id, w, h, cls) => `<svg ${cls?`class="${cls}" `:''}width="${w}" height="${h}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const mdSlash = (s) => String(s || '').slice(5).replace('-', '/');
  const NAMES = EN
    ? {GB:'UK',US:'US',HK:'Hong Kong',CN:'China',JP:'Japan',SG:'Singapore',IN:'India',VN:'Vietnam',MM:'Myanmar',ID:'Indonesia',KH:'Cambodia',TH:'Thailand',LA:'Laos',GLOBAL:'Global'}
    : {GB:'영국',US:'미국',HK:'홍콩',CN:'중국',JP:'일본',SG:'싱가포르',IN:'인도',VN:'베트남',MM:'미얀마',ID:'인도네시아',KH:'캄보디아',TH:'태국',LA:'라오스',GLOBAL:'글로벌'};
  const ts = (c) => EN ? (c.summary_en || c.summary) : (c.summary || c.summary_en);
  const to = (c) => EN ? (c.outlook_en || c.outlook) : (c.outlook || c.outlook_en);
  const ti = (c) => { const a = EN ? (c.issues_en&&c.issues_en.length?c.issues_en:c.issues) : (c.issues&&c.issues.length?c.issues:c.issues_en); return a || []; };

  const cos = D ? (D.countries || []).filter(c => c.summary || c.summary_en) : [];
  if (!cos.length) {
    $('#picker').style.display = 'none';
    $('#detail').innerHTML = `<div class="empty-state">${EN
      ? 'No weekly reports yet. Run <code>python main.py brief</code> then <code>export</code>.'
      : '주간 브리핑이 아직 없습니다. 맥북에서 <code>python main.py brief</code>(주간) 실행 후 <code>python main.py export</code>.'}</div>`;
  } else {
    let fCC = cos[0].cc;
    function render(cc){
      const c = cos.find(x => x.cc === cc) || cos[0];
      fCC = c.cc;
      document.querySelectorAll('.pk').forEach(p => p.setAttribute('aria-selected', String(p.dataset.cc === fCC)));
      const range = (c.week_start && c.week_end) ? `${mdSlash(c.week_start)} ~ ${mdSlash(c.week_end)}` : '';
      const iss = ti(c), kw = c.keywords || [];
      $('#detail').innerHTML = `
        <div class="dhead">
          <span class="fbar" style="border-left-color:var(--gold)">${svg('flr-'+c.cc.toLowerCase(),40,40,'rflag')}</span>
          <div style="min-width:0;display:flex;align-items:baseline;gap:8px;flex:1">
            <div class="dname">${esc(EN?(NAMES[c.cc]||c.cc):(NAMES[c.cc]||c.cc))} <span class="cc">${esc(c.cc)}</span></div>
            <span class="wk-range">${esc(range)}</span>
          </div>
        </div>
        ${c.key_stat?`<div class="wk-stat">${esc(c.key_stat)}</div>`:''}
        <p class="wk-sum" style="margin-top:12px">${esc(ts(c))}</p>
        ${iss.length?`<div class="dsec-t"><span class="bar"></span>${EN?'Key Issues':'핵심 이슈'}</div>
          <ul class="wk-iss">${iss.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
        ${to(c)?`<div class="dsec-t"><span class="bar"></span>${EN?'Outlook':'전망'}</div>
          <div class="wk-out">${esc(to(c))}</div>`:''}
        ${kw.length?`<div class="wk-kw" style="margin-top:14px">${kw.map(k=>`<span>#${esc(k)}</span>`).join('')}</div>`:''}
      `;
    }
    $('#picker').innerHTML = cos.map((c,i) => `
      <button class="pk" data-cc="${c.cc}" aria-selected="${i===0}">
        ${svg('fl-'+c.cc.toLowerCase(),44,44)}<span>${esc(NAMES[c.cc]||c.cc)}</span>
      </button>`).join('');
    document.querySelectorAll('.pk').forEach(p => p.addEventListener('click', () => render(p.dataset.cc)));
    render(cos[0].cc);
  }

  // 언어 토글
  document.querySelectorAll('.langtoggle button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.lang === (EN ? 'en' : 'ko')));
    b.addEventListener('click', () => { P.set('lang', b.dataset.lang); location.search = P.toString(); });
  });
  if (EN) document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.getAttribute('data-en'); });

  document.querySelectorAll('.botnav a').forEach(a => {
    const [path, ownQuery] = a.getAttribute('href').split('?');
    const merged = new URLSearchParams(ownQuery || '');
    for (const [k,v] of P) if (k !== 'tab') merged.set(k, v);
    const qs = merged.toString();
    a.href = path + (qs ? '?' + qs : '');
  });
})();
</script>
</body>
</html>
