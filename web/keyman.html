<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KB 글로벌 데일리 브리핑 — Key-man 인사동향</title>
<script id="keyman-data" type="application/json">null</script>
<style>
  :root{--kb-yellow:#FFBC00;--kb-dark:#545045;--kb-gold:#85754E;--kb-silver:#8A8D8F;
        --ink:#2b2926;--line:#e8e4dd;--card:#fff;--sub:#7a746c;--page:#dcd8d2;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 0}
  .mast{position:relative;overflow:hidden;border-radius:14px;padding:20px 24px 22px;color:#fff;background:linear-gradient(135deg,#5c574f 0%,#4a453e 100%)}
  .mast .kbwm{position:absolute;right:-6px;top:-26px;font-size:132px;font-weight:900;color:rgba(255,255,255,.05);letter-spacing:-6px}
  .mast .row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
  .mast .kb{font-weight:800}.mast .kb b{color:var(--kb-yellow)}.mast .kb span{color:#d9d4cc;font-weight:600;margin-left:4px}
  .mast .rt{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#cfc9c0}
  .mast .en{border:1px solid rgba(255,188,0,.6);color:var(--kb-yellow);border-radius:20px;padding:2px 10px;font-weight:700}
  .mast .en .off{color:#a49c8f}
  .mast h1{position:relative;z-index:1;font-size:26px;font-weight:800;margin:14px 0 8px;line-height:1.2}
  .mast .sub{position:relative;z-index:1;font-size:12.5px;color:#cfc9c0}
  .nav{display:flex;gap:8px;margin:14px 0 0}
  .nav a{font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff}
  .nav a.on{background:var(--kb-dark);color:#fff;border-color:var(--kb-dark)}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
  .sec-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .num{flex:none;width:26px;height:26px;border-radius:7px;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;background:var(--kb-gold)}
  .sec-h .tt{font-size:15px;font-weight:800}.sec-h .ds{font-size:12px;color:var(--sub);margin-top:2px}
  .sec-h .rt{margin-left:auto;font-size:12px;color:var(--sub)}
  .badge{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:20px;color:#fff}
  .b-finance{background:#2b5f9e}.b-digital{background:#6a3fb5}.b-esg{background:#3a8a6a}.b-risk{background:#b23b3b}
  .feed{display:flex;flex-direction:column;gap:9px}
  .art{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fff}
  .art .top{font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px}
  .art .flag{font-size:15px}.art .score{margin-left:auto;font-weight:800;color:var(--kb-gold)}
  .art .t{font-size:15px;font-weight:700;line-height:1.35;margin:2px 0 6px}
  .art .q{color:#463f37;line-height:1.55}
  .art .k{margin-top:8px;background:#fffdf4;border:1px solid #f1e7c8;border-left:3px solid var(--kb-yellow);border-radius:6px;padding:7px 11px;font-size:13px;line-height:1.55}
  .art .k b{color:var(--kb-gold)}
  .empty{color:var(--sub);text-align:center;padding:30px;font-size:13px;line-height:1.6}
  footer{text-align:center;color:var(--kb-silver);font-size:11.5px;letter-spacing:.5px;padding:22px 0 34px}
  footer .tag{color:var(--kb-gold);font-weight:800;letter-spacing:1px}
  a{color:#2b5f9e;text-decoration:none}a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="kbwm">KB</div>
    <div class="row">
      <span class="kb"><b>KB</b><span>국민은행</span></span>
      <span class="rt"><span class="en">KR<span class="off"> / EN</span></span><span id="date"></span></span>
    </div>
    <h1>Key-man 인사동향</h1>
    <div class="sub">각국 중앙은행·감독당국·금융기관의 정책 결정자 인사·리더십 변화</div>
    <div class="nav"><a href="brief.html">Global Pulse</a><a href="countries.html">현지언론</a><a class="on" href="keyman.html">Key-man</a></div>
  </div>

  <section class="sec">
    <div class="sec-h"><div class="num">★</div>
      <div><div class="tt">인사·리더십 동향</div><div class="ds">임명·취임·사임 등 Key-man 이동 (뉴스 기반 추출)</div></div>
      <div class="rt" id="cnt"></div></div>
    <div class="feed" id="feed"></div>
  </section>

  <footer><div class="tag">CONNECTING PEOPLE, CREATING GLOBAL VALUE</div><div id="gen"></div></footer>
</div>

<script>
(async function(){
  let D=null;
  try{ D=JSON.parse(document.getElementById('keyman-data').textContent);}catch(e){}
  if(!D){ try{ D=await (await fetch('keyman.json')).json(); }catch(e){} }
  if(!D){ document.querySelector('.wrap').innerHTML='<p class="empty">keyman.json 이 없습니다. <code>python main.py export</code> 로 생성하세요.</p>'; return; }
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const NAMES={GB:'영국',US:'미국',HK:'홍콩',CN:'중국',JP:'일본',SG:'싱가포르',IN:'인도',VN:'베트남',MM:'미얀마',ID:'인도네시아',KH:'캄보디아'};
  const badges=cstr=>(cstr||'').split(/\s+/).filter(Boolean).map(k=>{const l={finance:'금융',digital:'디지털',esg:'ESG',risk:'리스크'}[k];return l?`<span class="badge b-${k}">${l}</span>`:'';}).join(' ');
  const gen=(D.generated_at||'').slice(0,16).replace('T',' ');
  document.getElementById('date').textContent=gen.slice(0,10);
  document.getElementById('gen').textContent='업데이트 '+gen;
  const arts=D.articles||[];
  document.getElementById('cnt').textContent=arts.length+' 건';
  const feed=document.getElementById('feed');
  if(!arts.length){feed.innerHTML='<div class="empty">아직 감지된 인사동향이 없습니다.<br>AI 랭킹이 더 진행되면 채워집니다. (뉴스 기반 키워드 추출)</div>';return;}
  feed.innerHTML=arts.map(a=>`<div class="art">
    <div class="top"><span class="flag">${a.flag||''}</span> <b>${NAMES[a.cc]||a.cc||''}</b> · ${esc(a.src)} · ${esc(a.d)} ${badges(a.c)}
      ${a.score!=null?`<span class="score">${a.score}</span>`:''}</div>
    <div class="t">${a.u?`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}</a>`:esc(a.t)}</div>
    ${a.q?`<div class="q">${esc(a.q)}</div>`:''}
    ${a.k?`<div class="k"><b>KB 시사점</b> ${esc(a.k)}</div>`:''}</div>`).join('');
})();
</script>
</body>
</html>
