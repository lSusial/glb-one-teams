<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KB 글로벌 데일리 브리핑 — Global Pulse</title>
<!-- 데이터: export_pulse 가 아래 스크립트에 주입(오프라인). 없으면 pulse.json fetch. -->
<script id="pulse-data" type="application/json">null</script>
<!-- 국가별 상황 지도용 — 경량 지도 라이브러리(CDN). 로드 실패 시 격자 폴백. -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  :root{
    --kb-yellow:#FFBC00; --kb-dark:#545045; --kb-gold:#85754E; --kb-silver:#8A8D8F;
    --ink:#2b2926; --line:#e8e4dd; --card:#fff; --sub:#7a746c; --page:#dcd8d2;
    --go:#188a54; --warn:#c98a1e; --stop:#cf3d3d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 0}
  .mast{position:relative;overflow:hidden;border-radius:14px;padding:20px 24px 22px;color:#fff;background:linear-gradient(135deg,#5c574f 0%,#4a453e 100%)}
  .mast .kbwm{position:absolute;right:-6px;top:-26px;font-size:132px;font-weight:900;color:rgba(255,255,255,.05);letter-spacing:-6px;pointer-events:none}
  .mast .row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
  .mast .kb{font-weight:800}.mast .kb b{color:var(--kb-yellow)}.mast .kb span{color:#d9d4cc;font-weight:600;margin-left:4px}
  .mast .rt{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#cfc9c0}
  .mast .en{border:1px solid rgba(255,188,0,.6);color:var(--kb-yellow);border-radius:20px;padding:2px 10px;font-weight:700}
  .mast .en .off{color:#a49c8f}
  .dsel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:2px 7px;font-size:12px;max-width:130px}
  .mast h1{position:relative;z-index:1;font-size:26px;font-weight:800;margin:14px 0 8px;line-height:1.2}
  .mast .sub{position:relative;z-index:1;font-size:12.5px;color:#cfc9c0}
  .nav{display:flex;gap:4px;margin:14px 0 0;overflow-x:auto}
  .nav a{font-size:12px;font-weight:700;color:var(--sub);text-decoration:none;padding:7px 0;border-radius:20px;border:1px solid var(--line);background:#fff;flex:1;text-align:center;white-space:nowrap}
  .nav a.on{background:var(--kb-dark);color:#fff;border-color:var(--kb-dark)}

  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
  .sec-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
  .num{flex:none;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;background:var(--kb-gold)}
  .sec-h .tt{font-size:15px;font-weight:800}.sec-h .ds{font-size:12px;color:var(--sub);margin-top:2px}
  .sec-h .rt{margin-left:auto;font-size:12px;color:var(--sub)}

  .hl .hlrow{padding:10px 0;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
  .hl .hlrow:first-child{border-top:0;padding-top:2px}
  .hl .hlrow:hover{background:#faf8f4}
  .hl .hlcat{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:20px;color:#fff;margin-right:6px;white-space:nowrap}
  .hl .hlhead{font-weight:700;font-size:13.5px;line-height:1.5}
  .hl .hlimp{color:#463f37;font-size:12.5px;line-height:1.5;margin-top:4px}
  .hl .hlflags{margin-top:4px;font-size:13px;letter-spacing:2px}

  /* 국가별 상황 — 지도(진출국 신호색 점) */
  .map-wrap{position:relative;width:100%;aspect-ratio:2/1;background:#d9e7f2;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .map-wrap svg{position:absolute;inset:0;width:100%;height:100%}
  .map-wrap svg line{stroke:#a7c2d6;stroke-width:1}
  .map-wrap svg path.land{fill:#eef1ea;stroke:#c3ceb9;stroke-width:.6}
  .mdot{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;
    border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.25);cursor:pointer;padding:0}
  .mdot.go{background:var(--go)}.mdot.warn{background:var(--warn)}.mdot.stop{background:var(--stop)}
  .mdot:hover,.mdot.active{width:18px;height:18px;z-index:5}
  .map-legend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--sub)}
  .map-legend span{display:inline-flex;align-items:center;gap:5px}
  .map-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .map-legend .go{background:var(--go)}.map-legend .warn{background:var(--warn)}.map-legend .stop{background:var(--stop)}
  .mpop{position:absolute;z-index:6;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);padding:10px 12px;min-width:180px;font-size:12px;display:none;pointer-events:none}
  .mpop.on{display:block}
  .mpop .ph{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;margin-bottom:4px}
  .mpop .ph .st{margin-left:auto;font-size:10px;font-weight:800}
  .mpop .ph .st.go{color:var(--go)}.mpop .ph .st.warn{color:var(--warn)}.mpop .ph .st.stop{color:var(--stop)}
  .mpop .ml{font-size:11px;font-variant-numeric:tabular-nums;color:#333;margin-bottom:3px}
  .mpop .ml .up{color:var(--go);font-weight:700}.mpop .ml .down{color:var(--stop);font-weight:700}.mpop .ml .fx{color:var(--sub)}
  .mpop .kw{font-size:11px;color:var(--sub);line-height:1.4}

  a{color:#2b5f9e;text-decoration:none}a:hover{text-decoration:underline}

  /* 오늘의 글로벌 핵심 상세 모달 */
  .ov{position:fixed;inset:0;background:rgba(20,18,15,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
  .ov.on{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px;position:relative}
  .modal .mx{position:absolute;top:14px;right:16px;cursor:pointer;color:#aaa;font-size:22px;line-height:1;border:none;background:none}
  .modal .mcat{font-size:10.5px;font-weight:800;color:#fff;border-radius:5px;padding:2px 8px}
  .modal h2{font-size:17px;margin:12px 0 8px;line-height:1.4}
  .modal .mimp{background:#fff8e6;border-left:3px solid var(--kb-yellow);padding:8px 12px;border-radius:0 8px 8px 0;font-size:12.5px;margin:10px 0 14px}
  .modal .mlb{font-size:11px;font-weight:800;color:var(--sub);margin:14px 0 6px}
  .modal .msum{font-size:13px;line-height:1.7;color:#2a2c32}
  .modal .mlk{display:block;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:7px;text-decoration:none;color:inherit}
  .modal .mlk .s{font-size:10.5px;color:var(--sub)}.modal .mlk .t{font-size:12.5px;font-weight:600;margin-top:1px;color:var(--ink)}
  .empty-note{color:var(--sub);font-size:12px}

  footer{text-align:center;color:var(--kb-silver);font-size:11.5px;letter-spacing:.5px;padding:22px 0 34px}
  footer .tag{color:var(--kb-gold);font-weight:800;letter-spacing:1px}

  @media(max-width:520px){
    .wrap{padding:12px 8px 0}
    .mast{padding:14px 14px 16px;border-radius:10px}
    .mast h1{font-size:21px;margin:10px 0 5px}
    .mast .kbwm{font-size:88px}
    .mast .sub{font-size:12px}
    .nav a{font-size:11px;padding:5px 0}
    .sec{padding:12px 11px;border-radius:10px;margin-top:10px}
    .sec-h{margin-bottom:10px}
    .modal{padding:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="kbwm">KB</div>
    <div class="row">
      <span class="kb"><b>KB</b><span>금융그룹</span></span>
      <span class="rt"><span class="en">KR<span class="off"> / EN</span></span><select id="dsel" class="dsel"></select></span>
    </div>
    <h1 data-en="Today's Global">글로벌 원팀 뉴스</h1>
    <div class="nav"><a class="on" href="brief.html" data-en="Today's Global">글로벌 원팀 뉴스</a><a href="countries.html" data-en="Country News">국가별 뉴스</a><a href="weekly.html" data-en="Weekly Report">주간 리포트</a><a href="topics.html" data-en="Monitoring">모니터링</a></div>
  </div>

  <section class="sec" id="secMap" style="display:none">
    <div class="sec-h"><div class="num">🗺️</div>
      <div><div class="tt" data-en="Hub Situation Map">국가별 상황</div></div>
      <div class="rt" id="asof"></div></div>
    <div class="map-wrap" id="mapWrap"><svg id="mapGrid" viewBox="0 0 1000 500" preserveAspectRatio="none"></svg><div class="mpop" id="mpop"></div></div>
    <div class="map-legend">
      <span><i class="go"></i><span data-en="Stable">안정</span></span>
      <span><i class="warn"></i><span data-en="Caution">주의</span></span>
      <span><i class="stop"></i><span data-en="Alert">경계</span></span>
    </div>
  </section>

  <section class="sec hl" id="secHl" style="display:none">
    <div class="sec-h"><div class="num" style="background:var(--kb-dark)">📌</div>
      <div><div class="tt" data-en="Today's Global Highlights">오늘의 글로벌 핵심</div></div></div>
    <div id="hlList"></div>
  </section>

  <footer><div class="tag">CONNECTING PEOPLE, CREATING GLOBAL VALUE</div><div id="gen"></div></footer>
</div>

<div class="ov" id="ov"><div class="modal" id="modalBody"></div></div>

<script>
(async function(){
  const P=new URLSearchParams(location.search), QD=P.get('date'), EN=P.get('lang')==='en';
  let D=null;
  if(QD){ try{ D=await (await fetch('archive/'+QD+'/pulse.json')).json(); }catch(e){} }
  try{ if(!D) D=JSON.parse(document.getElementById('pulse-data').textContent);}catch(e){}
  if(!D){ try{ D=await (await fetch('pulse.json')).json(); }catch(e){} }
  if(!D){ document.querySelector('.wrap').innerHTML='<p style="color:#7a746c;text-align:center;padding:40px">pulse.json 이 없습니다. <code>python main.py export</code> 로 생성하세요.</p>'; return; }
  const gen=(D.generated_at||'').slice(0,16).replace('T',' ');
  document.getElementById('asof').textContent=EN?('as of '+gen.slice(0,10)):(gen.slice(0,10)+' 기준');
  document.getElementById('gen').textContent=(EN?'Updated ':'업데이트 ')+gen;

  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const LANG=EN?'en':'ko';
  const tq=a=>EN?(a.q_en||a.q):(a.q||a.q_en);
  const tt=a=>a.t;
  const enEl=document.querySelector('.en');
  if(enEl){ enEl.style.cursor='pointer';
    enEl.innerHTML=LANG==='en'?'<span class="off">KR / </span>EN':'KR<span class="off"> / EN</span>';
    enEl.onclick=()=>{ P.set('lang',LANG==='en'?'ko':'en'); location.search=P.toString(); }; }
  document.querySelectorAll('.nav a').forEach(a=>{ a.href=a.getAttribute('href').split('?')[0]+location.search; });
  if(EN) document.querySelectorAll('[data-en]').forEach(el=>{ el.textContent=el.getAttribute('data-en'); });

  // 오늘의 글로벌 핵심(daily_highlights) — 없으면 블록 숨김
  const HLCAT={'금리':'#2b5f9e','FX':'#1f7a6c','규제':'#b23b3b','시장':'#2f7d4f','디지털':'#6a3fb5','지정학':'#7a5230'};
  const HLCATLBL=EN?{'금리':'Rates','FX':'FX','규제':'Regulation','시장':'Markets','디지털':'Digital','지정학':'Geopolitics'}:{};
  const HLFLAGS={GB:'🇬🇧',US:'🇺🇸',HK:'🇭🇰',CN:'🇨🇳',JP:'🇯🇵',SG:'🇸🇬',IN:'🇮🇳',VN:'🇻🇳',MM:'🇲🇲',ID:'🇮🇩',KH:'🇰🇭',KR:'🇰🇷',GLOBAL:'🌐'};
  const hlHead=h=>EN?(h.headline_en||h.headline_ko):(h.headline_ko||h.headline_en);
  const hlImp=h=>EN?(h.impact_en||h.impact_ko):(h.impact_ko||h.impact_en);
  const highlights=D.daily_highlights||[];

  // ── 국가별 상황(지도) — 진출국 11개, 온도·신호보드 대체 ─────────────
  const SGSTATE=EN?{go:'Stable',warn:'Caution',stop:'Alert'}:{go:'안정',warn:'주의',stop:'경계'};
  const fmtPct=v=>v==null?'-':Math.abs(v).toFixed(2)+'%';
  const fmtFx=v=>{
    if(v==null) return '-';
    const abs=Math.abs(v), d=abs>=100?0:2;
    return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  };
  const signals=D.country_signals||[];

  // 진출 11개국 KB 거점 도시 위경도(lat,lon)
  const HUB_COORDS={GB:[51.5,-0.1],US:[40.7,-74.0],JP:[35.7,139.7],HK:[22.3,114.2],SG:[1.35,103.8],
                     CN:[39.9,116.4],VN:[21.0,105.8],IN:[28.6,77.2],MM:[16.8,96.2],ID:[-6.2,106.8],KH:[11.5,104.9]};

  // 세계지도(대륙 윤곽) — D3-geo + world-atlas(CDN, 저해상도 110m) 렌더.
  // 로드 실패(오프라인·CDN 차단) 시 위경도 격자만 그리는 폴백 투영으로 대체.
  async function renderMapWorld(){
    const svg=document.getElementById('mapGrid');
    svg.innerHTML='<rect x="0" y="0" width="1000" height="500" style="fill:#d9e7f2"/>';
    const fallbackProjection=([lon,lat])=>[(lon+180)/360*1000,(90-lat)/180*500];
    if(typeof d3==='undefined' || typeof topojson==='undefined'){
      console.warn('[brief] d3/topojson 로드 실패 — 격자 폴백');
      drawGraticuleFallback(svg);
      return fallbackProjection;
    }
    try{
      const world=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
      const land=topojson.feature(world,world.objects.countries);
      const projection=d3.geoEquirectangular().fitSize([1000,500],land);
      const path=d3.geoPath(projection);
      d3.select(svg).append('g').selectAll('path').data(land.features).join('path')
        .attr('class','land').attr('d',path);
      return ([lon,lat])=>projection([lon,lat]);
    }catch(e){
      console.warn('[brief] world-atlas fetch 실패 — 격자 폴백:', e);
      drawGraticuleFallback(svg);
      return fallbackProjection;
    }
  }
  function drawGraticuleFallback(svg){
    const lines=[];
    for(let lon=-180;lon<=180;lon+=30){ const x=(lon+180)/360*1000; lines.push(`<line x1="${x}" y1="0" x2="${x}" y2="500"/>`); }
    for(let lat=-60;lat<=90;lat+=30){ const y=(90-lat)/180*500; lines.push(`<line x1="0" y1="${y}" x2="1000" y2="${y}"/>`); }
    svg.insertAdjacentHTML('beforeend', lines.join(''));
  }

  function mapPopoverHTML(s){
    const stLabel=SGSTATE[s.state]||'';
    const idxLine=(s.index&&s.index.length)?s.index.map(i=>{
      const cls=i.change_pct==null?'flat':(i.change_pct>0?'up':(i.change_pct<0?'down':'flat'));
      const arrow=i.change_pct==null?'':(i.change_pct>0?'▲':(i.change_pct<0?'▼':''));
      return `${esc(i.label)} <span class="${cls}">${arrow}${fmtPct(i.change_pct)}</span>`;
    }).join(' · '):(EN?'No index':'지수 없음');
    const fxLine=s.fx?`<span class="fx">${esc(s.fx.symbol)} ${fmtFx(s.fx.value)}${s.fx.note?` (${esc(s.fx.note)})`:''}</span>`:'';
    return `<div class="ph"><span>${s.flag||''}</span><span>${esc(EN?(s.name_en||s.name):(s.name||s.name_en))}</span><span class="st ${s.state}">${stLabel}</span></div>
      <div class="ml">${idxLine}${fxLine?' · '+fxLine:''}</div>
      <div class="kw">${esc(EN?(s.keyword_en||s.keyword):(s.keyword||s.keyword_en))}</div>`;
  }

  function renderMapDots(projection){
    const wrap=document.getElementById('mapWrap'), pop=document.getElementById('mpop');
    wrap.querySelectorAll('.mdot').forEach(el=>el.remove());
    let activeDot=null;
    function showPop(dot,s){
      pop.innerHTML=mapPopoverHTML(s); pop.classList.add('on');
      const left=parseFloat(dot.style.left), top=parseFloat(dot.style.top);
      pop.style.left=(left>70?left-20:left+3)+'%'; pop.style.top=(top>70?top-18:top+4)+'%';
    }
    function hidePop(){ pop.classList.remove('on'); if(activeDot) activeDot.classList.remove('active'); activeDot=null; }
    signals.forEach(s=>{
      const coord=HUB_COORDS[s.cc]; if(!coord) return;
      const [px,py]=projection([coord[1],coord[0]]);   // HUB_COORDS는 [lat,lon] → projection엔 [lon,lat]
      const dot=document.createElement('button');
      dot.className='mdot '+(s.state||'go');
      dot.style.left=(px/1000*100)+'%'; dot.style.top=(py/500*100)+'%';
      dot.title=EN?(s.name_en||s.name):(s.name||s.name_en);
      dot.addEventListener('mouseenter',()=>showPop(dot,s));
      dot.addEventListener('mouseleave',()=>{ if(activeDot!==dot) hidePop(); });
      dot.addEventListener('click',e=>{
        e.stopPropagation();
        if(activeDot===dot){ hidePop(); return; }
        if(activeDot) activeDot.classList.remove('active');
        activeDot=dot; dot.classList.add('active'); showPop(dot,s);
      });
      wrap.appendChild(dot);
    });
    document.addEventListener('click',hidePop);
  }
  if(signals.length){
    document.getElementById('secMap').style.display='';
    renderMapWorld().then(projection=>renderMapDots(projection));
  }

  // ── 오늘의 글로벌 핵심 = 핵심 카드(클릭→모달) + 국가별 이슈 한 줄 ────
  function relatedFor(h){
    const codes=h.country_codes||[];
    return (D.top_news||[]).filter(n=>codes.includes(n.cc)).slice(0,4);
  }
  window.openHlModal=function(i){
    const h=highlights[i]; if(!h) return;
    const rel=h._rel||relatedFor(h);
    const links=rel.map(r=>`<a class="mlk" href="${esc(r.u)}" target="_blank" rel="noopener"><div class="s">${esc(r.src)}</div><div class="t">${esc(tt(r))}</div></a>`).join('');
    const sum=rel.map(r=>tq(r)).filter(Boolean).join(' ');
    document.getElementById('modalBody').innerHTML=`<button class="mx" onclick="closeHlModal()">×</button>
      <span class="mcat" style="background:${HLCAT[h.category]||'#7a746c'}">${esc(HLCATLBL[h.category]||h.category||'')}</span>
      <h2>${esc(hlHead(h))}</h2>
      <div class="mimp">💡 ${EN?'KB Implication':'KB 시사점'} · ${esc(hlImp(h))}</div>
      <div class="mlb">${EN?'Summary (3+ outlets synthesized)':'요약 (3개+ 언론사 종합)'}</div>
      <div class="msum">${sum?esc(sum):`<span class="empty-note">${EN?'(No related articles collected yet.)':'(관련 기사가 아직 수집되지 않아 요약을 만들 수 없습니다.)'}</span>`}</div>
      <div class="mlb">${EN?'Related Articles':'관련 기사 링크'}</div>${links||`<div class="empty-note">${EN?'No related articles.':'관련 기사가 없습니다.'}</div>`}`;
    document.getElementById('ov').classList.add('on');
  };
  window.closeHlModal=function(){ document.getElementById('ov').classList.remove('on'); };
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeHlModal(); });

  const hlRows=highlights.map((h,i)=>`
    <div class="hlrow" onclick="openHlModal(${i})">
      <span class="hlcat" style="background:${HLCAT[h.category]||'#7a746c'}">${esc(HLCATLBL[h.category]||h.category||'')}</span>
      <span class="hlhead">${esc(hlHead(h))}</span>
      ${hlImp(h)?`<div class="hlimp">${esc(hlImp(h))}</div>`:''}
      <div class="hlflags">${(h.country_codes||[]).map(cc=>HLFLAGS[cc]||'').join(' ')}</div>
    </div>`);
  if(hlRows.length){
    document.getElementById('secHl').style.display='';
    document.getElementById('hlList').innerHTML=hlRows.join('');
  }

  try{
    const dates=await (await fetch('archive/dates.json')).json();
    const sel=document.getElementById('dsel');
    if(sel&&dates.length){
      sel.innerHTML='<option value="">최신</option>'+dates.map(d=>`<option value="${d}"${d===QD?' selected':''}>${d}</option>`).join('');
      sel.onchange=()=>{ location.search = sel.value?('?date='+sel.value):''; };
    } else if(sel){ sel.style.display='none'; }
  }catch(e){ const s=document.getElementById('dsel'); if(s) s.style.display='none'; }
})();
</script>
</body>
</html>
