<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KB 글로벌 데일리 브리핑 — Global Pulse</title>
<!-- 데이터: export_pulse 가 아래 스크립트에 주입(오프라인). 없으면 pulse.json fetch. -->
<script id="pulse-data" type="application/json">null</script>
<style>
  :root{
    --kb-yellow:#FFBC00; --kb-dark:#545045; --kb-gold:#85754E; --kb-silver:#8A8D8F;
    --ink:#2b2926; --line:#e8e4dd; --card:#fff; --sub:#7a746c; --page:#dcd8d2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 0}
  .mast{position:relative;overflow:hidden;border-radius:14px;padding:20px 24px 22px;color:#fff;background:linear-gradient(135deg,#5c574f 0%,#4a453e 100%)}
  .mast .kbwm{position:absolute;right:-6px;top:-26px;font-size:132px;font-weight:900;color:rgba(255,255,255,.05);letter-spacing:-6px;pointer-events:none}
  .mast .row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
  .mast .kb{font-weight:800}.mast .kb b{color:var(--kb-yellow)}.mast .kb span{color:#d9d4cc;font-weight:600;margin-left:4px}
  .mast .rt{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#cfc9c0}
  .mast .en{border:1px solid rgba(255,188,0,.6);color:var(--kb-yellow);border-radius:20px;padding:2px 10px;font-weight:700}
  .mast .en .off{color:#a49c8f}
  .dsel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:2px 7px;font-size:12px;max-width:130px}
  .mast h1{position:relative;z-index:1;font-size:26px;font-weight:800;margin:14px 0 8px;line-height:1.2}
  .mast .sub{position:relative;z-index:1;font-size:12.5px;color:#cfc9c0}
  .nav{display:flex;gap:4px;margin:14px 0 0;overflow-x:auto}
  .nav a{font-size:12px;font-weight:700;color:var(--sub);text-decoration:none;padding:7px 0;border-radius:20px;border:1px solid var(--line);background:#fff;flex:1;text-align:center;white-space:nowrap}
  .nav a.on{background:var(--kb-dark);color:#fff;border-color:var(--kb-dark)}

  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
  .sec-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
  .num{flex:none;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;background:var(--kb-gold)}
  .sec-h .tt{font-size:15px;font-weight:800}.sec-h .ds{font-size:12px;color:var(--sub);margin-top:2px}
  .sec-h .rt{margin-left:auto;font-size:12px;color:var(--sub)}

  .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:0 62px 0 74px;margin-bottom:3px}
  .scale .mid{color:var(--kb-silver)}
  .temp{display:flex;align-items:center;gap:10px;margin:5px 0}
  .temp .lb{width:64px;font-weight:700;font-size:13px;flex:none}
  .temp .track{flex:1;height:13px;background:#eee9e2;border-radius:8px;overflow:hidden}
  .temp .fill{display:block;height:100%;min-width:2px;border-radius:8px;transition:width .5s}
  .temp .val{width:48px;text-align:right;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
  .cap{font-size:11.5px;color:var(--sub);margin-top:8px}
  .cap .n{color:var(--kb-silver)}
  .badge{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:20px;color:#fff}
  .b-economy{background:#2b5f9e}.b-finance{background:#2f7d4f}.b-digital{background:#6a3fb5}.b-esg{background:#3a8a6a}.b-risk{background:#b23b3b}.b-geo{background:#7a5230}
  .flow{padding:11px 0;border-top:1px solid var(--line)}
  .flow:first-child{border-top:0;padding-top:2px}
  .flow .ft{font-weight:700;font-size:13.5px;line-height:1.6}
  .flow .ft .fg{font-size:14px}
  .flow .ft .badge{vertical-align:middle;margin-right:3px}
  .flow .fs{color:#463f37;font-size:12.5px;line-height:1.5;margin-top:3px}
  .hl .hlrow{padding:10px 0;border-top:1px solid var(--line)}
  .hl .hlrow:first-child{border-top:0;padding-top:2px}
  .hl .hlcat{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:20px;color:#fff;margin-right:6px;white-space:nowrap}
  .hl .hlhead{font-weight:700;font-size:13.5px;line-height:1.5}
  .hl .hlimp{color:#463f37;font-size:12.5px;line-height:1.5;margin-top:4px}
  .hl .hlflags{margin-top:4px;font-size:13px;letter-spacing:2px}
  .news{display:flex;flex-direction:column;gap:9px}
  .nc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
  .nc .nt{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:5px}
  .nc .nt .fg{font-size:14px}
  .nc .nt .nd{font-size:11px;color:var(--sub);margin-left:auto}
  .nc h4{font-size:14px;font-weight:700;margin:0 0 5px;line-height:1.35;color:var(--ink)}
  .nc .nq{color:#463f37;line-height:1.5;font-size:13px}
  .rl{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
  .rl .rh{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:1px}
  .rl a{font-size:12px;color:#2b5f9e;font-weight:500}
  a{color:#2b5f9e;text-decoration:none}a:hover{text-decoration:underline}

  footer{text-align:center;color:var(--kb-silver);font-size:11.5px;letter-spacing:.5px;padding:22px 0 34px}
  footer .tag{color:var(--kb-gold);font-weight:800;letter-spacing:1px}

  @media(max-width:520px){
    .wrap{padding:12px 8px 0}
    .mast{padding:14px 14px 16px;border-radius:10px}
    .mast h1{font-size:21px;margin:10px 0 5px}
    .mast .kbwm{font-size:88px}
    .mast .sub{font-size:12px}
    .nav a{font-size:11px;padding:5px 0}
    .sec{padding:12px 11px;border-radius:10px;margin-top:10px}
    .art{padding:10px 11px}
    .nc{padding:10px 11px}
    .sec-h{margin-bottom:10px}
    .modal{padding:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="kbwm">KB</div>
    <div class="row">
      <span class="kb"><b>KB</b><span>국민은행</span></span>
      <span class="rt"><span class="en">KR<span class="off"> / EN</span></span><select id="dsel" class="dsel"></select></span>
    </div>
    <h1 data-en="Today's Global">오늘의 글로벌</h1>
    <div class="nav"><a class="on" href="brief.html" data-en="Today's Global">오늘의 글로벌</a><a href="countries.html" data-en="Country News">국가별 뉴스</a><a href="weekly.html" data-en="Weekly Report">주간 리포트</a><a href="topics.html" data-en="Issue Tracker">이슈 트래커</a></div>
  </div>

  <section class="sec">
    <div class="sec-h"><div class="num">🌡️</div>
      <div><div class="tt" data-en="Today's Global Temperature">오늘의 글로벌 온도</div></div>
      <div class="rt" id="asof"></div></div>
    <div class="scale"><span>0°C</span><span class="mid" data-en="Issue attention">이슈 주목도</span><span>100°C</span></div>
    <div id="bars"></div>
    <div class="cap"><span data-en="Bar length = attention, color = news area.">막대 길이는 이슈 주목도를, 색상은 뉴스 영역을 나타냅니다.</span> <span class="n" id="method"></span></div>
  </section>

  <section class="sec hl" id="secHl" style="display:none">
    <div class="sec-h"><div class="num" style="background:var(--kb-dark)">📌</div>
      <div><div class="tt" data-en="Today's Global Highlights">오늘의 글로벌 핵심</div></div>
      <div class="rt" id="hlDate"></div></div>
    <div id="hlList"></div>
  </section>

  <section class="sec accent">
    <div class="sec-h"><div class="num" style="background:var(--kb-yellow);color:var(--kb-dark)">📰</div>
      <div><div class="tt" data-en="Today's Key News">오늘의 핵심 뉴스</div></div></div>
    <div class="news" id="news"></div>
  </section>

  <footer><div class="tag">CONNECTING PEOPLE, CREATING GLOBAL VALUE</div><div id="gen"></div></footer>
</div>

<script>
(async function(){
  const P=new URLSearchParams(location.search), QD=P.get('date'), EN=P.get('lang')==='en';
  let D=null;
  if(QD){ try{ D=await (await fetch('archive/'+QD+'/pulse.json')).json(); }catch(e){} }
  try{ if(!D) D=JSON.parse(document.getElementById('pulse-data').textContent);}catch(e){}
  if(!D){ try{ D=await (await fetch('pulse.json')).json(); }catch(e){} }
  if(!D){ document.querySelector('.wrap').innerHTML='<p style="color:#7a746c;text-align:center;padding:40px">pulse.json 이 없습니다. <code>python main.py export</code> 로 생성하세요.</p>'; return; }
  const gen=(D.generated_at||'').slice(0,16).replace('T',' ');
  document.getElementById('asof').textContent=EN?('as of '+gen.slice(0,10)):(gen.slice(0,10)+' 기준');
  document.getElementById('gen').textContent=(EN?'Updated ':'업데이트 ')+gen;
  document.getElementById('method').textContent=(D.days?(EN?`Last ${D.days}d · `:`최근 ${D.days}일 · `):'')+(EN?'Temp = importance × frequency':'온도=중요도·빈도 종합');
  document.getElementById('bars').innerHTML=(D.categories||[]).map(c=>`
    <div class="temp">
      <span class="lb">${EN?(c.label_en||c.label):c.label}</span>
      <span class="track"><span class="fill" style="width:${c.temp}%;background:${c.color}"></span></span>
      <span class="val" style="color:${c.color}">${c.temp}°C</span>
    </div>`).join('');

  const NAMES=EN?{GB:'UK',US:'US',HK:'Hong Kong',CN:'China',JP:'Japan',SG:'Singapore',IN:'India',VN:'Vietnam',MM:'Myanmar',ID:'Indonesia',KH:'Cambodia',GLOBAL:'Global'}
               :{GB:'영국',US:'미국',HK:'홍콩',CN:'중국',JP:'일본',SG:'싱가포르',IN:'인도',VN:'베트남',MM:'미얀마',ID:'인도네시아',KH:'캄보디아',GLOBAL:'글로벌'};
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md=s=>String(s||'').slice(5);   // 연도 제거(MM-DD)
  const BL=EN?{economy:'Economy',finance:'Banking',digital:'Digital',esg:'ESG',risk:'Risk',geo:'Geopolitics'}:{economy:'경제',finance:'금융',digital:'디지털',esg:'ESG',risk:'리스크',geo:'지정학'};
  const badges=cstr=>(cstr||'').split(/\s+/).filter(Boolean).map(k=>{const l=BL[k];return l?`<span class="badge b-${k}">${l}</span>`:'';}).join(' ');
  const LANG=EN?'en':'ko';
  const tq=a=>EN?(a.q_en||a.q):(a.q||a.q_en), tk=a=>EN?(a.k_en||a.k):(a.k||a.k_en);
  const tt=a=>a.t;
  const tf=f=>EN?(f.summary_en||f.summary):(f.summary||f.summary_en);
  const enEl=document.querySelector('.en');
  if(enEl){ enEl.style.cursor='pointer';
    enEl.innerHTML=LANG==='en'?'<span class="off">KR / </span>EN':'KR<span class="off"> / EN</span>';
    enEl.onclick=()=>{ P.set('lang',LANG==='en'?'ko':'en'); location.search=P.toString(); }; }
  document.querySelectorAll('.nav a').forEach(a=>{ a.href=a.getAttribute('href').split('?')[0]+location.search; });
  if(EN) document.querySelectorAll('[data-en]').forEach(el=>{ el.textContent=el.getAttribute('data-en'); });

  // 오늘의 글로벌 핵심 3줄 (daily_highlights) — 없으면 블록 숨김
  const HLCAT={'금리':'#2b5f9e','FX':'#1f7a6c','규제':'#b23b3b','시장':'#2f7d4f','디지털':'#6a3fb5','지정학':'#7a5230'};
  const HLCATLBL=EN?{'금리':'Rates','FX':'FX','규제':'Regulation','시장':'Markets','디지털':'Digital','지정학':'Geopolitics'}:{};
  const HLFLAGS={GB:'🇬🇧',US:'🇺🇸',HK:'🇭🇰',CN:'🇨🇳',JP:'🇯🇵',SG:'🇸🇬',IN:'🇮🇳',VN:'🇻🇳',MM:'🇲🇲',ID:'🇮🇩',KH:'🇰🇭',KR:'🇰🇷',GLOBAL:'🌐'};
  const hlHead=h=>EN?(h.headline_en||h.headline_ko):(h.headline_ko||h.headline_en);
  const hlImp=h=>EN?(h.impact_en||h.impact_ko):(h.impact_ko||h.impact_en);
  const highlights=D.daily_highlights||[];
  if(highlights.length){
    document.getElementById('secHl').style.display='';
    document.getElementById('hlDate').textContent=gen.slice(0,10);
    document.getElementById('hlList').innerHTML=highlights.map(h=>`
      <div class="hlrow">
        <span class="hlcat" style="background:${HLCAT[h.category]||'#7a746c'}">${esc(HLCATLBL[h.category]||h.category||'')}</span>
        <span class="hlhead">${esc(hlHead(h))}</span>
        ${hlImp(h)?`<div class="hlimp">${esc(hlImp(h))}</div>`:''}
        <div class="hlflags">${(h.country_codes||[]).map(cc=>HLFLAGS[cc]||'').join(' ')}</div>
      </div>`).join('');
  }

  document.getElementById('news').innerHTML=(D.top_news||[]).map(a=>`
    <div class="nc"><div class="nt"><span class="fg">${a.flag||''}</span>${badges(a.c)}<span class="nd">${esc(md(a.d))}</span></div>
      <h4>${a.u?`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(tt(a))}</a>`:esc(tt(a))}</h4>
      ${tq(a)?`<div class="nq">${esc(tq(a))}</div>`:''}
      ${(a.rl||[]).length?`<div class="rl"><span class="rh">${EN?'Sources':'관련 기사'}</span>${(a.rl||[]).map(r=>`<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)} ↗</a>`).join('')}</div>`:''}
      </div>`).join('')
    || `<div style="color:var(--sub);font-size:13px">${EN?'No data':'데이터 없음'}</div>`;

  try{
    const dates=await (await fetch('archive/dates.json')).json();
    const sel=document.getElementById('dsel');
    if(sel&&dates.length){
      sel.innerHTML='<option value="">최신</option>'+dates.map(d=>`<option value="${d}"${d===QD?' selected':''}>${d}</option>`).join('');
      sel.onchange=()=>{ location.search = sel.value?('?date='+sel.value):''; };
    } else if(sel){ sel.style.display='none'; }
  }catch(e){ const s=document.getElementById('dsel'); if(s) s.style.display='none'; }
})();
</script>
</body>
</html>
