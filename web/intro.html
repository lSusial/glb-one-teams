<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KB Global One Team</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .btn{position:fixed;z-index:10;cursor:pointer;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
       color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);
       border-radius:999px;padding:9px 16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:.15s}
  .btn:hover,.btn:focus-visible{background:rgba(0,0,0,.72);border-color:#F1A33A;color:#F1A33A;outline:none}
  #skip{top:18px;right:18px}
  #sound{bottom:18px;right:18px}
  .nojs{position:fixed;inset:0;display:grid;place-items:center;font-family:sans-serif}
</style>
</head>
<body>
  <video id="v" autoplay muted playsinline preload="auto">
    <source src="intro.mp4" type="video/mp4">
  </video>
  <button class="btn" id="skip" type="button" aria-label="인트로 건너뛰기">SKIP ›</button>
  <button class="btn" id="sound" type="button">🔊 소리 켜기</button>
  <noscript><div class="nojs"><a href="brief.html" style="color:#F1A33A">KB 글로벌 브리프 열기 ›</a></div></noscript>
  <script>
    var TARGET = 'brief.html' + (location.search || '');
    var done = false;
    function go(){ if (done) return; done = true; location.replace(TARGET); }
    var v = document.getElementById('v');
    document.getElementById('skip').addEventListener('click', go);
    v.addEventListener('ended', go);
    v.addEventListener('error', go);
    // 안전장치: ended 미발화·재생 불가 대비 (영상 10초 + 여유)
    setTimeout(go, 13000);
    // 소리 토글 — 사용자 제스처로 unmute(자동재생 정책 대응)
    var s = document.getElementById('sound');
    s.addEventListener('click', function (e) {
      e.stopPropagation();
      v.muted = !v.muted;
      if (!v.muted) { v.play().catch(function(){}); }
      s.textContent = v.muted ? '🔊 소리 켜기' : '🔈 소리 끄기';
    });
    // 자동재생 시도(무음)
    var pr = v.play && v.play();
    if (pr && pr.catch) { pr.catch(function(){}); }
  </script>
</body>
</html>
