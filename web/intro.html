<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061426">
  <meta name="description" content="KB Global Daily Brief — One Pulse Intro">
  <title>KB Global One Team — One Pulse</title>
  <style>
    :root {
      /* ── 팔레트 ───────────────────────────────────────── */
      --navy-950: #020812;
      --navy-900: #061426;
      --gold: #ffb900;
      --gold-soft: #ffd36c;
      --gold-pale: #ffe19a;
      --ice: #eef5ff;
      --text-1: #dce8f5;
      --text-2: #a9bdd2;
      --land: #1c3a58;          /* 지도는 배경 텍스처 — 핀·연결선과 경쟁하지 않게 낮춘다 */
      --land-edge: rgba(255, 255, 255, .22);
      --ease: cubic-bezier(.22,.84,.2,1);

      /* ── 타임라인 (총 12.5초) ─────────────────────────── */
      --t-topbar: .15s;
      --t-grat: .40s;
      --t-land: .70s;
      --t-seoul: 1.15s;
      --t-kb: 1.60s;
      --t-s1: 3.30s;   /* 1단계 — 홍콩 · 호치민 */
      --t-s2: 6.00s;   /* 2단계 — 뉴델리 · 런던 */
      --t-badge: 7.80s;
      --t-head: 8.15s;
      --t-sub: 8.50s;
      --t-eyebrow: 8.80s;
      --t-wipe: 9.70s;
      --t-wipetxt: 10.05s;
      --total: 10.5s;

      --dur-draw: 1.3s;
      --dur-draw-long: 1.5s;
      --pair-lag: .12s;         /* 짝을 이루는 두 선을 살짝 어긋나게 출발시킨다 */

      --map-bottom: 41%;        /* 지도가 차지하는 아래 여백 — 캡션 위치도 이 값을 쓴다 */
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--navy-950);
      color: white;
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", Inter, system-ui, sans-serif;
    }

    body { -webkit-font-smoothing: antialiased; }

    button, a { font: inherit; }

    .intro {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 30%, rgba(28, 83, 126, .26), transparent 34%),
        radial-gradient(circle at 82% 14%, rgba(255, 185, 0, .07), transparent 22%),
        linear-gradient(142deg, var(--navy-950), var(--navy-900) 52%, #071a2e);
    }

    /* ── 배경 입자 ──────────────────────────────────────── */
    .ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .speck {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(190, 215, 240, .6);
      animation: drift var(--dur) ease-in-out var(--delay) infinite alternate;
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0); opacity: .14; }
      to { transform: translate3d(var(--dx), var(--dy), 0); opacity: .66; }
    }

    /* ── 상단 바 ────────────────────────────────────────── */
    .topbar {
      position: absolute;
      z-index: 20;
      top: max(24px, env(safe-area-inset-top));
      left: clamp(24px, 5vw, 80px);
      right: clamp(24px, 5vw, 80px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      animation: fade-in .6s var(--ease) var(--t-topbar) forwards;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ice);
      font-size: .84rem;
      font-weight: 700;
      letter-spacing: .095em;
    }

    .brand-mark {
      width: 34px;
      height: 25px;
      display: block;
      color: var(--gold);
      filter: drop-shadow(0 0 9px rgba(255, 185, 0, .24));
    }

    .skip {
      min-width: 72px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(210, 227, 245, .2);
      border-radius: 999px;
      background: rgba(10, 32, 57, .36);
      color: var(--text-1);
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .12em;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: border-color .2s ease, background .2s ease, color .2s ease;
    }

    .skip:hover,
    .skip:focus-visible {
      color: white;
      border-color: rgba(255, 185, 0, .6);
      background: rgba(255, 185, 0, .12);
      outline: none;
    }

    /* ── 지도 무대 ──────────────────────────────────────── */
    .mapwrap {
      position: absolute;
      z-index: 5;
      inset: 72px 0 var(--map-bottom) 0;
      overflow: hidden;
    }

    .worldmap {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 카메라는 끝까지 물러나지 않는다. 지구의 일부만 계속 보이게 두고
       단계가 넘어갈 때마다 조금씩만 넓혀 새 거점을 프레임 안으로 들인다.
       배경 레이어(.cam-bg)와 전경 레이어(.cam-fg)가 같은 키프레임을 공유한다. */
    /* 세 프레임 사이를 옮겨 다닌다. 값은 최종 viewBox(205 60 395 230)를 각
       프레임에 맞추는 translate+scale 이고, 세 프레임 모두 가로세로비가 같다.
         F0  서울 · 동아시아   491.6 99.8 116.8 68    (3.38배)
         F1  + 홍콩 · 호치민   393.9 95.5 266.2 155   (1.48배)
         F2  + 뉴델리 · 런던   205 60 395 230         (1배 · 최종)          */
    .cam-bg, .cam-fg {
      transform-box: view-box;
      transform-origin: 0 0;
      transform: translate(-1457.5px, -277.5px) scale(3.3818);
      animation: cam var(--total) var(--ease) forwards;
    }

    @keyframes cam {
      0%, 24.8% { transform: translate(-1457.5px, -277.5px) scale(3.3818); }
      39%, 50.5% { transform: translate(-379.4px, -81.7px) scale(1.4838); }
      65.7%, 100% { transform: translate(0px, 0px) scale(1); }
    }

    .land {
      fill: var(--land);
      stroke: var(--land-edge);
      stroke-width: .5;
    }

    .grat {
      fill: none;
      stroke: rgba(255, 255, 255, .05);
      stroke-width: .5;
    }

    .sphere-line {
      fill: none;
      stroke: rgba(255, 255, 255, .1);
      stroke-width: 1;
    }

    .layer-grat {
      opacity: 0;
      animation: fade-in 1.05s ease var(--t-grat) forwards;
    }

    .layer-land {
      opacity: 0;
      animation: fade-in 1.25s var(--ease) var(--t-land) forwards;
    }

    /* ── 연결선 ─────────────────────────────────────────── */
    /* 노선 하나는 <g class="route"> 이고 --delay / --dur / --len 을 받는다.
       glow(넓은 잔광) · draw(뻗어나가는 실선) · final(정착 점선) · comet(선 끝
       혜성) 네 겹으로 쌓아 지도 위에서 확실히 떠 보이게 한다. */
    .route { --settle: calc(var(--delay) + var(--dur) - .2s); }

    .conn-glow,
    .conn-draw,
    .conn-final,
    .conn-comet {
      fill: none;
      stroke-linecap: round;
    }

    .conn-glow {
      stroke: var(--gold);
      stroke-width: 5;
      opacity: 0;
      animation: glow-in .6s ease var(--settle) forwards;
    }

    @keyframes glow-in { to { opacity: .16; } }

    .conn-draw {
      stroke: var(--gold-soft);
      stroke-width: 2;
      stroke-dasharray: var(--len, 1200);
      stroke-dashoffset: var(--len, 1200);
      opacity: 0;
      animation:
        conn-draw var(--dur) var(--ease) var(--delay) forwards,
        conn-hide .45s ease var(--settle) forwards;
    }

    @keyframes conn-draw {
      from { opacity: 1; stroke-dashoffset: var(--len, 1200); }
      to { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes conn-hide { to { opacity: 0; } }

    .conn-final {
      stroke: var(--gold);
      stroke-width: 1.7;
      stroke-dasharray: 5 3;
      opacity: 0;
      animation:
        conn-settle .5s ease var(--settle) forwards,
        march 2.2s linear var(--settle) infinite;
    }

    @keyframes conn-settle { to { opacity: .82; } }
    @keyframes march { to { stroke-dashoffset: -16; } }

    /* 선 끝을 달리는 혜성 — 점 하나보다 방향과 속도가 훨씬 잘 읽힌다 */
    .conn-comet {
      stroke: #fff6dc;
      stroke-width: 2.4;
      stroke-dasharray: 20 9999;
      stroke-dashoffset: 20;
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(255, 211, 108, .95));
      animation:
        comet var(--dur) var(--ease) var(--delay) forwards,
        comet-fade var(--dur) linear var(--delay) forwards;
    }

    @keyframes comet { to { stroke-dashoffset: var(--comet-end, -1200); } }

    @keyframes comet-fade {
      0% { opacity: 0; }
      8%, 88% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ── 거점 핀 ────────────────────────────────────────── */
    /* 카메라 역보정 — 도입부 확대 때 핀이 나라를 덮지 않게 한다.
       .arrive/.sonar 와 .pin-mark 만 감싸므로 bbox 가 원점 대칭이고,
       transform-origin: center 가 곧 핀 중심이 된다. */
    .pin-cam {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(.45);
      animation: pin-cam var(--total) var(--ease) forwards;
    }

    @keyframes pin-cam {
      0%, 24.8% { transform: scale(.45); }
      39%, 50.5% { transform: scale(.78); }
      65.7%, 100% { transform: scale(1); }
    }

    .pin-mark {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: pin-in .6s var(--ease) var(--pin-at) forwards;
    }

    @keyframes pin-in {
      0% { opacity: 0; transform: scale(.3); }
      55% { opacity: 1; transform: scale(1.18); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 라벨은 어두운 알약 배경을 깔아 해안선에서 떼어낸다 (배경 rect 는 스크립트가 만든다) */
    .pin-lbl {
      font-family: inherit;
      font-size: 8.5px;
      font-weight: 700;
      fill: #ffffff;
      opacity: 0;
      animation:
        fade-in .45s ease calc(var(--pin-at) + .2s) forwards,
        lbl-cool 1.5s ease calc(var(--pin-at) + .2s) forwards;
    }

    /* 갓 도착한 도시는 잠시 골드로 떴다가 흰색으로 가라앉는다 */
    @keyframes lbl-cool {
      0%, 42% { fill: var(--gold); }
      100% { fill: #ffffff; }
    }

    .lbl-bg {
      fill: rgba(4, 14, 27, .74);
      stroke: rgba(255, 255, 255, .14);
      stroke-width: .6;
      opacity: 0;
      animation: fade-in .45s ease calc(var(--pin-at) + .2s) forwards;
    }

    .arrive {
      fill: none;
      stroke: var(--gold);
      stroke-width: 2;
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: arrive-ring 1s var(--ease) var(--pin-at) forwards;
    }

    @keyframes arrive-ring {
      0% { opacity: 1; transform: scale(.35); }
      100% { opacity: 0; transform: scale(2.6); }
    }

    /* 서울 — 상시 소나 */
    .sonar {
      fill: none;
      stroke: rgba(255, 185, 0, .5);
      stroke-width: 1.2;
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: sonar 2.4s ease-out var(--t-seoul) infinite;
    }

    .sonar.b { animation-delay: calc(var(--t-seoul) + 1.2s); }

    @keyframes sonar {
      0% { opacity: .85; transform: scale(.55); }
      100% { opacity: 0; transform: scale(2.2); }
    }

    /* ── KB 심볼 — 서울 핀보다 위쪽에, 조금 작게 ─────────── */
    .kb-badge {
      color: var(--gold);
      filter: drop-shadow(0 0 7px rgba(255, 185, 0, .7)) drop-shadow(0 0 22px rgba(255, 185, 0, .32));
    }

    .kb-in {
      opacity: 0;
      transform: translateY(-14px);
      animation: kb-drop .7s var(--ease) var(--t-kb) forwards;
    }

    @keyframes kb-drop { to { opacity: 1; transform: translateY(0); } }

    /* ── 단계 캡션 ──────────────────────────────────────── */
    .stage-caption {
      position: absolute;
      z-index: 11;
      left: 50%;
      top: calc(100% - var(--map-bottom) + 10px);
      width: min(560px, calc(100% - 40px));
      height: 2.1em;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .stage-caption span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: var(--gold-pale);
      font-size: clamp(.76rem, 1.5vw, .96rem);
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
      opacity: 0;
      animation: cap-show 2.1s var(--ease) var(--at) forwards;
    }

    .stage-caption b {
      padding: 3px 8px;
      border: 1px solid rgba(255, 185, 0, .45);
      border-radius: 5px;
      background: rgba(255, 185, 0, .12);
      color: var(--gold);
      font-size: .78em;
      font-weight: 800;
      letter-spacing: .1em;
    }

    @keyframes cap-show {
      0% { opacity: 0; transform: translateY(7px); }
      16%, 74% { opacity: 1; transform: none; }
      100% { opacity: 0; transform: translateY(-7px); }
    }

    /* ── 문구 ───────────────────────────────────────────── */
    .statement {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: max(6vh, calc(3vh + env(safe-area-inset-bottom)));
      width: min(920px, calc(100% - 44px));
      text-align: center;
      transform: translateX(-50%);
    }

    /* 유닛 메시지 — 헤드라인 위, 골드 배지로 강조 */
    .unit-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      padding: 10px 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 185, 0, .48);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 185, 0, .16), rgba(255, 185, 0, .07));
      color: var(--gold-pale);
      font-size: clamp(.84rem, 1.32vw, 1.08rem);
      font-weight: 700;
      letter-spacing: -.005em;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 26px rgba(255, 185, 0, .22), inset 0 1px 0 rgba(255, 227, 160, .22);
      opacity: 0;
      transform: translateY(12px) scale(.96);
      animation: badge-in .7s var(--ease) var(--t-badge) forwards;
    }

    .unit-badge strong {
      color: #fff3d4;
      font-weight: 800;
    }

    .unit-badge i {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(255, 185, 0, .16), 0 0 12px rgba(255, 185, 0, .9);
      animation: badge-dot 1.5s ease-in-out calc(var(--t-badge) + .5s) infinite;
    }

    /* 배지 위를 한 번 훑고 지나가는 광택 */
    .unit-badge::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -60%;
      width: 55%;
      background: linear-gradient(100deg, transparent, rgba(255, 240, 200, .34), transparent);
      animation: badge-shine 1.15s var(--ease) calc(var(--t-badge) + .34s) forwards;
    }

    @keyframes badge-in { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes badge-shine { to { left: 105%; } }

    @keyframes badge-dot {
      50% { box-shadow: 0 0 0 7px rgba(255, 185, 0, 0), 0 0 16px rgba(255, 185, 0, .95); }
    }

    .headline {
      margin: 0;
      color: white;
      font-size: clamp(2rem, 5vw, 4.5rem);
      font-weight: 770;
      line-height: .96;
      letter-spacing: -.045em;
      opacity: 0;
      transform: translateY(14px);
      animation: rise-in .8s var(--ease) var(--t-head) forwards;
    }

    .headline .gold { color: var(--gold); }

    .subline {
      margin: 14px 0 0;
      color: var(--text-2);
      font-size: clamp(.86rem, 1.4vw, 1.04rem);
      font-weight: 500;
      letter-spacing: -.015em;
      opacity: 0;
      transform: translateY(10px);
      animation: rise-in .7s var(--ease) var(--t-sub) forwards;
    }

    @keyframes rise-in { to { opacity: 1; transform: translateY(0); } }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      color: rgba(255, 211, 108, .72);
      font-size: clamp(.62rem, .92vw, .74rem);
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in .7s ease var(--t-eyebrow) forwards;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: clamp(25px, 6vw, 70px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 185, 0, .7));
    }

    .eyebrow::after { transform: scaleX(-1); }

    /* ── 진행 / 전환 ────────────────────────────────────── */
    .progress {
      position: absolute;
      z-index: 30;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, .06);
    }

    .progress::after {
      content: "";
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #d28b00, var(--gold-soft));
      box-shadow: 0 0 12px rgba(255, 185, 0, .7);
      animation: progress var(--total) linear forwards;
    }

    @keyframes progress { to { width: 100%; } }

    .exit-wipe {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      background: #f7f9fc;
      clip-path: inset(0 100% 0 0);
      animation: wipe-in .72s var(--ease) var(--t-wipe) forwards;
      pointer-events: none;
    }

    .exit-wipe span {
      color: #142a46;
      font-size: clamp(.76rem, 1vw, .88rem);
      font-weight: 800;
      letter-spacing: .14em;
      opacity: 0;
      animation: fade-in .3s ease var(--t-wipetxt) forwards;
    }

    @keyframes wipe-in { to { clip-path: inset(0 0 0 0); } }
    @keyframes fade-in { to { opacity: 1; } }

    .fallback {
      position: fixed;
      z-index: 60;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: transparent;
      pointer-events: none;
    }

    /* ── 검토 모드 바 ───────────────────────────────────
       스크립트의 REVIEW 가 true 일 때만 보인다. 전환 와이프(z-index 50)
       위에 떠 있어야 마지막 화면에서도 다시 재생을 누를 수 있다. */
    .reviewbar {
      position: fixed;
      z-index: 70;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, calc(12px + env(safe-area-inset-bottom)));
      display: none;
      align-items: center;
      gap: 10px;
      padding: 7px 8px 7px 14px;
      border: 1px solid rgba(210, 227, 245, .22);
      border-radius: 999px;
      background: rgba(6, 20, 38, .82);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .45);
    }

    .reviewbar.on { display: flex; }

    .review-time {
      min-width: 54px;
      color: var(--gold-soft);
      font-size: .74rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }

    .review-stage {
      color: var(--text-2);
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .replay {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 185, 0, .16);
      color: var(--gold-pale);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }

    .replay:hover,
    .replay:focus-visible {
      background: rgba(255, 185, 0, .3);
      color: #fff6e0;
      outline: none;
    }

    .replay svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    /* ── 반응형 ─────────────────────────────────────────
       주 사용 기기는 태블릿(iPad · 갤럭시탭)이므로 가로/세로를 따로 잡는다. */

    /* 태블릿 가로 — iPad 1024×768, 갤럭시탭 1280×800 */
    @media (min-width: 820px) and (max-width: 1400px) and (max-height: 1000px) {
      :root { --map-bottom: 42%; }
      .pin-lbl { font-size: 10.5px; }
      .statement { bottom: 5vh; }
      .unit-badge { margin-bottom: 15px; }
    }

    /* 태블릿 세로 — iPad 768×1024, 갤럭시탭 800×1280 */
    @media (min-width: 700px) and (max-width: 900px) and (min-height: 950px) {
      :root { --map-bottom: 40%; }
      .pin-lbl { font-size: 9.5px; }
      .headline { font-size: clamp(2.4rem, 7vw, 3.6rem); }
      .subline { font-size: 1rem; }
    }

    /* 휴대폰 */
    @media (max-width: 699px) {
      :root { --map-bottom: 44%; }

      .topbar { left: 20px; right: 20px; }
      .brand { font-size: .72rem; gap: 9px; }
      .brand-mark { width: 29px; height: 21px; }
      .skip { min-width: 64px; padding: 0 14px; }

      .pin-lbl { font-size: 11px; }
      .stage-caption { top: calc(100% - var(--map-bottom) + 4px); }

      .unit-badge {
        margin-bottom: 14px;
        padding: 9px 16px;
        white-space: normal;
        line-height: 1.45;
      }

      .headline { font-size: clamp(2rem, 11vw, 3rem); }
      .subline { max-width: 300px; margin: 12px auto 0; line-height: 1.55; }
      .eyebrow { margin-top: 14px; letter-spacing: .16em; }
    }

    /* 낮은 가로 화면 */
    @media (max-height: 620px) and (orientation: landscape) {
      :root { --map-bottom: 56%; }
      .statement { bottom: 4vh; }
      .headline { font-size: clamp(1.8rem, 6vw, 3.4rem); }
      .unit-badge { margin-bottom: 11px; padding: 8px 18px; }
      .subline { margin-top: 8px; }
      .eyebrow { margin-top: 9px; }
      .stage-caption { height: 1.7em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
      .cam-bg, .cam-fg { transform: scale(1); }
      .conn-draw, .conn-comet, .arrive, .sonar { display: none; }
      .conn-final { opacity: .82; }
      .conn-glow { opacity: .16; }
      .stage-caption span:not(:last-child) { display: none; }
      .exit-wipe { display: none; }
      .statement, .topbar, .unit-badge, .headline, .subline, .eyebrow, .stage-caption span,
      .layer-grat, .layer-land, .pin-mark, .pin-lbl, .lbl-bg, .kb-in { opacity: 1; }
    }
  </style>

                <circle class="arrive" r="12"/>
                <g class="pin-mark">
                  <circle r="12" fill="rgba(255,255,255,.07)"/>
                  <circle r="9.5" fill="#0a1828" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
                  <clipPath id="f-hk"><circle r="8"/></clipPath>
                  <g clip-path="url(#f-hk)">
                    <circle r="8" fill="#de2910"/>
                    <path d="M0,-4 L1.2,-1.2 L3.8,-1.2 L1.7,.5 L2.5,3.2 L0,1.5 L-2.5,3.2 L-1.7,.5 L-3.8,-1.2 L-1.2,-1.2Z" fill="#fff"/>
                  </g>
                </g>
              </g>
              <text class="pin-lbl" x="-24" y="-5" text-anchor="end">홍콩</text>
            </g>

            <!-- 1단계 — 호치민 -->
            <g class="pin" data-stage="1" transform="translate(494,225.2)">
              <g class="pin-cam">
                <circle class="arrive" r="12"/>
                <g class="pin-mark">
                  <circle r="12" fill="rgba(255,255,255,.07)"/>
                  <circle r="9.5" fill="#0a1828" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
                  <clipPath id="f-vn"><circle r="8"/></clipPath>
                  <g clip-path="url(#f-vn)">
                    <circle r="8" fill="#da251d"/>
                    <path d="M0,-4 L1,-1 L4,-1 L1.6,.7 L2.4,4 L0,2 L-2.4,4 L-1.6,.7 L-4,-1 L-1,-1Z" fill="#ff0"/>
                  </g>
                </g>
              </g>
              <text class="pin-lbl" x="26" y="6" text-anchor="start">호치민</text>
            </g>

            <!-- 2단계 — 뉴델리 -->
            <g class="pin" data-stage="2" transform="translate(416.9,167.7)">
              <g class="pin-cam">
                <circle class="arrive" r="12"/>
                <g class="pin-mark">
                  <circle r="12" fill="rgba(255,255,255,.07)"/>
                  <circle r="9.5" fill="#0a1828" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
                  <clipPath id="f-in"><circle r="8"/></clipPath>
                  <g clip-path="url(#f-in)">
                    <rect x="-8" y="-8" width="16" height="5.33" fill="#ff9933"/>
                    <rect x="-8" y="-2.67" width="16" height="5.34" fill="#fff"/>
                    <rect x="-8" y="2.67" width="16" height="5.33" fill="#138808"/>
                    <circle r="2.1" fill="none" stroke="#000080" stroke-width=".7"/>
                    <circle r=".5" fill="#000080"/>
                  </g>
                </g>
              </g>
              <text class="pin-lbl" x="-24" y="-5" text-anchor="end">뉴델리</text>
            </g>

            <!-- 2단계 — 런던 -->
            <g class="pin" data-stage="2" transform="translate(242.7,95.1)">
              <g class="pin-cam">
                <circle class="arrive" r="12"/>
                <g class="pin-mark">
                  <circle r="12" fill="rgba(255,255,255,.07)"/>
                  <circle r="9.5" fill="#0a1828" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
                  <clipPath id="f-gb"><circle r="8"/></clipPath>
                  <g clip-path="url(#f-gb)">
                    <circle r="8" fill="#012169"/>
                    <path d="M-8,-8L8,8M8,-8L-8,8" stroke="#fff" stroke-width="2.6"/>
                    <path d="M-8,-8L8,8M8,-8L-8,8" stroke="#c8102e" stroke-width="1.35"/>
                    <path d="M0,-8V8M-8,0H8" stroke="#fff" stroke-width="3.35"/>
                    <path d="M0,-8V8M-8,0H8" stroke="#c8102e" stroke-width="2"/>
                  </g>
                </g>
              </g>
              <text class="pin-lbl" x="26" y="-5" text-anchor="start">런던</text>
            </g>

            <!-- 서울 — 모든 노선의 원점. 라벨 없이 KB 심볼과 태극기로 나타낸다 -->
            <g class="pin" data-stage="0" transform="translate(550,139.2)">
              <g class="pin-cam">
                <circle class="sonar" r="14"/>
                <circle class="sonar b" r="14"/>
                <g class="pin-mark">
                  <circle r="17" fill="rgba(255,188,0,.14)"/>
                  <circle r="13.5" fill="none" stroke="rgba(255,188,0,.6)" stroke-width="1"/>
                  <circle r="11.5" fill="#0a1828" stroke="#ffb900" stroke-width="1.8"/>
                  <clipPath id="f-kr"><circle r="9.8"/></clipPath>
                  <g clip-path="url(#f-kr)">
                    <circle r="9.8" fill="#fff"/>
                    <path d="M4.5,0 A2.25,2.25 0 0,1 0,0 A2.25,2.25 0 0,0 -4.5,0 A4.5,4.5 0 0,1 4.5,0Z" fill="#c60c30"/>
                    <path d="M-4.5,0 A2.25,2.25 0 0,1 0,0 A2.25,2.25 0 0,0 4.5,0 A4.5,4.5 0 0,1 -4.5,0Z" fill="#003478"/>
                  </g>
                </g>
              </g>
            </g>
          </g>

          <!-- KB 심볼 — 서울 핀 위쪽에 조금 더 작게 -->
          <g class="kb-badge" transform="translate(539.5,102)">
            <g class="kb-in">
              <use href="#kb-mark" width="21" height="15.2"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <!-- 단계 캡션 — 지금 무엇이 연결되고 있는지 말로 잡아준다 -->
    <div class="stage-caption" aria-hidden="true">
      <span style="--at:calc(var(--t-s1) + .55s)"><b>01</b>홍콩 · 호치민</span>
      <span style="--at:calc(var(--t-s2) + .55s)"><b>02</b>뉴델리 · 런던</span>
    </div>

    <div class="statement">
      <div class="unit-badge"><i aria-hidden="true"></i>글로벌시너지유닛은 여러분과 <strong>함께합니다</strong></div>
      <h1 class="headline">GLOBAL <span class="gold">ONE</span> TEAM</h1>
      <p class="subline">하나의 정보로 세계를 연결하다</p>
      <div class="eyebrow">One Pulse · One View · One Team</div>
    </div>

    <div class="progress" aria-hidden="true"></div>
    <div class="exit-wipe" aria-hidden="true"><span>GLOBAL DAILY BRIEF</span></div>
    <a class="fallback" href="brief.html">브리프 화면 열기</a>
  </main>

  <div class="reviewbar" hidden>
    <span class="review-time">0.00s</span>
    <span class="review-stage">대기</span>
    <button class="replay" type="button" aria-label="인트로 처음부터 다시 재생">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
      다시 재생
    </button>
  </div>

  <noscript>
    <style>.intro{display:none}.nojs{min-height:100%;display:grid;place-items:center;background:#061426;color:white;font-family:system-ui}</style>
    <div class="nojs"><a href="brief.html" style="color:#ffcc55">KB 글로벌 브리프 열기</a></div>
  </noscript>

  <script>
    (() => {
      /* ── 검토 모드 ──────────────────────────────────────
         true  : 연출을 반복해서 보기 위한 모드. 자동 이동·화면 클릭·키
                 건너뛰기를 모두 끄고 우하단에 경과 시간과 "다시 재생"을 띄운다.
         false : 실제 배포 동작. 12.5초 뒤 브리프로 자동 이동한다.
         ── 배포 전 반드시 false 로 되돌릴 것. */
      const REVIEW = false;   /* 배포 모드 — 자동 이동 ON. 연출 검토 시에만 true */

      /* 상대 경로 + ?date/?lang 보존 — 아카이브·영문 진입이 인트로를 지나도 이어진다.
         (배포물은 brief.html 과 같은 폴더에 놓인다) */
      const TARGET = 'brief.html' + (location.search || '');
      const TOTAL_MS = 10500;          /* CSS --total 및 .progress 와 동일하게 유지 */
      const REDUCED_MS = 2600;

      /* ── 노선 ───────────────────────────────────────────
         단계마다 두 개씩. 짝을 이루는 두 선이 서로 다른 방향으로 갈라지도록
         제어점을 잡았고, b 쪽은 --pair-lag 만큼 늦게 출발시켜 "두 갈래"임을
         분명히 한다. 좌표는 참조 지도와 같은 1100×520 공간이다. */
      const ROUTES = [
        { stage: 1, lag: 0, d: 'M550,139.2 Q566,162 515.4,188' },     /* 홍콩 — 동쪽으로 부풀려 */
        { stage: 1, lag: 1, d: 'M550,139.2 Q478,165 494,225.2' },     /* 호치민 — 서쪽으로 부풀려 */
        { stage: 2, lag: 0, d: 'M550,139.2 Q490,120 416.9,167.7' },     /* 뉴델리 — 북쪽으로 넘어 서진 (호치민 노선 회피) */
        { stage: 2, lag: 1, d: 'M550,139.2 Q400,70 242.7,95.1' }      /* 런던 — 북쪽으로 크게 돌아 서진 */
      ];

      /* 경과 시간 옆에 현재 어느 대목인지 같이 띄운다 (CSS --t-* 와 같은 값) */
      const STAGES = [
        [0, '서울 클로즈업'],
        [1.15, '서울 핀'],
        [1.60, 'KB 심볼'],
        [2.60, '1차 축소'],
        [3.30, '1단계 — 홍콩 · 호치민'],
        [5.30, '2차 축소'],
        [6.00, '2단계 — 뉴델리 · 런던'],
        [7.80, '유닛 메시지'],
        [8.15, '헤드라인'],
        [9.70, '전환 와이프'],
        [10.5, '종료']
      ];

      const SVG_NS = 'http://www.w3.org/2000/svg';
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const svg = document.querySelector('.worldmap');

      document.querySelector('.fallback').href = TARGET;

      /* ── 배경 입자 ──────────────────────────────────────
         시드를 날짜에서 뽑아 하루 단위로만 배치가 바뀌게 한다. */
      let seed = (new Date().getFullYear() * 10000 + (new Date().getMonth() + 1) * 100 + new Date().getDate()) >>> 0;
      const random = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      if (!reducedMotion) {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 70; i += 1) {
          const dot = document.createElement('i');
          dot.className = 'speck';
          dot.style.left = `${random() * 100}%`;
          dot.style.top = `${random() * 100}%`;
          dot.style.setProperty('--dur', `${3.5 + random() * 5}s`);
          dot.style.setProperty('--delay', `${-random() * 5}s`);
          dot.style.setProperty('--dx', `${-12 + random() * 24}px`);
          dot.style.setProperty('--dy', `${-10 + random() * 20}px`);
          frag.appendChild(dot);
        }
        document.querySelector('.ambient').appendChild(frag);
      }

      /* ── 노선 그리기 ────────────────────────────────────
         한 노선은 glow(잔광) · draw(뻗는 실선) · final(정착 점선) · comet(선 끝)
         네 겹이다. 선을 "그리는" 효과와 혜성 위치는 실제 경로 길이가 있어야
         계산되므로 여기서 한 번 재서 CSS 변수로 넘긴다. */
      const routeGroup = document.querySelector('.routes');
      const COMET_LEN = 20;

      ROUTES.forEach((r) => {
        const g = document.createElementNS(SVG_NS, 'g');
        g.setAttribute('class', 'route');
        g.style.setProperty('--delay', `calc(var(--t-s${r.stage}) + ${r.lag} * var(--pair-lag))`);
        g.style.setProperty('--dur', r.stage === 2 ? 'var(--dur-draw-long)' : 'var(--dur-draw)');

        ['conn-glow', 'conn-draw', 'conn-final', 'conn-comet'].forEach((cls) => {
          const p = document.createElementNS(SVG_NS, 'path');
          p.setAttribute('class', cls);
          p.setAttribute('d', r.d);
          g.appendChild(p);
        });

        routeGroup.appendChild(g);

        const len = g.querySelector('.conn-draw').getTotalLength();
        g.style.setProperty('--len', len.toFixed(1));
        g.style.setProperty('--comet-end', `${(COMET_LEN - len).toFixed(1)}px`);
      });

      /* ── 라벨 배경 ──────────────────────────────────────
         해안선 위에 글자가 얹히면 잘 안 읽히므로 실제 글자 크기를 재서
         어두운 알약을 뒤에 깐다. */
      const padX = 5;
      const padY = 3;

      /* 태블릿은 회전하고 회전하면 라벨 글자 크기가 달라지므로 다시 잰다 */
      const drawLabelPills = () => {
        document.querySelectorAll('.lbl-bg').forEach((el) => el.remove());
        document.querySelectorAll('.pin-lbl').forEach((label) => {
          const box = label.getBBox();
          const rect = document.createElementNS(SVG_NS, 'rect');
          rect.setAttribute('class', 'lbl-bg');
          rect.setAttribute('x', (box.x - padX).toFixed(1));
          rect.setAttribute('y', (box.y - padY).toFixed(1));
          rect.setAttribute('width', (box.width + padX * 2).toFixed(1));
          rect.setAttribute('height', (box.height + padY * 2).toFixed(1));
          rect.setAttribute('rx', ((box.height + padY * 2) / 2).toFixed(1));
          label.parentNode.insertBefore(rect, label);
        });
      };

      drawLabelPills();
      window.addEventListener('resize', drawLabelPills, { passive: true });

      /* 핀 등장 시각은 각 단계의 선이 거의 도착할 때에 맞춘다 */
      document.querySelectorAll('.pin').forEach((pin) => {
        const stage = pin.dataset.stage;
        pin.style.setProperty('--pin-at', stage === '0'
          ? 'var(--t-seoul)'
          : `calc(var(--t-s${stage}) + ${stage === '2' ? 1.15 : .95}s)`);
      });

      /* ── 이동 ───────────────────────────────────────────*/
      let done = false;
      const goToBrief = () => {
        if (done) return;
        done = true;
        window.location.replace(TARGET);
      };

      if (!REVIEW) {
        document.querySelector('.skip').addEventListener('click', goToBrief);
        document.querySelector('.intro').addEventListener('click', goToBrief);
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') goToBrief();
        });
        window.setTimeout(goToBrief, reducedMotion ? REDUCED_MS : TOTAL_MS);
        return;
      }

      /* ── 검토 모드 컨트롤 ───────────────────────────────
         페이지를 새로 읽지 않고 CSS 애니메이션과 SVG 타임라인을 함께 0 으로
         되돌려 같은 연출을 그대로 다시 재생한다. */
      const bar = document.querySelector('.reviewbar');
      const timeEl = bar.querySelector('.review-time');
      const stageEl = bar.querySelector('.review-stage');

      bar.hidden = false;
      bar.classList.add('on');

      let startedAt = performance.now();

      const replay = () => {
        document.getAnimations().forEach((a) => {
          try { a.cancel(); a.play(); } catch (e) { /* 되감을 수 없는 항목은 건너뛴다 */ }
        });
        svg.setCurrentTime(0);
        startedAt = performance.now();
      };

      /* 검토 중에는 SKIP 이 브리프로 나가는 대신 마지막 프레임으로 건너뛴다.
         화면을 떠나지 않으므로 바로 다시 재생할 수 있다. */
      const jumpToEnd = () => {
        document.getAnimations().forEach((a) => {
          try { a.currentTime = TOTAL_MS; } catch (e) { /* 무한 반복 항목은 그대로 둔다 */ }
        });
        svg.setCurrentTime(TOTAL_MS / 1000);
        startedAt = performance.now() - TOTAL_MS;
      };

      const skipBtn = document.querySelector('.skip');
      skipBtn.title = '검토 모드 — 이동하지 않고 마지막 프레임으로 건너뜁니다';
      skipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        jumpToEnd();
      });

      bar.querySelector('.replay').addEventListener('click', (e) => {
        e.stopPropagation();
        replay();
      });

      /* R 키로도 다시 재생 — 반복 확인할 때 손을 옮기지 않아도 된다 */
      document.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') replay();
      });

      const tick = () => {
        const t = (performance.now() - startedAt) / 1000;
        timeEl.textContent = `${Math.min(t, TOTAL_MS / 1000).toFixed(2)}s`;
        let label = STAGES[0][1];
        for (const [at, name] of STAGES) { if (t >= at) label = name; }
        stageEl.textContent = label;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
