<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>KB Global One Team — 모니터링</title>
<meta name="description" content="KB 글로벌 원팀 뉴스 — 규제·거래투자·사건사고 이벤트, 한국계 금융기관, 인사동향 모니터링"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap"/>
<link rel="stylesheet" href="shared-tokens.css"/>
<!-- 데이터: export_json 이 아래 스크립트에 주입(오프라인). 없으면 topics.json fetch. -->
<script id="topics-data" type="application/json">null</script>
<script src="shared-glossary.js"></script>
<script src="shared-modal.js"></script>
<style>
.pagettl{font-size:clamp(12.5px,1.9cqi,15px);color:var(--muted);margin:2px 2px 10px}
.twcc-wrap{background:var(--line);margin:0 calc(-1 * var(--pad)) 10px;padding:7px var(--pad)}
.twcc{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.twcc::-webkit-scrollbar{display:none}
.cc-pk{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border:none;border-radius:7px;background:#fff;color:var(--muted);font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.cc-pk[aria-selected="true"]{background:var(--gold-soft);color:#B67611;font-weight:700}
.cc-pk .fg{font-size:13px;line-height:1}
.cc-pk .n{opacity:.65;margin-left:2px}
.lk-entry{display:inline-block;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;margin-right:6px;white-space:nowrap}
.lk-entry:hover{border-color:var(--gold);color:var(--ink,#151515)}
</style>
</head>
<body>
<script src="shared-sprite.js"></script>
<div class="shell">
  <header class="hd">
    <div class="hd-brand">
      <div class="brandline">
        <svg class="kbmark" width="30" height="22" style="color:var(--gold-2)" aria-hidden="true"><use href="#kb-mark"/></svg>
        <span>KB FINANCIAL GROUP</span>
      </div>
      <h1 class="en">GLOBAL ONE TEAM</h1>
      <div class="hd-sub"><b data-en="Monitoring">모니터링 · TopicWatch</b><i class="dot-live"></i></div>
    </div>
    <div class="hd-tools">
      <a class="lk-entry" href="links.html" data-en="Links">원문 링크</a>
      <div class="langtoggle" role="group" aria-label="언어 선택">
        <button type="button" data-lang="ko" aria-pressed="true">KR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <div class="twtabs" id="twtabs"></div>
  <div class="twcc-wrap"><div class="twcc" id="twcc"></div></div>
  <div class="twhead" id="twhead"></div>
  <ul class="twfeed" id="twfeed"></ul>

  <nav class="botnav" id="botnav">
    <a href="brief.html">
      <svg><use href="#ico-nav-home"/></svg><span data-en="Home">홈</span>
    </a>
    <a href="countries.html">
      <svg><use href="#ico-nav-news"/></svg><span data-en="News">뉴스</span>
    </a>
    <a class="on" href="topics.html">
      <svg><use href="#ico-nav-monitor"/></svg><span data-en="Monitoring">모니터링</span>
    </a>
    <a href="markets.html"><svg><use href="#ico-spark"/></svg><span data-en="Markets">지표</span></a>
    <a href="weekly.html">
      <svg><use href="#ico-nav-weekly"/></svg><span data-en="Weekly">주간</span>
    </a>
  </nav>
</div>

<script>
(async function(){
  const P = new URLSearchParams(location.search), QD = P.get('date'), EN = P.get('lang') === 'en';
  let D = null;
  if (QD) { try { D = await (await fetch('archive/' + QD + '/topics.json')).json(); } catch(e){} }
  try { if (!D) D = JSON.parse(document.getElementById('topics-data').textContent); } catch(e){}
  if (!D) { try { D = await (await fetch('topics.json')).json(); } catch(e){} }

  // 한국계 금융기관·인사동향 — countries.json에 이미 있는 데이터를 그대로 재사용
  // (export_json.py 계약 변경 없음). topics.json과 같은 3단 폴백.
  let CTR = null;
  if (QD) { try { CTR = await (await fetch('archive/' + QD + '/countries.json')).json(); } catch(e){} }
  if (!CTR) { try { CTR = await (await fetch('countries.json')).json(); } catch(e){} }

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const chev = () => `<svg class="ar" width="15" height="15" aria-hidden="true"><use href="#ico-chev-r"/></svg>`;
  const NAMES = EN
    ? {GB:'UK',US:'US',HK:'Hong Kong',CN:'China',JP:'Japan',SG:'Singapore',IN:'India',VN:'Vietnam',MM:'Myanmar',ID:'Indonesia',KH:'Cambodia',TH:'Thailand',LA:'Laos',GLOBAL:'Global'}
    : {GB:'영국',US:'미국',HK:'홍콩',CN:'중국',JP:'일본',SG:'싱가포르',IN:'인도',VN:'베트남',MM:'미얀마',ID:'인도네시아',KH:'캄보디아',TH:'태국',LA:'라오스',GLOBAL:'글로벌'};
  const ccName = (a) => EN ? (a.cc_label_en || NAMES[a.cc] || a.cc) : (a.cc_label || NAMES[a.cc] || a.cc);
  const tq = (a) => EN ? (a.q_en || a.q) : (a.q || a.q_en);

  if (!D || !D.categories || !D.categories.length) {
    $('#twfeed').innerHTML = `<div class="empty-state">${EN ? 'topics.json not found. Run' : 'topics.json 이 없습니다.'} <code>python main.py export</code></div>`;
    return;
  }

  // ai_score는 LLM 절대채점이라 대부분 동점(양자화) — 정렬은 복합 rank_score
  // (ranking.py, 다매체 커버리지·매체tier·최신성 등 반영) 우선, 없으면 score로 폴백.
  const byScore = (a,b) => (b.rank_score ?? b.score ?? 0) - (a.rank_score ?? a.score ?? 0);

  // 백엔드 categories[]는 같은 code가 presence='진출'/'미진출' 2건으로 분리돼 있음 —
  // 목업 디자인(진출+미진출 병합, score순, 카드별 진출/미진출 칩)에 맞춰 프런트에서 병합.
  // 백엔드(export_json.py)는 그대로 둔다(HANDOFF §6.1: export 템플릿 연동만).
  const byCode = new Map();
  for (const c of D.categories) {
    if (!byCode.has(c.code)) byCode.set(c.code, {code:c.code, ui:c.ui, label:c.label, label_en:c.label_en, arts:[], n_in:0, n_out:0});
    const g = byCode.get(c.code);
    const arts = (c.articles || []).map(a => ({...a, presence: c.presence}));
    g.arts.push(...arts);
    if (c.presence === '진출') g.n_in += arts.length; else g.n_out += arts.length;
  }
  const TOPICS = [...byCode.values()];
  TOPICS.forEach(t => t.arts.sort(byScore));

  // 한국계 금융기관·인사동향 — countries.html에서 이전(2026-09-08). 진출/미진출
  // 구분 없는 평면 리스트라 n_in/n_out 대신 flat:true로 표시.
  const PRESENCE_CODES = new Set(['GB','US','HK','CN','JP','SG','IN','VN','MM','ID','KH','TH','LA']);
  if (CTR) {
    const kfiArts = (CTR.korean_fi && CTR.korean_fi.articles) || [];
    const personnelArts = (CTR.personnel && CTR.personnel.articles) || [];
    if (kfiArts.length) TOPICS.push({code:'KFI', label:'한국계 금융기관', label_en:'Korean FI', flat:true,
      arts:[...kfiArts].sort(byScore)});
    if (personnelArts.length) TOPICS.push({code:'PERSONNEL', label:'인사동향', label_en:'Leadership Moves', flat:true,
      arts:[...personnelArts].sort(byScore)});
  }

  let curCode = null, fCC = P.get('cc') || '';

  // 국가 칩 = 현재 탭(카테고리)에 실제로 기사가 있는 국가만, 건수 포함해 표시.
  function ccCounts(t){
    const m = new Map();
    for (const a of t.arts) {
      if (!a.cc) continue;
      if (!m.has(a.cc)) m.set(a.cc, {flag:a.flag||'', label:ccName(a), n:0});
      m.get(a.cc).n++;
    }
    return m;
  }
  function renderCC(t){
    const ccm = ccCounts(t);
    if (fCC && !ccm.has(fCC)) fCC = '';
    const chip=(cc,flag,label,n,sel)=>`<button class="cc-pk" data-cc="${cc}" aria-selected="${sel}">${flag?`<span class="fg">${esc(flag)}</span>`:''}${label?`<span class="cc-nm">${esc(label)}</span>`:''}<span class="n">${n}</span></button>`;
    const codes=[...ccm.keys()].sort((x,y)=>ccm.get(y).n-ccm.get(x).n);
    $('#twcc').innerHTML = chip('','',EN?'All':'전체',t.arts.length,fCC==='') + codes.map(cc=>chip(cc,ccm.get(cc).flag,ccm.get(cc).label,ccm.get(cc).n,fCC===cc)).join('');
    $('#twcc').querySelectorAll('.cc-pk').forEach(b=>b.addEventListener('click',()=>{ fCC=b.dataset.cc; render(curCode); }));
    return ccm;
  }

  function render(code){
    const t = TOPICS.find(x => x.code === code) || TOPICS[0];
    curCode = t.code;
    const ccm = renderCC(t);
    document.querySelectorAll('.tw-tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.code === t.code)));
    const arts = fCC ? t.arts.filter(a => a.cc === fCC) : t.arts;
    $('#twhead').innerHTML = `<span class="tt">${esc(EN ? (t.label_en||t.label) : t.label)}</span>`+
      (fCC
        ? `<span class="sub">${esc((ccm.get(fCC)||{}).label || fCC)} <b>${arts.length}</b></span>`
        : (t.flat
          ? `<span class="sub">${EN?'Total':'전체'} <b>${t.arts.length}</b></span>`
          : `<span class="sub">${EN?'Presence':'진출'} <b>${t.n_in}</b> · ${EN?'Non-presence':'미진출'} <b>${t.n_out}</b></span>`));
    if (!arts.length) {
      $('#twfeed').innerHTML = `<div class="empty-state">${EN?'No articles for this filter.':'해당 조건의 기사가 없습니다.'}</div>`;
      $('#twfeed')._rows = [];
      return;
    }
    $('#twfeed').innerHTML = arts.map((a,i) => {
      const isPresence = t.flat ? PRESENCE_CODES.has(a.cc) : a.presence === '진출';
      const pres = isPresence
        ? `<span class="tw-pres in">${EN?'Presence':'진출'}</span>` : `<span class="tw-pres">${EN?'Non-presence':'미진출'}</span>`;
      return `<li class="tw-item" data-i="${i}">
        <div class="tw-tags"><span class="tw-cc"><span class="fg">${esc(a.flag||'')}</span>${esc(ccName(a))}</span>${pres}</div>
        <div class="tw-t">${esc(EN ? (a.t_en || a.t) : (a.t || a.t_en))}</div>
        ${tq(a)?`<div class="tw-q">${esc(tq(a))}</div>`:''}
        <div class="tw-m"><span class="src">${esc(a.src||'')}</span>${a.d?`<span>${esc(a.d)}</span>`:''}${chev()}</div>
      </li>`;
    }).join('');
    $('#twfeed')._rows = arts;
  }

  $('#twtabs').innerHTML = TOPICS.map((t,i) => `
    <button class="tw-tab" data-code="${t.code}" aria-selected="${i===0}">${esc(EN?(t.label_en||t.label):t.label)} <span class="n">${t.arts.length}</span></button>`).join('');
  document.querySelectorAll('.tw-tab').forEach(b => b.addEventListener('click', () => render(b.dataset.code)));
  render(QD ? TOPICS[0].code : (P.get('topic') || TOPICS[0].code));

  document.getElementById('twfeed').addEventListener('click', (e) => {
    const el = e.target.closest('.tw-item'); if (!el) return;
    const a = (document.getElementById('twfeed')._rows || [])[+el.dataset.i];
    if (a) openArticleModal(a);
  });

  // 언어 토글 — ?lang= 로 재로드
  document.querySelectorAll('.langtoggle button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.lang === (EN ? 'en' : 'ko')));
    b.addEventListener('click', () => { P.set('lang', b.dataset.lang); location.search = P.toString(); });
  });
  if (EN) document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.getAttribute('data-en'); });

  // 날짜/언어 보존한 채 다른 탭·하단 내비로 이동. 각 링크 고유 쿼리(예: ?tab=non)는
  // 유지하고 그 위에 현재 ?date/?lang만 덧붙인다.
  const carry = new URLSearchParams(location.search); carry.delete('tab'); carry.delete('topic');
  document.querySelectorAll('.botnav a').forEach(a => {
    const raw = a.getAttribute('href');
    const [path, ownQuery] = raw.split('?');
    const merged = new URLSearchParams(ownQuery || '');
    for (const [k,v] of carry) merged.set(k, v);
    const qs = merged.toString();
    a.href = path + (qs ? '?' + qs : '');
  });
})();
</script>
</body>
</html>
