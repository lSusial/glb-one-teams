<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KB 글로벌 데일리 브리핑 — TopicWatch</title>
<script id="topics-data" type="application/json">null</script>
<style>
  :root{--kb-yellow:#FFBC00;--kb-dark:#545045;--kb-gold:#85754E;--kb-silver:#8A8D8F;
        --ink:#2b2926;--line:#e8e4dd;--card:#fff;--sub:#7a746c;--page:#dcd8d2;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 0}
  .mast{position:relative;overflow:hidden;border-radius:14px;padding:20px 24px 22px;color:#fff;background:linear-gradient(135deg,#5c574f 0%,#4a453e 100%)}
  .mast .kbwm{position:absolute;right:-6px;top:-26px;font-size:132px;font-weight:900;color:rgba(255,255,255,.05);letter-spacing:-6px}
  .mast .row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
  .mast .kb{font-weight:800}.mast .kb b{color:var(--kb-yellow)}.mast .kb span{color:#d9d4cc;font-weight:600;margin-left:4px}
  .mast .rt{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#cfc9c0}
  .mast .en{border:1px solid rgba(255,188,0,.6);color:var(--kb-yellow);border-radius:20px;padding:2px 10px;font-weight:700}
  .mast .en .off{color:#a49c8f}
  .dsel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:2px 7px;font-size:12px;max-width:130px}
  .mast h1{position:relative;z-index:1;font-size:26px;font-weight:800;margin:14px 0 8px;line-height:1.2}
  .mast .sub{position:relative;z-index:1;font-size:12.5px;color:#cfc9c0}
  .nav{display:flex;gap:4px;margin:14px 0 0;overflow-x:auto}
  .nav a{font-size:12px;font-weight:700;color:var(--sub);text-decoration:none;padding:7px 0;border-radius:20px;border:1px solid var(--line);background:#fff;flex:1;text-align:center;white-space:nowrap}
  .nav a.on{background:var(--kb-dark);color:#fff;border-color:var(--kb-dark)}
  .cluster{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
  .ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .ch .clabel{font-size:15px;font-weight:800}
  .ch .cflags{font-size:15px;letter-spacing:1px}
  .ch .cmeta{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:700}
  .ca{padding:9px 0;border-top:1px dashed var(--line)}
  .ca:first-child{border-top:0}
  .ca .cat{font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:3px}
  .ca .flag{font-size:14px}.ca .score{margin-left:auto;font-weight:800;color:var(--kb-gold)}
  .ca .ctt{font-size:14px;font-weight:700;line-height:1.35}
  .ca .cq{color:#463f37;line-height:1.5;font-size:13px;margin-top:3px}
  .ca .ck{margin-top:5px;background:#fffdf4;border-left:3px solid var(--kb-yellow);border-radius:5px;padding:5px 9px;font-size:12.5px;line-height:1.5}
  .ca .ck b{color:var(--kb-gold)}
  .badge{font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;color:#fff}
  .b-economy{background:#2b5f9e}.b-finance{background:#2f7d4f}.b-digital{background:#6a3fb5}.b-esg{background:#3a8a6a}.b-risk{background:#b23b3b}
  .empty{color:var(--sub);text-align:center;padding:30px;font-size:13px;line-height:1.6}
  footer{text-align:center;color:var(--kb-silver);font-size:11.5px;letter-spacing:.5px;padding:22px 0 34px}
  footer .tag{color:var(--kb-gold);font-weight:800;letter-spacing:1px}
  a{color:#2b5f9e;text-decoration:none}a:hover{text-decoration:underline}

  @media(max-width:520px){
    .wrap{padding:12px 8px 0}
    .mast{padding:14px 14px 16px;border-radius:10px}
    .mast h1{font-size:21px;margin:10px 0 5px}
    .mast .kbwm{font-size:88px}
    .mast .sub{font-size:12px}
    .sec{padding:12px 11px;border-radius:10px;margin-top:10px}
    .art{padding:10px 11px}
    .nc{padding:10px 11px}
    .sec-h{margin-bottom:10px}
    .modal{padding:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="kbwm">KB</div>
    <div class="row">
      <span class="kb"><b>KB</b><span>국민은행</span></span>
      <span class="rt"><span class="en">KR<span class="off"> / EN</span></span><select id="dsel" class="dsel"></select></span>
    </div>
    <h1 data-en="Issue Tracker">이슈 트래커</h1>
    <div class="sub" data-en="How one issue plays out across hubs — cross-cutting deep dive">같은 이슈가 여러 거점에서 어떻게 나타나는지 — 주제별 횡단 딥다이브</div>
    <div class="nav"><a href="brief.html" data-en="Today's Global">오늘의 글로벌</a><a href="countries.html" data-en="Country News">국가별 뉴스</a><a href="weekly.html" data-en="Weekly Report">주간 리포트</a><a class="on" href="topics.html" data-en="Issue Tracker">이슈 트래커</a></div>
  </div>
  <div id="feed"></div>
  <footer><div class="tag">CONNECTING PEOPLE, CREATING GLOBAL VALUE</div><div id="gen"></div></footer>
</div>

<script>
(async function(){
  const P=new URLSearchParams(location.search), QD=P.get('date'), EN=P.get('lang')==='en';
  let D=null;
  if(QD){ try{ D=await (await fetch('archive/'+QD+'/topics.json')).json(); }catch(e){} }
  try{ if(!D) D=JSON.parse(document.getElementById('topics-data').textContent);}catch(e){}
  if(!D){ try{ D=await (await fetch('topics.json')).json(); }catch(e){} }
  if(!D){ document.getElementById('feed').innerHTML=`<div class="empty">${EN?'topics.json not found. Run <code>python main.py export</code>.':'topics.json 이 없습니다. <code>python main.py export</code> 로 생성하세요.'}</div>`; return; }

  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md=s=>String(s||'').slice(5);   // 연도 제거(MM-DD)
  const NAMES=EN?{GB:'UK',US:'US',HK:'Hong Kong',CN:'China',JP:'Japan',SG:'Singapore',IN:'India',VN:'Vietnam',MM:'Myanmar',ID:'Indonesia',KH:'Cambodia',GLOBAL:'Global'}
               :{GB:'영국',US:'미국',HK:'홍콩',CN:'중국',JP:'일본',SG:'싱가포르',IN:'인도',VN:'베트남',MM:'미얀마',ID:'인도네시아',KH:'캄보디아',GLOBAL:'글로벌'};
  const BL=EN?{economy:'Economy',finance:'Banking',digital:'Digital',esg:'ESG',risk:'Risk'}:{economy:'경제',finance:'금융',digital:'디지털',esg:'ESG',risk:'리스크'};
  const badges=cstr=>(cstr||'').split(/\s+/).filter(Boolean).map(k=>{const l=BL[k];return l?`<span class="badge b-${k}">${l}</span>`:'';}).join(' ');
  const LANG=EN?'en':'ko';
  const tq=a=>EN?(a.q_en||a.q):(a.q||a.q_en), tk=a=>EN?(a.k_en||a.k):(a.k||a.k_en);
  const enEl=document.querySelector('.en');
  if(enEl){ enEl.style.cursor='pointer';
    enEl.innerHTML=LANG==='en'?'<span class="off">KR / </span>EN':'KR<span class="off"> / EN</span>';
    enEl.onclick=()=>{ P.set('lang',LANG==='en'?'ko':'en'); location.search=P.toString(); }; }
  document.querySelectorAll('.nav a').forEach(a=>{ a.href=a.getAttribute('href').split('?')[0]+location.search; });
  if(EN) document.querySelectorAll('[data-en]').forEach(el=>{ el.textContent=el.getAttribute('data-en'); });

  document.getElementById('gen').textContent=(EN?'Updated ':'업데이트 ')+(D.generated_at||'').slice(0,16).replace('T',' ');
  const cl=D.clusters||[];
  const feed=document.getElementById('feed');
  if(!cl.length){feed.innerHTML=`<div class="empty">${EN?'No cross-cutting issues yet.<br>Fills in as AI ranking progresses.':'횡단 이슈가 아직 없습니다.<br>AI 랭킹이 더 진행되면 채워집니다.'}</div>`;return;}
  feed.innerHTML=cl.map(c=>`<div class="cluster">
    <div class="ch"><span class="clabel">${esc(LANG==='en'?(c.label_en||c.label):c.label)}</span>
      <span class="cflags">${(c.flags||[]).join('')}</span>
      <span class="cmeta">${(c.ccs||[]).length}${EN?' hubs · ':'개 거점 · '}${c.count}${EN?'':'건'}</span></div>
    ${(c.articles||[]).map(a=>`<div class="ca">
      <div class="cat"><span class="flag">${a.flag||''}</span> <b>${NAMES[a.cc]||a.cc||''}</b> · ${esc(a.src)} · ${esc(md(a.d))} ${badges(a.c)}
</div>
      <div class="ctt">${a.u?`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}</a>`:esc(a.t)}</div>
      ${tq(a)?`<div class="cq">${esc(tq(a))}</div>`:''}
      ${tk(a)?`<div class="ck"><b>${EN?'KB implication':'KB 시사점'}</b> ${esc(tk(a))}</div>`:''}</div>`).join('')}
  </div>`).join('');

  try{
    const dates=await (await fetch('archive/dates.json')).json();
    const sel=document.getElementById('dsel');
    if(sel&&dates.length){
      sel.innerHTML=`<option value="">${EN?'Latest':'최신'}</option>`+dates.map(d=>`<option value="${d}"${d===QD?' selected':''}>${d}</option>`).join('');
      sel.onchange=()=>{ location.search = sel.value?('?date='+sel.value):''; };
    } else if(sel){ sel.style.display='none'; }
  }catch(e){ const s=document.getElementById('dsel'); if(s) s.style.display='none'; }
})();
</script>
</body>
</html>
