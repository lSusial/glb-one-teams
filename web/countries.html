<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KB 글로벌 데일리 브리핑 — 현지언론 Intelligence</title>
<!-- 데이터: export_json 이 아래 스크립트에 주입(오프라인). 없으면 countries.json fetch. -->
<script id="countries-data" type="application/json">null</script>
<style>
  :root{
    --kb-yellow:#FFBC00; --kb-dark:#545045; --kb-gold:#85754E; --kb-silver:#8A8D8F;
    --ink:#2b2926; --line:#e8e4dd; --card:#fff; --sub:#7a746c; --page:#dcd8d2;
    --c-fin:#2b5f9e; --c-dig:#6a3fb5; --c-esg:#2f7d4f; --c-risk:#b23b3b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 0}

  /* ── 마스트헤드 ── */
  .mast{position:relative;overflow:hidden;border-radius:14px;padding:20px 24px 22px;color:#fff;
        background:linear-gradient(135deg,#5c574f 0%,#4a453e 100%)}
  .mast .kbwm{position:absolute;right:-6px;top:-26px;font-size:132px;font-weight:900;color:rgba(255,255,255,.05);letter-spacing:-6px;pointer-events:none}
  .mast .row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
  .mast .kb{font-weight:800}
  .mast .kb b{color:var(--kb-yellow)}
  .mast .kb span{color:#d9d4cc;font-weight:600;margin-left:4px}
  .mast .rt{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#cfc9c0}
  .mast .en{border:1px solid rgba(255,188,0,.6);color:var(--kb-yellow);border-radius:20px;padding:2px 10px;font-weight:700;cursor:default}
  .mast .en .off{color:#a49c8f}
  .dsel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:2px 7px;font-size:12px;max-width:130px}
  .mast h1{position:relative;z-index:1;font-size:26px;font-weight:800;margin:14px 0 8px;line-height:1.2}
  .mast .sub{position:relative;z-index:1;font-size:12.5px;color:#cfc9c0}
  .nav{display:flex;gap:4px;margin:14px 0 0;overflow-x:auto}
  .nav a{font-size:12px;font-weight:700;color:var(--sub);text-decoration:none;padding:7px 0;border-radius:20px;border:1px solid var(--line);background:#fff;flex:1;text-align:center;white-space:nowrap}
  .nav a.on{background:var(--kb-dark);color:#fff;border-color:var(--kb-dark)}

  /* ── 섹션 카드 ── */
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
  .sec.accent{border-top:3px solid var(--kb-yellow)}
  .sec-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .num{flex:none;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:800;font-size:11px;
       display:flex;align-items:center;justify-content:center}
  .num.g{background:var(--kb-gold)} .num.y{background:var(--kb-yellow);color:var(--kb-dark)}
  .sec-h .tt{font-size:15px;font-weight:800}
  .sec-h .ds{font-size:12px;color:var(--sub);margin-top:2px}
  .sec-h .rt{margin-left:auto;font-size:12px;color:var(--sub)}

  /* ── 커버리지 ── */
  .cov{display:flex;flex-wrap:wrap;gap:7px}
  .cc{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fdfcfa;cursor:pointer}
  .cc:hover{border-color:var(--kb-silver)}
  .cc.sel{border-color:var(--kb-dark);box-shadow:inset 0 0 0 1px var(--kb-dark)}
  .cc.dim{opacity:.4}

  /* ── 필터 ── */
  .fil{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;font-weight:700;color:var(--sub)}
  .chip.on{background:var(--kb-dark);color:#fff;border-color:var(--kb-dark)}
  .chip .n{opacity:.55;font-weight:500;margin-left:4px}
  /* 카테고리 필터 칩(경제·금융·...) — 진출/미진출 토글(위 .chip.on)과 헷갈리지 않게 톤 분리 */
  .chip.cat{border-radius:8px}
  .chip.cat.on{background:#fdf6e3;color:var(--kb-gold);border-color:var(--kb-gold)}
  .chip.cat.on .n{color:var(--kb-gold)}
  .fil .sp{flex:1}.cnt{font-size:12px;color:var(--sub)}

  /* ── 기사 카드 ── */
  .feed{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .art{border:1px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;background:#fff;transition:box-shadow .1s}
  .art:hover{box-shadow:0 3px 12px rgba(0,0,0,.07)}
  .art .top{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:5px}
  .art .flag{font-size:15px}
  .badge{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:20px;color:#fff}
  .b-economy{background:#2b5f9e}.b-finance{background:#2f7d4f}.b-digital{background:#6a3fb5}.b-esg{background:#3a8a6a}.b-risk{background:#b23b3b}.b-geo{background:#7a5230}
  .art .top .ad{font-size:11px;color:var(--sub);margin-left:auto}
  .art .t{font-size:14px;font-weight:700;line-height:1.35;margin:0 0 6px;color:var(--ink)}
  .art .t .rc{font-size:11.5px;font-weight:600;color:var(--sub)}
  .art .q{color:#463f37;line-height:1.55}
  .rl{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
  .rl .rh{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:2px}
  .rl a{font-size:12.5px;color:var(--c-fin);font-weight:500}
  .empty{color:var(--sub);text-align:center;padding:34px;font-size:13px;line-height:1.7}
  /* ── 일일 브리핑 박스 ── */
  .brief{background:#fbf8ef;border:1px solid #efe6cf;border-left:3px solid var(--kb-yellow);border-radius:8px;padding:12px 14px;margin-bottom:12px}
  .brief .bh{font-size:12px;font-weight:800;color:var(--kb-gold);margin-bottom:6px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
  .brief .bh .bd{margin-left:auto;font-weight:600;color:var(--sub)}
  .brief .bt{font-size:13px;line-height:1.7;color:#3a352e}
  .brief .bt.bempty{color:var(--sub);font-weight:400}
  .brief .bt code{background:#efe7d2;padding:1px 5px;border-radius:4px;font-size:12px}

  /* ── 거시지표 빅넘버 ── */
  .bignum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .bnc{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fdfcfa}
  .bnc .bnl{font-size:11px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:4px}
  .bnc .bnl .note{cursor:help;opacity:.6}
  .bnc .bnv{font-size:16px;font-weight:800;color:var(--ink);margin-top:2px}
  .bnc .bnc2{font-size:11.5px;font-weight:700;margin-top:2px}
  .bnc .bnc2.up{color:#1e8a4c}
  .bnc .bnc2.down{color:#c23b3b}
  .bnc .bnc2.flat{color:var(--sub)}

  /* ── 푸터 ── */
  footer{text-align:center;color:var(--kb-silver);font-size:11.5px;letter-spacing:.5px;padding:22px 0 34px}
  footer .tag{color:var(--kb-gold);font-weight:800;letter-spacing:1px}

  /* ── 모달 ── */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
  .ov.on{display:flex}
  .modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:22px}
  .modal .x{float:right;cursor:pointer;color:var(--sub);font-size:22px;line-height:1}
  .modal .mt{font-size:12px;color:var(--sub);margin-bottom:6px}
  .modal h2{font-size:18px;margin:0 0 12px;line-height:1.35}
  .modal .s{margin:12px 0}.modal .s h3{font-size:12px;color:var(--kb-gold);margin:0 0 4px;font-weight:800}
  .modal .lk{display:inline-block;margin-top:10px;color:var(--c-fin);font-weight:600}
  a{color:var(--c-fin);text-decoration:none}a:hover{text-decoration:underline}

  @media(max-width:520px){
    .wrap{padding:12px 8px 0}
    .mast{padding:14px 14px 16px;border-radius:10px}
    .mast h1{font-size:21px;margin:10px 0 5px}
    .mast .kbwm{font-size:88px}
    .mast .sub{font-size:12px}
    .nav a{font-size:11px;padding:5px 0}
    .sec{padding:12px 11px;border-radius:10px;margin-top:10px}
    .art{padding:10px 11px}
    .nc{padding:10px 11px}
    .sec-h{margin-bottom:10px}
    .modal{padding:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="kbwm">KB</div>
    <div class="row">
      <span class="kb"><b>KB</b><span>금융그룹</span></span>
      <span class="rt"><span class="en">KR<span class="off"> / EN</span></span><select id="dsel" class="dsel"></select></span>
    </div>
    <h1 data-en="Country News">국가별 뉴스</h1>
    <div class="nav"><a href="brief.html" data-en="Today's Global">글로벌 원팀 뉴스</a><a class="on" href="countries.html" data-en="Country News">국가별 뉴스</a><a href="weekly.html" data-en="Weekly Report">주간 리포트</a><a href="topics.html" data-en="Monitoring">모니터링</a></div>
  </div>

  <div class="fil" id="presenceSel" style="margin:14px 0 0">
    <span class="chip on" data-p="presence">진출국</span>
    <span class="chip" data-p="non">KB 미진출국</span>
  </div>

  <section class="sec" id="secCov">
    <div class="sec-h"><div class="num g">🗺️</div>
      <div><div class="tt" data-en="Hub Coverage">거점 커버리지</div></div>
      <div class="rt" id="covRt"></div></div>
    <div class="cov" id="cov"></div>
  </section>

  <section class="sec accent" id="secFeed">
    <div class="sec-h"><div class="num y">📡</div>
      <div><div class="tt" id="feedTitle" data-en="Local Press Feed">현지언론 피드</div></div></div>
    <div id="bignum" class="bignum" style="display:none"></div>
    <div id="brief" class="brief" style="display:none"></div>
    <div class="fil" id="cats"></div>
    <div class="fil" style="margin-top:8px"><span class="sp"></span><span class="cnt" id="count"></span></div>
    <div class="feed" id="feed"></div>
  </section>

  <footer><div class="tag">CONNECTING PEOPLE, CREATING GLOBAL VALUE</div><div id="gen"></div></footer>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
(async function(){
  const P=new URLSearchParams(location.search), QD=P.get('date'), EN=P.get('lang')==='en';
  let DATA=null;
  if(QD){ try{ DATA=await (await fetch('archive/'+QD+'/countries.json')).json(); }catch(e){} }
  try{ if(!DATA) DATA=JSON.parse(document.getElementById('countries-data').textContent);}catch(e){}
  if(!DATA){ try{ DATA=await (await fetch('countries.json')).json(); }catch(e){} }
  if(!DATA){ document.querySelector('.wrap').innerHTML='<p class="empty">countries.json 이 없습니다. <code>python main.py export</code> 로 생성하세요.</p>'; return; }

  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md=s=>String(s||'').slice(5);   // 날짜 연도 제거(YYYY-MM-DD → MM-DD)
  const NAMES=EN?{GB:'UK',US:'US',HK:'Hong Kong',CN:'China',JP:'Japan',SG:'Singapore',IN:'India',VN:'Vietnam',MM:'Myanmar',ID:'Indonesia',KH:'Cambodia',GLOBAL:'Global'}
               :{GB:'영국',US:'미국',HK:'홍콩',CN:'중국',JP:'일본',SG:'싱가포르',IN:'인도',VN:'베트남',MM:'미얀마',ID:'인도네시아',KH:'캄보디아',GLOBAL:'글로벌'};
  const CATS=EN?[['','All'],['economy','Economy'],['finance','Banking'],['digital','Digital'],['esg','ESG'],['risk','Risk'],['geo','Geopolitics']]
              :[['','전체'],['economy','경제'],['finance','금융'],['digital','디지털'],['esg','ESG'],['risk','리스크'],['geo','지정학']];
  const gen=(DATA.generated_at||'').slice(0,16).replace('T',' ');
  document.getElementById('gen').textContent=(EN?'Updated ':'업데이트 ')+gen+(DATA.mode?(' · '+DATA.mode):'');

  const arts=[]; (DATA.countries||[]).forEach(c=>(c.articles||[]).forEach(a=>arts.push({...a,cc:c.cc,flag:c.flag})));
  const nonArts=(DATA.non_presence&&DATA.non_presence.articles)||[];
  document.getElementById('covRt').textContent='';

  let fCat='', fCC='', pMode='presence';
  const pool=()=>pMode==='non'?nonArts:(fCC?arts.filter(a=>a.cc===fCC):arts);
  const catCount=k=>{const p=pool();return k?p.filter(a=>(a.c||'').includes(k)).length:p.length;};

  document.getElementById('cats').innerHTML=CATS.map(([k,l])=>
    `<span class="chip cat${k===fCat?' on':''}" data-k="${k}">${l}<span class="n">${catCount(k)}</span></span>`).join('');
  document.getElementById('cats').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;fCat=c.dataset.k;render();};

  document.getElementById('cov').innerHTML=(DATA.countries||[]).map(c=>
    `<span class="cc${c.count?'':' dim'}" data-cc="${c.cc}"><span>${c.flag||''}</span>${NAMES[c.cc]||c.cc}</span>`).join('');
  document.getElementById('cov').onclick=e=>{const c=e.target.closest('.cc');if(!c)return;fCC=(fCC===c.dataset.cc?'':c.dataset.cc);render();};

  document.getElementById('presenceSel').onclick=e=>{
    const c=e.target.closest('.chip'); if(!c)return;
    pMode=c.dataset.p; fCat='';
    document.querySelectorAll('#presenceSel .chip').forEach(x=>x.classList.toggle('on',x.dataset.p===pMode));
    render();
  };
  if(EN) document.querySelectorAll('#presenceSel .chip').forEach(c=>{
    c.textContent=c.dataset.p==='presence'?'Presence':'KB Non-Presence';
  });

  const BL=EN?{economy:'Economy',finance:'Banking',digital:'Digital',esg:'ESG',risk:'Risk',geo:'Geopolitics'}:{economy:'경제',finance:'금융',digital:'디지털',esg:'ESG',risk:'리스크',geo:'지정학'};
  const badges=cstr=>(cstr||'').split(/\s+/).filter(Boolean).map(k=>{
    const lab=BL[k]; if(!lab)return'';
    return `<span class="badge b-${k}">${lab}</span>`;}).join(' ');

  const LANG=EN?'en':'ko';
  const tq=a=>EN?(a.q_en||a.q):(a.q||a.q_en), tk=a=>EN?(a.k_en||a.k):(a.k||a.k_en);
  const tt=a=>a.t;
  const enEl=document.querySelector('.en');
  if(enEl){ enEl.style.cursor='pointer';
    enEl.innerHTML=LANG==='en'?'<span class="off">KR / </span>EN':'KR<span class="off"> / EN</span>';
    enEl.onclick=()=>{ P.set('lang',LANG==='en'?'ko':'en'); location.search=P.toString(); }; }
  document.querySelectorAll('.nav a').forEach(a=>{ a.href=a.getAttribute('href').split('?')[0]+location.search; });
  if(EN) document.querySelectorAll('[data-en]').forEach(el=>{ el.textContent=el.getAttribute('data-en'); });

  // 거시지표 빅넘버 카드 — kind: 'fx'(환율) | 'index'(주가지수)
  const fmtNum=(v,d)=>v==null?'-':Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  function bnCard(ind){
    const isFx=ind.kind==='fx';
    const dec=isFx?(Math.abs(ind.value)>=100?0:(Math.abs(ind.value)>=1?2:4)):2;
    const lbl=isFx?'1 USD':(ind.label||ind.symbol);
    const val=isFx?`${fmtNum(ind.value,dec)} ${ind.symbol}`:fmtNum(ind.value,dec);
    let chCls='flat', chTxt='-';
    if(ind.change!=null&&ind.change_pct!=null){
      const up=ind.change>0, flat=ind.change===0;
      chCls=flat?'flat':(up?'up':'down');
      const arrow=flat?'':(up?'▲':'▼');
      chTxt=`${arrow} ${fmtNum(Math.abs(ind.change),dec)} (${flat?'':(up?'+':'-')}${fmtNum(Math.abs(ind.change_pct),2)}%)`;
    }
    const noteEl=ind.note?`<span class="note" title="${esc(ind.note)}">ⓘ</span>`:'';
    return `<div class="bnc"><div class="bnl">${esc(lbl)}${noteEl}</div><div class="bnv">${esc(val)}</div><div class="bnc2 ${chCls}">${esc(chTxt)}</div></div>`;
  }

  function render(){
    const secCov=document.getElementById('secCov'), feedTitle=document.getElementById('feedTitle');
    const catsEl=document.getElementById('cats'), bx=document.getElementById('brief'), feed=document.getElementById('feed');
    const bn=document.getElementById('bignum');

    // KB 미진출국 — 국가 구분 없는 통합 피드(네비 없음), 주제 필터만 유지
    if(pMode==='non'){
      secCov.style.display='none';
      feedTitle.textContent=EN?'KB Non-Presence Feed':'KB 미진출국 통합 피드';
      bx.style.display='none'; bn.style.display='none';
      catsEl.style.display='';
      catsEl.innerHTML=CATS.map(([k,l])=>`<span class="chip cat${k===fCat?' on':''}" data-k="${k}">${l}<span class="n">${catCount(k)}</span></span>`).join('');
      let rows=nonArts.filter(a=>!fCat||(a.c||'').includes(fCat));
      document.getElementById('count').textContent=rows.length+(EN?' articles':' 건');
      if(!rows.length){feed.innerHTML=`<div class="empty">${EN?'No articles for this filter.':'해당 조건의 기사가 없습니다.'}</div>`;feed._rows=[];return;}
      feed.innerHTML=rows.map((a,i)=>`<div class="art" data-i="${i}">
        <div class="top"><span class="flag">${a.flag||''}</span><b>${esc(EN?(a.cc_label_en||a.cc):(a.cc_label||a.cc))}</b>${badges(a.c)}<span class="ad">${esc(md(a.d))}</span></div>
        <div class="t">${esc(tt(a))}${a.related_count?` <span class="rc">· ${EN?`related ${a.related_count}`:`관련 ${a.related_count}건`}</span>`:''}</div>
        ${tq(a)?`<div class="q">${esc(tq(a))}</div>`:''}</div>`).join('');
      feed._rows=rows;
      return;
    }

    secCov.style.display='';
    feedTitle.textContent=EN?'Local Press Feed':'현지언론 피드';
    document.querySelectorAll('#cov .cc').forEach(c=>c.classList.toggle('sel',c.dataset.cc===fCC));

    // 국가 미선택 → 목록·브리핑·빅넘버 숨기고 안내
    if(!fCC){
      bx.style.display='none'; catsEl.style.display='none'; bn.style.display='none';
      document.getElementById('count').textContent='';
      feed.innerHTML=EN?'<div class="empty">Select a hub in <b>Hub Coverage</b> above to see its<br><b>daily briefing</b> and articles.</div>':'<div class="empty">위 <b>거점 커버리지</b>에서 국가를 선택하면<br>해당 거점의 <b>일일 브리핑</b>과 기사가 표시됩니다.</div>';
      feed._rows=[]; return;
    }

    catsEl.style.display='';
    catsEl.innerHTML=CATS.map(([k,l])=>`<span class="chip cat${k===fCat?' on':''}" data-k="${k}">${l}<span class="n">${catCount(k)}</span></span>`).join('');

    // 거시지표 빅넘버(환율·주가지수) — 국가에 데이터 있을 때만 노출
    const co=(DATA.countries||[]).find(c=>c.cc===fCC);
    const inds=(co&&co.indicators)||[];
    if(inds.length){ bn.style.display=''; bn.innerHTML=inds.map(bnCard).join(''); }
    else{ bn.style.display='none'; }

    // 일일 브리핑 박스 (전일+당일 AI 종합)
    const br=co&&co.brief;
    const btxt=br?(LANG==='en'?(br.en||br.ko):(br.ko||br.en)):'';
    const label=LANG==='en'?'Daily Briefing':'일일 브리핑';
    const bd=br&&br.date?`<span class="bd">${esc(br.date)}</span>`:'';
    bx.style.display='';
    bx.innerHTML=`<div class="bh">${NAMES[fCC]||fCC} · ${label}${bd}</div>`+
      (btxt?`<div class="bt">${esc(btxt)}</div>`
           :`<div class="bt bempty">${LANG==='en'?'No briefing generated yet.':'아직 브리핑이 생성되지 않았습니다. 맥북에서 <code>python main.py brief --type daily</code> 실행 후 export.'}</div>`);

    let rows=arts.filter(a=>(!fCat||(a.c||'').includes(fCat))&&a.cc===fCC);
    document.getElementById('count').textContent=rows.length+(EN?' articles · ':' 건 · ')+(NAMES[fCC]||fCC);
    if(!rows.length){feed.innerHTML=`<div class="empty">${EN?'No articles for this filter.':'해당 조건의 기사가 없습니다.'}</div>`;feed._rows=[];return;}
    feed.innerHTML=rows.map((a,i)=>`<div class="art" data-i="${i}">
      <div class="top"><span class="flag">${a.flag||''}</span>${badges(a.c)}<span class="ad">${esc(md(a.d))}</span></div>
      <div class="t">${esc(tt(a))}</div>
      ${tq(a)?`<div class="q">${esc(tq(a))}</div>`:''}
      ${(a.rl||[]).length?`<div class="rl">${(a.rl||[]).map(r=>`<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)} ↗</a>`).join('')}</div>`:''}</div>`).join('');
    feed._rows=rows;
  }
  document.getElementById('feed').onclick=e=>{
    const el=e.target.closest('.art'); if(!el||e.target.tagName==='A')return;
    const a=document.getElementById('feed')._rows[+el.dataset.i];
    document.getElementById('modal').innerHTML=`<span class="x" id="mx">×</span>
      <div class="mt">${a.flag||''} ${a.cc_label?esc(EN?(a.cc_label_en||a.cc_label):a.cc_label)+' · ':''}${esc(md(a.d))} ${badges(a.c)}</div>
      <h2>${esc(tt(a))}</h2>
      ${tq(a)?`<div class="s"><h3>${EN?'Summary':'요약'}</h3><div>${esc(tq(a))}</div></div>`:''}
      ${a.u?`<a class="lk" href="${esc(a.u)}" target="_blank" rel="noopener">${EN?'View source ↗':'원문 보기 ↗'}</a>`:''}`;
    document.getElementById('ov').classList.add('on');
  };
  document.getElementById('ov').onclick=e=>{if(e.target.id==='ov'||e.target.id==='mx')document.getElementById('ov').classList.remove('on');};
  render();

  try{
    const dates=await (await fetch('archive/dates.json')).json();
    const sel=document.getElementById('dsel');
    if(sel&&dates.length){
      sel.innerHTML=`<option value="">${EN?'Latest':'최신'}</option>`+dates.map(d=>`<option value="${d}"${d===QD?' selected':''}>${d}</option>`).join('');
      sel.onchange=()=>{ location.search = sel.value?('?date='+sel.value):''; };
    } else if(sel){ sel.style.display='none'; }
  }catch(e){ const s=document.getElementById('dsel'); if(s) s.style.display='none'; }
})();
</script>
</body>
</html>
