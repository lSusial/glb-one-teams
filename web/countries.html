<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>KB Global One Team — 국가별 뉴스</title>
<meta name="description" content="KB 글로벌 원팀 뉴스 — 진출·미진출국 현지언론"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap"/>
<link rel="stylesheet" href="shared-tokens.css"/>
<!-- 데이터: export_json 이 아래 스크립트에 주입(오프라인). 없으면 countries.json fetch. -->
<script id="countries-data" type="application/json">null</script>
<script src="shared-glossary.js"></script>
<script src="shared-modal.js"></script>
<style>
.pagettl{font-size:clamp(12.5px,1.9cqi,15px);color:var(--muted);margin:2px 2px 10px}
.chipbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.chipbar::-webkit-scrollbar{display:none}
.chipbar .cb{flex:none;display:flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line-2);
        padding:8px 15px;font-weight:700;font-size:clamp(12px,1.8cqi,14.5px);color:var(--ink-2);background:#fff}
.chipbar .cb[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.catbar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:4px 2px 4px;padding-bottom:2px}
.catbar::-webkit-scrollbar{display:none}
.catbar .cc-chip{flex:none;border-radius:999px;border:1px solid var(--line-2);padding:6px 12px;
        font-size:clamp(11px,1.7cqi,13px);font-weight:600;color:var(--muted);background:#fff}
.catbar .cc-chip[aria-selected="true"]{background:var(--gold-soft);color:#B67611;border-color:var(--gold)}
.catbar .cc-chip .n{opacity:.65;margin-left:3px}
.catbar .cc-chip.lk-chip{cursor:pointer}
.catbar .cc-chip.lk-chip:hover{border-color:var(--gold);color:var(--ink,#151515)}
.catbar .cc-chip.lk-chip[aria-selected="true"]{background:var(--gold-soft);color:#B67611;border-color:var(--gold)}
.lk-panel{background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:4px 14px 6px;margin:0 2px 12px}
.lksrc{margin:14px 0 6px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line-2);padding-bottom:5px}
.lksrc:first-of-type{margin-top:12px}
.lksrc .nm{font-size:13.5px;font-weight:600;color:var(--ink,#151515)}
.lksrc .n{font-size:11.5px;color:var(--muted)}
.lklist{list-style:none;margin:0 0 6px;padding:0}
.lka{display:block;text-decoration:none;color:inherit;padding:9px 4px;border-bottom:1px solid var(--line-1,rgba(0,0,0,.05))}
.lka:hover{background:var(--hover,rgba(0,0,0,.03))}
.lka .t{font-size:13.5px;line-height:1.4;color:var(--ink,#151515)}
.lka .m{margin-top:3px;font-size:11.5px;color:var(--muted)}
.pk{position:relative}
.pk .pin{position:absolute;top:-2px;right:2px;font-size:13px;line-height:1;color:var(--line-2);cursor:pointer;z-index:2;padding:2px}
.pk .pin.on{color:var(--gold)}
</style>
</head>
<body>
<script src="shared-sprite.js"></script>
<div class="shell">
  <header class="hd">
    <div class="hd-brand">
      <div class="brandline">
        <svg class="kbmark" width="30" height="22" style="color:var(--gold-2)" aria-hidden="true"><use href="#kb-mark"/></svg>
        <span>KB FINANCIAL GROUP</span>
      </div>
      <h1 class="en">GLOBAL ONE TEAM</h1>
      <div class="hd-sub"><b data-en="Country News">국가별 뉴스</b><i class="dot-live"></i></div>
    </div>
    <div class="hd-tools">
      <div class="langtoggle" role="group" aria-label="언어 선택">
        <button type="button" data-lang="ko" aria-pressed="true">KR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <div class="chipbar" id="pmode">
    <button class="cb" data-p="presence" aria-selected="true" data-en="Presence">진출국</button>
    <button class="cb" data-p="non" data-en="Non-presence">KB 미진출국</button>
  </div>

  <!-- 진출국: 국기 피커 + 국가 상세 패널 -->
  <div id="presWrap">
    <p class="pagettl" data-en="Pick a flag to see the country's briefing and local press">국기를 선택해 국가별 브리핑과 현지 뉴스를 확인하세요</p>
    <div class="picker" id="picker"></div>
    <div class="catbar" id="presCats"></div>
    <div class="lk-panel" id="lkPanelPres" hidden></div>
    <section class="card" id="detail" style="padding:14px 13px"></section>
  </div>

  <!-- 미진출국/KFI/인사동향: 평면 리스트(공용) -->
  <div id="flatWrap" style="display:none">
    <div class="npbar">
      <span class="np-ic" id="flatIco">🌐</span>
      <div class="np-tx">
        <span class="np-h" id="flatTitle"></span>
        <span class="np-d" id="flatDesc"></span>
      </div>
      <span class="np-r" id="flatMeta"></span>
    </div>
    <div class="catbar" id="flatCats"></div>
    <div class="lk-panel" id="lkPanelFlat" hidden></div>
    <ul class="nfeed" id="flatFeed"></ul>
  </div>

  <nav class="botnav" id="botnav">
    <a href="brief.html"><svg><use href="#ico-nav-home"/></svg><span data-en="Home">홈</span></a>
    <a class="on" href="countries.html"><svg><use href="#ico-nav-news"/></svg><span data-en="News">뉴스</span></a>
    <a href="topics.html"><svg><use href="#ico-nav-monitor"/></svg><span data-en="Monitoring">모니터링</span></a>
    <a href="weekly.html"><svg><use href="#ico-nav-weekly"/></svg><span data-en="Weekly">주간 브리핑</span></a>
  </nav>
</div>

<script>
(async function(){
  const P = new URLSearchParams(location.search), QD = P.get('date'), EN = P.get('lang') === 'en';
  let DATA = null;
  if (QD) { try { DATA = await (await fetch('archive/' + QD + '/countries.json')).json(); } catch(e){} }
  try { if (!DATA) DATA = JSON.parse(document.getElementById('countries-data').textContent); } catch(e){}
  if (!DATA) { try { DATA = await (await fetch('countries.json')).json(); } catch(e){} }
  if (!DATA) {
    document.querySelector('.wrap,.shell').innerHTML = `<p class="empty-state">countries.json 이 없습니다. <code>python main.py export</code> 로 생성하세요.</p>`;
    return;
  }

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md = (s) => String(s || '').slice(5);
  const svg = (id, w, h, cls) => `<svg ${cls?`class="${cls}" `:''}width="${w}" height="${h}" aria-hidden="true"><use href="#${id}"/></svg>`;

  function renderLinksPanel(panelSel, articles, open){
    const panel = $(panelSel);
    panel.hidden = !open;
    if (!open) { panel.innerHTML = ''; return; }
    const bySrc = new Map();
    for (const a of (articles||[])) {
      if (!a.u) continue;
      const src = a.src || (EN?'Other':'기타');
      if (!bySrc.has(src)) bySrc.set(src, []);
      bySrc.get(src).push(a);
    }
    const srcs = [...bySrc.entries()].sort((x,y) => y[1].length - x[1].length);
    panel.innerHTML = srcs.length ? srcs.map(([src,arts]) => `
      <div class="lksrc"><span class="nm">${esc(src)}</span><span class="n">${arts.length}</span></div>
      <ul class="lklist">${arts.map(a => `
        <li><a class="lka" href="${esc(a.u)}" target="_blank" rel="noopener noreferrer">
          <div class="t">${esc(EN?(a.t_en||a.t):(a.t||a.t_en))}</div>
          <div class="m">${a.d?esc(md(a.d)):''}</div>
        </a></li>`).join('')}</ul>`).join('') : `<div class="empty-state">${EN?'No links available.':'표시할 링크가 없습니다.'}</div>`;
  }
  const fnum = (v) => v == null ? '-' : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (Math.round(v*100)/100).toString());
  const NAMES = EN
    ? {GB:'UK',US:'US',HK:'Hong Kong',CN:'China',JP:'Japan',SG:'Singapore',IN:'India',VN:'Vietnam',MM:'Myanmar',ID:'Indonesia',KH:'Cambodia',TH:'Thailand',LA:'Laos',GLOBAL:'Global'}
    : {GB:'영국',US:'미국',HK:'홍콩',CN:'중국',JP:'일본',SG:'싱가포르',IN:'인도',VN:'베트남',MM:'미얀마',ID:'인도네시아',KH:'캄보디아',TH:'태국',LA:'라오스',GLOBAL:'글로벌'};
  const CATS = EN
    ? [['','All'],['economy','Economy'],['markets','Markets'],['tech','Tech'],['geopolitics','Geopolitics'],['policy','Policy'],['society','Society']]
    : [['','전체'],['economy','경제'],['markets','금융시장'],['tech','기술'],['geopolitics','지정학'],['policy','정책'],['society','사회']];
  const tq = (a) => EN ? (a.q_en || a.q) : (a.q || a.q_en);
  // 제목도 요약과 같은 규칙 — EN 모드에서 제목만 한국어로 남던 문제(2026-09-03)
  const tt = (a) => EN ? (a.t_en || a.t) : (a.t || a.t_en);
  const ccName = (a) => EN ? (a.cc_label_en || NAMES[a.cc] || a.cc) : (a.cc_label || NAMES[a.cc] || a.cc);

  const arts = []; (DATA.countries || []).forEach(c => (c.articles || []).forEach(a => arts.push({...a, cc:c.cc, flag:c.flag})));
  const nonArts = (DATA.non_presence && DATA.non_presence.articles) || [];

  let pMode = (P.get('tab') === 'non') ? 'non' : 'presence';
  let fCC = P.get('cc') || '', fCat = '', flatCat = '', lkPresOpen = false, lkFlatOpen = false;

  // ── 진출국: 국기 피커 ──
  // 국가 우선순위(하이브리드, 2026-09-12 피드백 8): 기본은 기사수 자동정렬 +
  // 관심국가 ★고정핀(localStorage, 브라우저별). 핀은 목록 맨 앞으로.
  const PIN_KEY = 'glb_pinned_cc';
  function loadPins(){ try { return new Set(JSON.parse(localStorage.getItem(PIN_KEY) || '[]')); } catch(e){ return new Set(); } }
  function savePins(st){ try { localStorage.setItem(PIN_KEY, JSON.stringify([...st])); } catch(e){} }
  let PINS = loadPins();
  function orderedCountries(){
    const cs = [...(DATA.countries || [])];
    const cmp = (a,b) => (b.count||0) - (a.count||0);   // 기본: 기사 많은(활발한) 거점 먼저
    const pinned = cs.filter(c => PINS.has(c.cc)).sort(cmp);
    const rest   = cs.filter(c => !PINS.has(c.cc)).sort(cmp);
    return [...pinned, ...rest];
  }
  function initPicker(){
    const cs = orderedCountries();
    $('#picker').innerHTML = cs.map((c) => {
      const on = PINS.has(c.cc);
      return `<button class="pk" data-cc="${c.cc}" aria-selected="false">
        <span class="pin${on?' on':''}" data-pin="${c.cc}" role="button" tabindex="0" title="${EN?'Pin to front':'관심국가 고정'}">${on?'★':'☆'}</span>
        ${svg('fl-'+c.cc.toLowerCase(), 44, 44)}<span>${esc(EN?(c.name_en||NAMES[c.cc]||c.cc):(c.name||NAMES[c.cc]||c.cc))}</span>
      </button>`;
    }).join('');
    document.querySelectorAll('.pk').forEach(p => p.addEventListener('click', () => { fCC = p.dataset.cc; renderPresence(); }));
    document.querySelectorAll('.pk .pin').forEach(el => el.addEventListener('click', (e) => {
      e.stopPropagation();
      const cc = el.dataset.pin;
      if (PINS.has(cc)) PINS.delete(cc); else PINS.add(cc);
      savePins(PINS); initPicker(); renderPresence();
    }));
    if (!fCC && cs.length) {
      const withNews = cs.filter(c => (c.count||0) > 0);
      fCC = (withNews[0] || cs[0]).cc;
    }
  }

  function pctHtml(pct){
    if (pct == null) return `<div class="bn-c flat">${EN?'No change':'변동 없음'}</div>`;
    const cls = Math.abs(pct) < 0.005 ? 'flat' : (pct > 0 ? 'up' : 'down');
    const ar = pct > 0 ? '▲' : (pct < 0 ? '▼' : '·');
    const sg = pct > 0 ? '+' : '';
    return `<div class="bn-c ${cls}">${ar} ${sg}${fnum(pct)}%</div>`;
  }
  function sparkSvg(vals){
    if (!vals || vals.length < 2) return '';
    const w=44,h=14,pad=1.5, min=Math.min(...vals), max=Math.max(...vals), range=(max-min)||1;
    const pts = vals.map((v,i) => {
      const x = pad + (w-2*pad)*i/(vals.length-1);
      const y = pad + (h-2*pad)*(1-(v-min)/range);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const col = vals[vals.length-1] >= vals[0] ? '#E0303F' : '#2563EB'; // 한국식: 상승=빨강
    return `<svg class="bn-spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  // indicators 테이블의 label은 config.py 정적 표(한국어 고정)에서 그대로 옴 —
  // 원천에 영어 필드가 없어 값이 고정된 짧은 목록이라 프론트에서 매핑.
  const IND_LABEL_EN = {
    '나스닥종합':'Nasdaq Composite', '항셍지수':'Hang Seng Index', '상하이종합':'Shanghai Composite',
    '닛케이225':'Nikkei 225', '자카르타종합':'Jakarta Composite', 'SET지수':'SET Index',
    'BOE 기준금리':'BOE Policy Rate', 'Fed 기준금리(상단)':'Fed Funds Rate (upper)',
    'HKMA 기준금리':'HKMA Base Rate', 'PBOC 7일 역레포':'PBOC 7-Day Reverse Repo',
    'BOJ 정책금리':'BOJ Policy Rate', 'RBI 레포금리':'RBI Repo Rate',
    'SBV 재할인금리':'SBV Refinancing Rate', 'BI-Rate(7일 역레포)':'BI Rate (7-Day Reverse Repo)',
    'CBM 정책금리':'CBM Policy Rate', 'BOT 정책금리':'BOT Policy Rate',
    '미국 10년물 국채':'US 10Y Treasury',
  };
  const indLabel = (l) => EN ? (IND_LABEL_EN[l] || l) : l;
  function bignum(ind){
    const noteEl = ind.note ? `<span title="${esc(ind.note)}" style="cursor:help;opacity:.6">ⓘ</span>` : '';
    if (ind.kind === 'policy_rate' || ind.kind === 'bond10y') {
      const sub = ind.kind === 'bond10y' ? ' bn-sub' : '';
      let cls='flat', txt=EN?'No change':'변동 없음';
      if (ind.change != null && ind.change !== 0) { const up = ind.change > 0; cls = up?'up':'down'; txt = `${up?'▲':'▼'} ${fnum(Math.abs(ind.change))}%p`; }
      return `<div class="bn${sub}"><div class="bn-l">${esc(indLabel(ind.label))}${noteEl}</div><div class="bn-v">${fnum(ind.value)}%</div><div class="bn-c ${cls}">${txt}</div></div>`;
    }
    const isFx = ind.kind === 'fx';
    const label = isFx ? '1 USD' : (indLabel(ind.label) || ind.symbol);
    const val = isFx ? `${fnum(ind.value)} ${ind.symbol}` : fnum(ind.value);
    return `<div class="bn"><div class="bn-l">${esc(label)}${noteEl}</div><div class="bn-v">${esc(val)}</div>${pctHtml(ind.change_pct)}${sparkSvg(ind.spark)}</div>`;
  }

  function renderPresence(){
    const co = (DATA.countries || []).find(c => c.cc === fCC);
    document.querySelectorAll('.pk').forEach(p => p.setAttribute('aria-selected', String(p.dataset.cc === fCC)));
    if (!co) { $('#detail').innerHTML = `<div class="empty-state">${EN?'Select a hub above.':'위에서 거점을 선택하세요.'}</div>`; renderLinksPanel('#lkPanelPres', [], false); return; }

    const catCount = (k) => { const rows = (co.articles||[]); return k ? rows.filter(a => (a.c||'').includes(k)).length : rows.length; };
    $('#presCats').innerHTML = CATS.map(([k,l]) => `<span class="cc-chip" data-k="${k}" aria-selected="${k===fCat}">${l}<span class="n">${catCount(k)}</span></span>`).join('')
      + `<span class="cc-chip lk-chip" data-lk="1" aria-selected="${lkPresOpen}">🔗 ${EN?'Links':'원문 링크'}</span>`;
    renderLinksPanel('#lkPanelPres', co.articles||[], lkPresOpen);
    $('#presCats').onclick = (e) => {
      const lk = e.target.closest('.lk-chip'); if (lk) { lkPresOpen = !lkPresOpen; renderPresence(); return; }
      const c = e.target.closest('.cc-chip'); if (!c) return; fCat = c.dataset.k; renderPresence();
    };

    const active = (co.count || 0) > 0;
    const st = active ? `<span class="dstatus on">${EN?'News':'뉴스'} ${co.count}${EN?'':'건'}</span>` : `<span class="dstatus off">${EN?'Watch':'관찰'}</span>`;
    const bns = (co.indicators || []).map(bignum).join('');
    const brief = co.brief || {};
    const briefTxt = EN ? (brief.en || brief.ko) : (brief.ko || brief.en);
    const rows = (co.articles || []).filter(a => !fCat || (a.c||'').includes(fCat));
    let feed;
    if (rows.length) {
      feed = `<ul class="feed">` + rows.map((a,i) => `
        <li class="fitem" data-i="${i}">
          <div class="fi-t">${esc(tt(a))}</div>
          ${tq(a)?`<div class="fi-q">${esc(tq(a))}</div>`:''}
          <div class="fi-m"><span class="src">${esc(a.src||'')}</span>${a.d?`<span>${esc(md(a.d))}</span>`:''}
            <span style="margin-left:auto">${svg('ico-chev-r',15,15)}</span></div>
        </li>`).join('') + `</ul>`;
    } else {
      feed = `<div class="dnote">${EN?'No local press articles collected recently · monitoring':'최근 수집된 현지 언론 기사가 없습니다 · 모니터링 중'}</div>`;
    }
    $('#detail').innerHTML = `
      <div class="dhead">
        <span class="fbar" style="border-left-color:${active?'var(--gold)':'var(--line-2)'}">${svg('flr-'+co.cc.toLowerCase(),40,40,'rflag')}</span>
        <div style="min-width:0">
          <div class="dname">${esc(EN?(co.name_en||NAMES[co.cc]||co.cc):(co.name||NAMES[co.cc]||co.cc))} <span class="cc">${esc(co.cc)}</span></div>
          <div class="dmeta">KB ${EN?'Presence':'진출'}${st}</div>
        </div>
      </div>
      <div class="bignums">${bns}</div>
      ${briefTxt ? `<div class="dsec-t"><span class="bar"></span>${EN?'Daily Briefing':'국가 일일 브리핑'}</div><p class="dbrief">${esc(briefTxt)}</p>` : ''}
      <div class="dsec-t"><span class="bar"></span>${EN?'Local Press':'현지언론 피드'}</div>
      ${feed}`;
    $('#detail')._rows = rows;
    $('#detail').onclick = (e) => {
      const el = e.target.closest('.fitem'); if (!el) return;
      const a = $('#detail')._rows[+el.dataset.i];
      if (a) openArticleModal(a);
    };
  }

  // ── 평면 리스트(미진출국 전용, 한국계 금융기관·인사동향은 모니터링 탭으로 이전 2026-09-08) ──
  const FLAT_CFG = {
    non:        { ico:'🌐', h:EN?'KB Non-Presence Feed':'KB 미진출국 통합 피드', d:EN?'Markets with Korean banks but no KB entity — merged feed':'한국계 은행은 있지만 KB는 없는 시장의 통합 피드', src:() => nonArts, cats:true, rel:true },
  };
  function renderFlat(){
    const cfg = FLAT_CFG[pMode];
    $('#flatIco').textContent = cfg.ico;
    $('#flatTitle').textContent = cfg.h;
    $('#flatDesc').textContent = cfg.d;
    let rows = cfg.src();
    $('#flatMeta').textContent = rows.length + (EN?' articles':'건');
    if (cfg.cats) {
      $('#flatCats').style.display = '';
      const catCount = (k) => k ? rows.filter(a => (a.c||'').includes(k)).length : rows.length;
      $('#flatCats').innerHTML = CATS.map(([k,l]) => `<span class="cc-chip" data-k="${k}" aria-selected="${k===flatCat}">${l}<span class="n">${catCount(k)}</span></span>`).join('')
        + `<span class="cc-chip lk-chip" data-lk="1" aria-selected="${lkFlatOpen}">🔗 ${EN?'Links':'원문 링크'}</span>`;
      renderLinksPanel('#lkPanelFlat', cfg.src(), lkFlatOpen);
      $('#flatCats').onclick = (e) => {
        const lk = e.target.closest('.lk-chip'); if (lk) { lkFlatOpen = !lkFlatOpen; renderFlat(); return; }
        const c = e.target.closest('.cc-chip'); if (!c) return; flatCat = c.dataset.k; renderFlat();
      };
      rows = rows.filter(a => !flatCat || (a.c||'').includes(flatCat));
    } else {
      $('#flatCats').style.display = '';
      $('#flatCats').innerHTML = `<span class="cc-chip lk-chip" data-lk="1" aria-selected="${lkFlatOpen}">🔗 ${EN?'Links':'원문 링크'}</span>`;
      renderLinksPanel('#lkPanelFlat', cfg.src(), lkFlatOpen);
      $('#flatCats').onclick = (e) => { if (e.target.closest('.lk-chip')) { lkFlatOpen = !lkFlatOpen; renderFlat(); } };
    }
    if (!rows.length) {
      $('#flatFeed').innerHTML = `<div class="empty-state">${EN?'No articles for this filter.':'해당 조건의 기사가 없습니다.'}</div>`;
      $('#flatFeed')._rows = [];
      return;
    }
    $('#flatFeed').innerHTML = rows.map((a,i) => `
      <li class="nfitem" data-i="${i}">
        <span class="nf-tag"><span class="fg">${esc(a.flag||'')}</span>${esc(ccName(a))}</span>
        <div class="nf-t">${esc(tt(a))}${cfg.rel && a.related_count ? ` <span class="nf-rel">· ${EN?`related ${a.related_count}`:`관련 ${a.related_count}건`}</span>` : ''}</div>
        ${tq(a)?`<div class="nf-q">${esc(tq(a))}</div>`:''}
        <div class="nf-m"><span class="src">${esc(a.src||'')}</span>${a.d?`<span>${esc(md(a.d))}</span>`:''}${svg('ico-chev-r',14,14,'ar')}</div>
      </li>`).join('');
    $('#flatFeed')._rows = rows;
  }
  $('#flatFeed').addEventListener('click', (e) => {
    const el = e.target.closest('.nfitem'); if (!el) return;
    const a = ($('#flatFeed')._rows || [])[+el.dataset.i];
    if (a) openArticleModal(a);
  });

  function render(){
    document.querySelectorAll('#pmode .cb').forEach(b => b.setAttribute('aria-selected', String(b.dataset.p === pMode)));
    if (pMode === 'presence') {
      $('#presWrap').style.display = ''; $('#flatWrap').style.display = 'none';
      renderPresence();
    } else {
      $('#presWrap').style.display = 'none'; $('#flatWrap').style.display = '';
      renderFlat();
    }
  }

  $('#pmode').onclick = (e) => {
    const b = e.target.closest('.cb'); if (!b) return;
    pMode = b.dataset.p; flatCat = '';
    render();
  };

  initPicker();
  render();

  // 언어 토글
  document.querySelectorAll('.langtoggle button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.lang === (EN ? 'en' : 'ko')));
    b.addEventListener('click', () => { P.set('lang', b.dataset.lang); location.search = P.toString(); });
  });
  if (EN) document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.getAttribute('data-en'); });

  // ?date/?lang 보존한 채 하단 내비 이동(자체 쿼리 있는 링크는 그 값 유지)
  const carry = new URLSearchParams(location.search); carry.delete('tab');
  document.querySelectorAll('.botnav a').forEach(a => {
    const [path, ownQuery] = a.getAttribute('href').split('?');
    const merged = new URLSearchParams(ownQuery || '');
    for (const [k,v] of carry) merged.set(k, v);
    const qs = merged.toString();
    a.href = path + (qs ? '?' + qs : '');
  });
})();
</script>
</body>
</html>
